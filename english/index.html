<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>بوابة الإنجليزية — المنظومة</title>
<style>
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #0f1115; color: #e8e6e3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
  h1 { color: #d4af37; font-size: 2rem; margin-bottom: 16px; }
  .desc { color: #9a958c; max-width: 560px; line-height: 1.8; }
  .badge { display: inline-block; margin-top: 24px; font-size: .85rem; padding: 6px 18px; border-radius: 999px; background: #2a2410; color: #d4af37; border: 1px solid #4a4020; }
  a.back { margin-top: 36px; color: #8f8a80; font-size: .85rem; text-decoration: none; }
  a.back:hover { color: #d4af37; }

  @media (prefers-color-scheme: light) {
    body { background: #f6f4ef; color: #2b2b28; }
    h1, .gate h2 { color: #8a6d1f; }
    .sub, .desc, .gate .owner, footer { color: #6b675f; }
    .gate { background: #ffffff; border-color: #ddd8cc; }
    .gate:hover { border-color: #8a6d1f; }
    .badge { background: #f4ecd8; color: #8a6d1f; border-color: #d9cba4; }
    a.back { color: #6b675f; }
    a.back:hover { color: #8a6d1f; }
  }
</style>
</head>
<body>
<h1>بوابة الإنجليزية</h1>
<p class="desc">بنية الإنجليزية: بروفايل كلمات المتعلم · قافلة shortform · نصوص بحد 5% مجهول · نمو القاعدة بالمراجعة المتباعدة. المالك: الباحث.</p>
<span class="badge">قيد البناء</span>
<a class="back" href="../">← العودة إلى البوابة الأم</a>
</body>
</html>
