<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<title>المفسِّر — موقع التفسير | بوابة التفسير</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #0f1115; color: #e8e6e3; min-height: 100vh; margin: 0; }
  header { background: #171a21; border-bottom: 2px solid #d4af37; padding: 18px 20px 14px; position: sticky; top: 0; z-index: 10; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 18px; }
  h1 { color: #d4af37; font-size: 1.35rem; margin: 0 0 2px; }
  header .sub { color: #9a958c; font-size: .82rem; margin-bottom: 12px; }
  .pick { display: flex; gap: 10px; }
  .pick > div { flex: 1; }
  label { display: block; color: #9a958c; font-size: .75rem; margin-bottom: 4px; }
  select { width: 100%; padding: 9px 12px; font-size: .95rem; font-family: inherit; background: #0f1115; color: #e8e6e3; border: 1px solid #3a3e48; border-radius: 8px; cursor: pointer; }
  select:focus { border-color: #d4af37; outline: none; }
  #ayahSel { text-align: center; }
  main { padding: 26px 0 60px; }
  .shead { text-align: center; color: #9a958c; font-size: .85rem; margin-bottom: 18px; }
  .shead b { color: #d4af37; font-size: 1.15rem; display: block; margin-bottom: 4px; }
  .mushaf { background: #171a21; border: 1px solid #2a2e38; border-radius: 14px; padding: 26px 24px; font-size: 1.45rem; line-height: 2.4; text-align: justify; }
  .v { cursor: pointer; border-radius: 6px; padding: 0 2px; transition: background .15s; }
  .v:hover { background: #2a2e38; }
  .v.sel { background: rgba(212,175,55,.18); }
  .vn { color: #d4af37; font-size: .85rem; display: inline-flex; width: 1.9em; height: 1.9em; border: 1px solid #d4af37; border-radius: 50%; align-items: center; justify-content: center; margin: 0 6px; vertical-align: middle; }
  #tafWrap { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 50; align-items: flex-end; justify-content: center; }
  #tafBox { width: 100%; max-width: 760px; max-height: 82vh; overflow-y: auto; background: #10141b; border: 1px solid #2a2e38; border-top: 3px solid #d4af37; border-radius: 16px 16px 0 0; padding: 18px 22px 24px; }
  #tafBox .ref { color: #d4af37; font-weight: 700; margin-bottom: 10px; font-size: 1rem; }
  #tafBox .ayahT { color: #e8e6e3; font-size: 1.3rem; line-height: 2.1; margin-bottom: 14px; }
  #tafBox .lbl { color: #9a958c; font-size: .8rem; margin-bottom: 6px; border-top: 1px solid #2a2e38; padding-top: 12px; }
  #tafBox .txt { color: #d8d3c8; font-size: 1rem; line-height: 2; }
  #tafBox .row { display: flex; gap: 10px; justify-content: space-between; margin-top: 16px; }
  #tafBox .row button { flex: 1; background: #171a21; border: 1px solid #3a3e48; color: #e8e6e3; border-radius: 10px; padding: 10px; font-size: .88rem; cursor: pointer; font-family: inherit; }
  #tafBox .row button:hover { border-color: #d4af37; color: #d4af37; }
  #tafBox .row button:disabled { opacity: .35; }
  #tafBox .close { float: left; background: none; border: 1px solid #3a3e48; color: #9a958c; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-family: inherit; }
  .nav { display: flex; justify-content: space-between; margin-top: 26px; }
  .nav button, .nav a { background: #171a21; border: 1px solid #3a3e48; color: #e8e6e3; border-radius: 10px; padding: 10px 16px; font-size: .88rem; cursor: pointer; font-family: inherit; text-decoration: none; }
  .nav button:hover, .nav a:hover { border-color: #d4af37; color: #d4af37; }
  footer { text-align: center; color: #6b675f; font-size: .76rem; margin-top: 34px; }

  body.light { background: #f5f3ef; color: #1f2430; }
  body.light header { background: #fff; border-bottom-color: #8a6d1f; }
  body.light h1, body.light .shead b { color: #8a6d1f; }
  body.light .sub, body.light label, body.light .shead { color: #5d594f; }
  body.light select { background: #fff; color: #1f2430; border-color: #d5d0c2; }
  body.light .mushaf { background: #fff; border-color: #e0dbc9; }
  body.light .v:hover { background: #efe9d8; }
  body.light .v.sel { background: #f0e6c8; }
  body.light .vn { color: #8a6d1f; border-color: #8a6d1f; }
  body.light #tafBox { background: #fff; border-color: #e0dbc9; border-top-color: #8a6d1f; }
  body.light #tafBox .ref { color: #8a6d1f; }
  body.light #tafBox .ayahT { color: #1f2430; }
  body.light #tafBox .txt { color: #33302a; }
  body.light #tafBox .lbl { border-top-color: #e0dbc9; }
  body.light #tafBox .row button { background: #fff; color: #1f2430; border-color: #d5d0c2; }
  body.light #tafBox .row button:hover { border-color: #8a6d1f; color: #8a6d1f; }
  body.light .nav button, body.light .nav a { background: #fff; color: #1f2430; border-color: #d5d0c2; }
  body.light .nav button:hover, body.light .nav a:hover { border-color: #8a6d1f; color: #8a6d1f; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>المفسِّر</h1>
    <div class="sub">نص الآية بتفسير السعدي — اختر السورة، تصفّح الآيات، انقر أي آية لقراءة تفسيرها.</div>
    <div class="pick">
      <div><label for="surahSel">السورة</label><select id="surahSel"></select></div>
      <div><label for="ayahSel">الآية</label><select id="ayahSel"></select></div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="shead"><b id="sname"></b><span id="scount"></span></div>
  <div class="mushaf" id="mushaf"><div style="text-align:center;color:#6b675f;font-size:1rem">جارٍ تحميل المصحف والتفسير…</div></div>
  <div id="tafWrap"><div id="tafBox"><button class="close" id="tclose">إغلاق ✕</button><div class="ref" id="tref"></div><div class="ayahT" id="tayah"></div><div class="lbl">التفسير — السعدي</div><div class="txt" id="ttxt"></div><div class="row"><button id="tprev">الآية السابقة ←</button><button id="tnext">← الآية التالية</button></div></div></div>
  <div class="nav">
    <button id="prevS">السورة السابقة ←</button>
    <a href="../">← بوابة التفسير</a>
    <button id="nextS">← السورة التالية</button>
  </div>
  <footer>المصدر: تفسير السعدي «تيسير الكريم الرحمن» — نص المصحف والتفسير من بيانات QUL/quran.com</footer>
</main>

<button id="lm" style="position:fixed;top:12px;left:12px;z-index:99;background:#171a21;border:1px solid #3a3e48;color:#e8e6e3;border-radius:999px;padding:6px 14px;font-size:.78rem;cursor:pointer;font-family:inherit">☀ فاتح</button>
<script>
(function(){var b=document.getElementById('lm'),L=function(l){document.body.classList.toggle('light',l);b.textContent=l?'🌙 داكن':'☀ فاتح';b.style.background=l?'#fff':'#171a21';b.style.color=l?'#1f2430':'#e8e6e3';b.style.borderColor=l?'#d5d0c2':'#3a3e48';try{localStorage.setItem('lm',l?'1':'0')}catch(e){}};var s=null;try{s=localStorage.getItem('lm')}catch(e){};L(s==='1'||(s===null&&matchMedia('(prefers-color-scheme: light)').matches));b.onclick=function(){L(!document.body.classList.contains('light'))};})();
</script>
<script>
var SURAHS=null,cache={},cur={s:1,a:0};
var surahSel=document.getElementById('surahSel'),ayahSel=document.getElementById('ayahSel'),
    mushaf=document.getElementById('mushaf'),sname=document.getElementById('sname'),
    scount=document.getElementById('scount'),tafBox=document.getElementById('tafBox'),
    tref=document.getElementById('tref'),ttxt=document.getElementById('ttxt'),
    tafWrap=document.getElementById('tafWrap'),tayah=document.getElementById('tayah'),
    tprev=document.getElementById('tprev'),tnext=document.getElementById('tnext');

fetch('data/chapters.json').then(function(r){return r.json()}).then(function(d){
  SURAHS=d.chapters;
  surahSel.innerHTML=SURAHS.map(function(c){return '<option value="'+c.id+'">'+c.id+'. '+c.name_arabic+'</option>'}).join('');
  render(1);
});

surahSel.onchange=function(){ render(+surahSel.value); };
ayahSel.onchange=function(){ var a=+ayahSel.value; if(a) openTaf(cur.s,a,true); };
document.getElementById('prevS').onclick=function(){ if(cur.s>1) render(cur.s-1); };
document.getElementById('nextS').onclick=function(){ if(cur.s<114) render(cur.s+1); };
document.getElementById('tclose').onclick=closeTaf;
tafWrap.onclick=function(e){ if(e.target===tafWrap)closeTaf(); };
tprev.onclick=function(){ stepTaf(-1); };
tnext.onclick=function(){ stepTaf(1); };
function closeTaf(){ tafWrap.style.display='none'; var x=mushaf.querySelector('.sel'); if(x)x.classList.remove('sel'); cur.a=0; }
function stepTaf(d){
  var a=cur.a+d; if(a<1||a>SURAHS[cur.s-1].verses_count)return;
  openTaf(cur.s,a,false);
}

function render(s){
  cur={s:s,a:0}; surahSel.value=s;
  sname.textContent=SURAHS[s-1].name_arabic;
  scount.textContent='عدد آياتها '+SURAHS[s-1].verses_count;
  tafBox.style.display='none';
  mushaf.innerHTML='<div style="text-align:center;color:#6b675f;font-size:1rem">جارٍ التحميل…</div>';
  var go=function(d){
    var html='';
    for(var i=1;i<=SURAHS[s-1].verses_count;i++){
      var v=d[String(i)]; if(!v||!v.t)continue;
      html+='<span class="v" data-a="'+i+'">'+v.t+'</span><span class="vn">'+i+'</span> ';
    }
    mushaf.innerHTML=html||'<div style="text-align:center;color:#6b675f;font-size:1rem">لا نص.</div>';
    ayahSel.innerHTML=''; for(var i=1;i<=SURAHS[s-1].verses_count;i++){var o=document.createElement('option');o.value=i;o.textContent=i;ayahSel.appendChild(o);}
    mushaf.querySelectorAll('.v').forEach(function(el){ el.onclick=function(){ openTaf(s,+el.dataset.a,true); }; });
    window.scrollTo({top:0});
  };
  if(cache[s]){ go(cache[s]); } else {
    fetch('data/'+s+'.json').then(function(r){return r.json()}).then(function(d){ cache[s]=d; go(d); })
    .catch(function(){ mushaf.innerHTML='<div style="text-align:center;color:#6b675f;font-size:1rem">تعذر تحميل هذه السورة.</div>'; });
  }
}

function openTaf(s,a,scroll){
  var d=cache[s]; if(!d)return;
  cur.a=a; ayahSel.value=a;
  mushaf.querySelectorAll('.sel').forEach(function(e){e.classList.remove('sel')});
  var el=mushaf.querySelector('[data-a="'+a+'"]'); if(el){el.classList.add('sel'); if(scroll)el.scrollIntoView({block:'center'});}
  var v=d[String(a)]||{};
  tref.textContent=SURAHS[s-1].name_arabic+' — آية '+a;
  tayah.textContent=v.t?v.t+' ﴿'+a+'﴾':'';
  ttxt.textContent=v.f?v.f:'لا يوجد تفسير مستقل لهذه الآية عند السعدي — تُفسَّر ضمن ما قبلها أو بعدها.';
  tprev.disabled=(a<=1); tnext.disabled=(a>=SURAHS[s-1].verses_count);
  tafWrap.style.display='flex';
}
</script>
</body>
</html>
