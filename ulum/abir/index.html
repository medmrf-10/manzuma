<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<title>الفهرس الموحد العابر — أربعة متون مالكية</title>
<style>
  :root{--bg:#0f1419;--card:#1a222b;--ink:#e8e2d4;--dim:#9a9384;--acc:#c9a227;--acc2:#2e7d5b;--acc3:#3d6b8e;--acc4:#8e5a9e;--acc5:#b08830;--warn:#b0563a;--line:#2a3440;--bar:#0f1419f2;--tocbg:#11171d;--hov:#22303d}
  body.light{--bg:#f6f3ec;--card:#fdfcf8;--ink:#2a2620;--dim:#6b6357;--acc:#8a6d14;--acc2:#2e7d5b;--acc3:#3d6b8e;--acc4:#8e5a9e;--acc5:#8a6a10;--warn:#b0563a;--line:#e0d9c9;--bar:#f6f3ecf2;--tocbg:#f6f3ec;--hov:#efe9dc}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}

  .top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid var(--acc);background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top))}
  .top h1{font-size:1rem;color:var(--acc);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:10px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;text-decoration:none}
  .icon-btn:active{border-color:var(--acc)}

  .scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  aside.toc{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(320px,88vw);background:var(--tocbg);z-index:50;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .28s ease;box-shadow:-8px 0 30px #0008}
  aside.toc.open{transform:none}
  .toc-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .toc-head b{color:var(--acc);flex:1;font-size:.95rem;line-height:1.5}
  .toc-head .x{width:38px;height:38px;border:none;background:transparent;color:var(--dim);font-size:1.3rem;cursor:pointer;border-radius:8px}
  .toc-search{padding:10px 14px;border-bottom:1px solid var(--line)}
  .toc-search input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;font-family:inherit}
  nav.toc-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  a.ti{display:block;padding:12px 16px;color:var(--ink);text-decoration:none;font-size:.92rem;border-bottom:1px solid var(--line);line-height:1.7;min-height:48px}
  a.ti:active,a.ti.on{background:var(--hov)}
  a.ti.on{border-inline-start:4px solid var(--acc);color:var(--acc)}
  a.ti .dots{display:flex;gap:5px;margin-top:4px}
  a.ti .d{width:8px;height:8px;border-radius:50%;border:1px solid var(--line)}
  a.ti .d.r{background:var(--acc)}a.ti .d.a{background:var(--acc3)}a.ti .d.m{background:var(--acc4)}a.ti .d.k{background:var(--acc5)}
  a.ti .d.off{background:transparent;opacity:.4}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 150px}
  .sec-title{font-size:1.3rem;color:var(--acc);margin-bottom:10px;line-height:1.6}
  .meta-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.78rem;color:var(--dim);line-height:1.8}
  .matn{font-size:1.13rem;line-height:2.35;white-space:pre-wrap;text-align:justify}
  .blk{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .blk.r{border-inline-start:3px solid var(--acc)} .blk.a{border-inline-start:3px solid var(--acc3)} .blk.m{border-inline-start:3px solid var(--acc4)} .blk.k{border-inline-start:3px solid var(--acc5)}
  .bknm{font-size:.68rem;font-weight:700;margin-bottom:6px}
  .blk.r .bknm{color:#e8c96a} .blk.a .bknm{color:#7fb3d8} .blk.m .bknm{color:#c79ad5} .blk.k .bknm{color:#dab95e}
  .ttl{display:block;width:100%;text-align:start;background:var(--hov);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:inherit;font-size:1.05rem;line-height:1.8;padding:14px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:56px}
  .ttl .pgn{font-size:.66rem;border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--dim);flex:none}
  .ttl .caret{margin-inline-start:auto;color:var(--acc);font-size:1rem;flex:none}
  .ttl:active{border-color:var(--acc);background:var(--card)}
  .back{display:flex;align-items:center;gap:8px;width:100%;text-align:start;background:var(--card);border:1px solid var(--acc);border-radius:12px;color:var(--acc);font-family:inherit;font-size:1rem;padding:13px 16px;margin-bottom:14px;cursor:pointer;min-height:52px}
  .matn{font-size:1.15rem;line-height:2.4;white-space:pre-wrap;text-align:justify;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
  .gapbox{background:var(--card);border:1px dashed var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.8rem;color:var(--warn)}
  .rev{display:flex;gap:8px;padding:10px 14px;margin-bottom:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .rev span{font-size:.72rem;color:var(--dim);flex:1}
  .rev button{height:38px;min-width:80px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;font-size:.82rem;cursor:pointer}
  .rev button.ok.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
  .rev button.no.on{background:var(--warn);color:#fff;border-color:var(--warn)}
  .loading{color:var(--dim);text-align:center;padding:60px 20px}
  .legend{display:flex;gap:12px;padding:0 0 14px;flex-wrap:wrap}
  .legend span{font-size:.7rem;color:var(--dim);display:flex;align-items:center;gap:5px}
  .legend .d{width:9px;height:9px;border-radius:50%;border:1px solid var(--line)}
  .legend .d.r{background:var(--acc)}.legend .d.a{background:var(--acc3)}.legend .d.m{background:var(--acc4)}.legend .d.k{background:var(--acc5)}

  .bnav{position:fixed;bottom:0;inset-inline:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--bar);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:30}
  .bnav .row{display:flex;gap:10px}
  .bnav .row button{flex:1;height:50px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:12px;font-size:.95rem;font-family:inherit;cursor:pointer}
  .bnav button:active{border-color:var(--acc);background:var(--hov)}
  .bnav button.dis{opacity:.3;pointer-events:none}
  .bnav .pos{flex:none;align-self:center;color:var(--dim);font-size:.72rem;min-width:52px;text-align:center}

  @media(min-width:860px){
    body{flex-direction:row}
    .top{display:none}
    aside.toc{position:static;transform:none;width:320px;min-width:280px;box-shadow:none;border-inline-end:1px solid var(--line);flex:none}
    .scrim{display:none}
    .bnav{inset-inline-start:320px}
    main{max-width:820px;margin:0 auto;padding:28px 30px 150px}
  }
</style>
</head>
<body>

<header class="top">
  <button class="icon-btn" id="openToc" aria-label="الفهرس">☰</button>
  <h1>الفهرس الموحد العابر — الرسالة · الأخضري · أسهل المسالك · مختصر خليل</h1>
  <a class="icon-btn" href="../" aria-label="البوابة">⌂</a>
  <button class="icon-btn thb" aria-label="المظهر">☀</button>
</header>

<div class="scrim" id="scrim"></div>
<aside class="toc" id="tocPane">
  <div class="toc-head"><b>الفهرس الموحد — <span id="tocn">…</span> عنواناً</b><button class="x thb" aria-label="المظهر">☀</button><button class="x" id="closeToc" aria-label="إغلاق">✕</button></div>
  <div class="toc-search"><input type="search" id="tq" placeholder="ابحث في العناوين…"></div>
  <nav class="toc-list" id="toc"></nav>
</aside>

<main id="art"><p class="loading">جارٍ التحميل…</p></main>

<div class="bnav">
  <div class="row">
    <button id="prev">← السابق</button>
    <span class="pos" id="pos"></span>
    <button id="next">التالي →</button>
  </div>
</div>

<script>
const pane=document.getElementById('tocPane'),scrim=document.getElementById('scrim');
const thBs=[...document.querySelectorAll('.thb')];
const setTh=l=>{document.body.classList.toggle('light',l);thBs.forEach(b=>b.textContent=l?'☾':'☀');try{localStorage.setItem('ulum-th',l?'l':'d')}catch(e){}};
try{setTh(localStorage.getItem('ulum-th')==='l')}catch(e){setTh(false)}
thBs.forEach(b=>b.onclick=()=>setTh(!document.body.classList.contains('light')));
document.getElementById('openToc').onclick=()=>{pane.classList.add('open');scrim.classList.add('open')};
const close=()=>{pane.classList.remove('open');scrim.classList.remove('open')};
document.getElementById('closeToc').onclick=close; scrim.onclick=close;

const BOOKS={r:{cls:'r'},a:{cls:'a'},m:{cls:'m'},k:{cls:'k'}};
fetch('data.json').then(r=>r.json()).then(d=>{try{
  const rows=d.rows, esc=s=>s.replace(/</g,'&lt;');
  document.getElementById('tocn').textContent=rows.length;
  const nav=document.getElementById('toc'),art=document.getElementById('art'),posEl=document.getElementById('pos');
  const prevB=document.getElementById('prev'),nextB=document.getElementById('next');
  let cur=0;

  function drawNav(q){
    nav.innerHTML=rows.map((r,i)=>({r,i})).filter(({r})=>!q||r.ut.includes(q))
      .map(({r,i})=>`<a class="ti" data-i="${i}" href="#">${r.ut}<span class="dots"><span class="d r${r.r.length?'':' off'}"></span><span class="d a${r.a.length?'':' off'}"></span><span class="d m${r.m.length?'':' off'}"></span><span class="d k${r.k&&r.k.length?'':' off'}"></span></span></a>`).join('');
  }
  drawNav(); document.getElementById('tq').oninput=e=>drawNav(e.target.value.trim());

  const blk=(key,items)=>{
    const nm=d.meta[key];
    if(!items.length) return `<div class="gapbox">${nm}: <b>بلا مقابل</b> — لا يغطيه فهرس هذا الكتاب</div>`;
    return `<div class="blk ${BOOKS[key].cls}"><div class="bknm">${nm} — ${items.length} عنواناً</div>`+
      items.map((u,k)=>`<button class="ttl" data-b="${key}${k}">«${esc(u.t)}» <span class="pgn">ص ${u.p0}${u.p1!==u.p0?'–'+u.p1:''}</span><span class="caret">◂</span></button>`).join('')+`</div>`;
  };

  function show(i){
    cur=i; const r=rows[i];
    nav.querySelectorAll('a.ti').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
    const n=r.r.length+r.a.length+r.m.length+(r.k?r.k.length:0);
    art.innerHTML=`<h2 class="sec-title">${r.ut}</h2>
      <div class="meta-card">الفهرس الموحد · العنوان ${i+1} من ${rows.length} · ${n} عنواناً حقيقياً — اضغط عنوان كتاب لتقرأ نصّه كاملاً</div>
      <div class="legend"><span><span class="d r"></span>الرسالة</span><span><span class="d a"></span>الأخضري</span><span><span class="d m"></span>أسهل المسالك</span><span><span class="d k"></span>مختصر خليل</span></div>
      ${blk('r',r.r)}${blk('a',r.a)}${blk('m',r.m)}${blk('k',r.k||[])}
      <div class="rev"><span>هل المحاذاة صحيحة؟ العناوين المعروضة هي عناوين الكتب الحقيقية لا تقطيعاً مخترعاً</span><button class="ok" onclick="vote(this,1)">صح ✓</button><button class="no" onclick="vote(this,0)">خطأ ✗</button></div>`;
    posEl.textContent=(i+1)+' / '+rows.length;
    prevB.classList.toggle('dis',i===0); nextB.classList.toggle('dis',i===rows.length-1);
    art.scrollTop=0; history.replaceState(null,'','#'+i);
    if(innerWidth<860) close();
  }
  function showText(key,k){
    const u=rows[cur][key][k],nm=d.meta[key];
    art.innerHTML=`<button class="back" id="bck">→ رجوع إلى عناوين الكتب</button>
      <div class="meta-card">${nm} · ${r_ut()} · ص ${u.p0}${u.p1!==u.p0?'–'+u.p1:''} — نص العنوان كاملاً من أوله إلى آخر جملته</div>
      <h2 class="sec-title">${esc(u.t)}</h2>
      <div class="matn open">${esc(u.text)}</div>`;
    document.getElementById('bck').onclick=()=>show(cur);
    art.scrollTop=0; history.replaceState(null,'','#'+cur+key+k);
  }
  const r_ut=()=>rows[cur].ut;
  art.onclick=e=>{const b=e.target.closest('.ttl');if(b)showText(b.dataset.b[0],+b.dataset.b.slice(1))};
  nav.onclick=e=>{const a=e.target.closest('a.ti');if(a){e.preventDefault();show(+a.dataset.i)}};
  prevB.onclick=()=>{if(cur>0)show(cur-1)}; nextB.onclick=()=>{if(cur<rows.length-1)show(cur+1)};
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft')nextB.onclick();if(e.key==='ArrowRight')prevB.onclick()});
  show(Math.min(parseInt(location.hash.slice(1))||0,rows.length-1));
}catch(e){document.getElementById('art').innerHTML='<p class="loading" style="color:#e08080">خطأ: '+e.message+'</p>';}});
function vote(b,v){const r=b.parentElement,ok=r.querySelector('.ok'),no=r.querySelector('.no');
  if(v===1){ok.classList.toggle('on');no.classList.remove('on')}else{no.classList.toggle('on');ok.classList.remove('on')}}
</script>
</body>
</html>
