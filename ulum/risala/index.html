<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<title>قارئ الرسالة — ابن أبي زيد القيرواني</title>
<style>
  :root{--bg:#0f1419;--card:#1a222b;--ink:#e8e2d4;--dim:#9a9384;--acc:#c9a227;--acc2:#2e7d5b;--acc3:#3d6b8e;--line:#2a3440;--bar:#0f1419f2;--tocbg:#11171d;--hov:#22303d;--fncbg:#16202a}
  body.light{--bg:#f6f3ec;--card:#fdfcf8;--ink:#2a2620;--dim:#6b6357;--acc:#8a6d14;--acc2:#2e7d5b;--acc3:#3d6b8e;--line:#e0d9c9;--bar:#f6f3ecf2;--tocbg:#f6f3ec;--hov:#efe9dc;--fncbg:#fdfcf8}
  body.light u.fn{color:var(--acc3);border-bottom-color:var(--acc3)}
  body.light #fnc{box-shadow:0 -8px 30px #0003}
  body.light #fnc b{color:var(--acc3)}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}

  /* ── top bar (mobile-first) ───────────────────────── */
  .top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid var(--acc);background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top))}
  .top h1{font-size:1rem;color:var(--acc);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .sub{display:none}
  .icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:10px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .icon-btn:active{border-color:var(--acc)}

  /* ── TOC drawer (mobile-first) ────────────────────── */
  .scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  aside.toc{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(320px,88vw);background:var(--tocbg);z-index:50;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .28s ease;box-shadow:-8px 0 30px #0008}
  aside.toc.open{transform:none}
  .toc-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .toc-head b{color:var(--acc);flex:1;font-size:.95rem}
  .toc-head .x{width:38px;height:38px;border:none;background:transparent;color:var(--dim);font-size:1.3rem;cursor:pointer;border-radius:8px}
  .toc-search{padding:10px 14px;border-bottom:1px solid var(--line)}
  .toc-search input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;font-family:inherit}
  nav.toc-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  a.ti{display:block;padding:13px 16px;color:var(--ink);text-decoration:none;font-size:.95rem;border-bottom:1px solid var(--line);line-height:1.75;min-height:48px}
  a.ti small{color:var(--dim);display:block;font-size:.74rem;margin-top:2px}
  a.ti:active,a.ti.on{background:var(--hov)}
  a.ti.on{border-inline-start:4px solid var(--acc);color:var(--acc)}

  /* ── reader pane ──────────────────────────────────── */
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 150px}
  .sec-title{font-size:1.35rem;color:var(--acc);margin-bottom:10px;line-height:1.6}
  .meta-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.78rem;color:var(--dim);line-height:1.8}
  .matn{font-size:1.13rem;line-height:2.35;white-space:pre-wrap;text-align:justify}
  .matn span[data-type=title]{display:block;color:var(--acc2);font-weight:700;margin-top:20px;font-size:1.02rem}
  .pg{color:var(--dim);font-size:.68rem;display:block;border-top:1px dashed var(--line);margin-top:16px;padding-top:4px;text-align:start}
  .loading{color:var(--dim);text-align:center;padding:60px 20px}
  u.fn{text-decoration:none;color:#7fb3d8;border-bottom:1px dotted #7fb3d8;cursor:pointer;padding:2px 1px;border-radius:4px}
  u.fn:active{background:var(--hov)}
  span.fnm{color:var(--acc3);font-size:.75rem;cursor:pointer}
  #fnc{position:fixed;inset-inline:0;bottom:140px;background:var(--fncbg);border:1px solid var(--acc3);border-radius:14px;margin:0 10px;padding:14px 16px;max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:60;box-shadow:0 -8px 30px #000a;display:none}
  #fnc.open{display:block}
  #fnc b{color:#7fb3d8;font-size:.8rem;display:block;margin-bottom:8px}
  #fnc p{font-size:.98rem;line-height:2.1;text-align:justify}
  #fnc .x{position:absolute;top:8px;inset-inline-end:8px;width:38px;height:38px;border:none;background:transparent;color:var(--dim);font-size:1.2rem;cursor:pointer}

  /* ── bottom thumb nav ─────────────────────────────── */
  .bnav{position:fixed;bottom:0;inset-inline:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--bar);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:30}
  .bnav .row{display:flex;gap:10px}
  .bnav .row button{flex:1;height:50px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:12px;font-size:.95rem;font-family:inherit;cursor:pointer}
  .bnav button:active{border-color:var(--acc);background:var(--hov)}
  .bnav button.dis{opacity:.3;pointer-events:none}
  .bnav .pos{flex:none;align-self:center;color:var(--dim);font-size:.72rem;min-width:52px;text-align:center}
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .seg button{flex:1;height:42px;border:none;background:transparent;color:var(--dim);font-size:.9rem;font-family:inherit;cursor:pointer}
  .seg button.on[data-l=m]{background:var(--acc);color:#10151a;font-weight:700}
  .seg button.on[data-l=s]{background:var(--acc2);color:#fff;font-weight:700}
  .seg button.on[data-l=h]{background:var(--acc3);color:#fff;font-weight:700}

  /* ── desktop enhancement ──────────────────────────── */
  @media(min-width:860px){
    body{flex-direction:row}
    .top{display:none}
    aside.toc{position:static;transform:none;width:320px;min-width:280px;box-shadow:none;border-inline-end:1px solid var(--line);flex:none}
    .scrim{display:none}
    .bnav{inset-inline-start:320px}
    main{max-width:780px;margin:0 auto;padding:28px 30px 150px}
  }
</style>
</head>
<body>

<header class="top">
  <button class="icon-btn" id="openToc" aria-label="الفهرس">☰</button>
  <h1>رسالة ابن أبي زيد القيرواني</h1>
  <button class="icon-btn thb" aria-label="المظهر">☀</button>
</header>

<div class="scrim" id="scrim"></div>
<aside class="toc" id="tocPane">
  <div class="toc-head"><b>الفهرس — <span id="tocn">…</span> باباً</b><button class="x thb" aria-label="المظهر">☀</button><button class="x" id="closeToc" aria-label="إغلاق">✕</button></div>
  <div class="toc-search"><input type="search" id="tq" placeholder="ابحث في الأبواب…"></div>
  <nav class="toc-list" id="toc"></nav>
</aside>

<main id="art"><p class="loading">جارٍ التحميل…</p></main>
<div id="fnc"><button class="x" id="fncX" aria-label="إغلاق">✕</button><b id="fncT"></b><p id="fncB"></p></div>

<div class="bnav">
  <div class="seg">
    <button id="mMatn" data-l="m" class="on">المتن</button>
    <button id="mShrh" data-l="s">الشرح</button>
    <button id="mHash" data-l="h">الحاشية</button>
  </div>
  <div class="row">
    <button id="prev">← السابق</button>
    <span class="pos" id="pos"></span>
    <button id="next">التالي →</button>
  </div>
</div>

<script>
const pane=document.getElementById('tocPane'),scrim=document.getElementById('scrim');
const thBs=[...document.querySelectorAll('.thb')];
const setTh=l=>{document.body.classList.toggle('light',l);thBs.forEach(b=>b.textContent=l?'☾':'☀');try{localStorage.setItem('ulum-th',l?'l':'d')}catch(e){}};
try{setTh(localStorage.getItem('ulum-th')==='l')}catch(e){setTh(false)}
thBs.forEach(b=>b.onclick=()=>setTh(!document.body.classList.contains('light')));
document.getElementById('openToc').onclick=()=>{pane.classList.add('open');scrim.classList.add('open')};
const close=()=>{pane.classList.remove('open');scrim.classList.remove('open')};
document.getElementById('closeToc').onclick=close; scrim.onclick=close;

fetch('data.json').then(r=>r.json()).then(d=>{try{
  const pages=d.pages, toc=d.toc;
  const pos=new Map(pages.map((p,i)=>[p.id,i]));
  const secs=toc.map(x=>({t:x.t,a:pos.get(x.pid)})).filter(s=>s.a!==undefined);
  secs.sort((x,y)=>x.a-y.a);
  if(secs[0].a>0) secs.unshift({t:'ما قبل الفهرس',a:0});
  secs.forEach((s,i)=>{s.b=i<secs.length-1?secs[i+1].a:pages.length;s.first=pages[s.a].n;s.last=pages[s.b-1].n;});

  document.getElementById('tocn').textContent=toc.length;
  const nav=document.getElementById('toc'),art=document.getElementById('art'),posEl=document.getElementById('pos');
  const prevB=document.getElementById('prev'),nextB=document.getElementById('next');
  const segB={matn:document.getElementById('mMatn'),sharh:document.getElementById('mShrh'),hashiya:document.getElementById('mHash')};
  const L={sharh:{f:'sharh.json',label:'الشرح'},hashiya:{f:'hashiya.json',label:'الحاشية'}};
  const store={},pend={};
  const fetchL=k=>pend[k] ||= fetch(L[k].f).then(r=>r.json()).then(x=>store[k]=x);
  let cur=0, mode='matn', curPages=[];
  const fnc=document.getElementById('fnc');
  const fnify=(b,ri)=>b.replace(/([^\s<>()]+)\s*\(¬([0-9٠-٩]+)\)/g,'<u class="fn" data-p="'+ri+'" data-n="$2">$1</u><span class="fnm" data-p="'+ri+'" data-n="$2">¬$2</span>');
  const fnNote=(pg,n)=>((pg.f||'').split(/[\r\n]+/).find(l=>l.startsWith('(¬'+n+')'))||'').trim();
  document.getElementById('fncX').onclick=()=>fnc.classList.remove('open');
  function setMode(m){mode=m;for(const k in segB)segB[k].classList.toggle('on',k===m);show(cur)}
  segB.matn.onclick=()=>setMode('matn'); segB.sharh.onclick=()=>setMode('sharh'); segB.hashiya.onclick=()=>setMode('hashiya');

  function drawNav(q){
    nav.innerHTML=secs.map((s,i)=>({s,i})).filter(({s})=>!q||s.t.includes(q))
      .map(({s,i})=>`<a class="ti" data-i="${i}" href="#">${s.t}<small>ص ${s.first}${s.last!==s.first?'–'+s.last:''}</small></a>`).join('');
  }
  drawNav(); document.getElementById('tq').oninput=e=>drawNav(e.target.value.trim());

  function show(i){
    cur=i; const s=secs[i];
    nav.querySelectorAll('a.ti').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
    let title=s.t, meta=`${d.meta.t} — ${d.meta.a} (ت. ${d.meta.d}) · الباب ${i+1} من ${secs.length} · ص ${s.first}${s.last!==s.first?'–'+s.last:''} من ${d.meta.pages}`,
        src=pages, a=s.a, b=s.b;
    if(mode!=='matn'){
      const ld=store[mode], mm=mode;
      if(!ld){
        art.innerHTML='<p class="loading">يحمّل '+L[mm].label+'…</p>';
        fetchL(mm).then(()=>{if(mode===mm)show(i)});
        posEl.textContent=(i+1)+' / '+secs.length;
        prevB.classList.toggle('dis',i===0); nextB.classList.toggle('dis',i===secs.length-1);
        return;
      }
      const m=ld.map[i];
      meta=`${L[mm].label}: ${ld.meta.t} — ${ld.meta.a} (ت. ${ld.meta.d})${!m?'':(m.t!==s.t?' · عنوانه «'+m.t+'»':'')} · ص ${m?ld.pages[m.a].n+'–'+ld.pages[m.b-1].n+' من '+ld.meta.pages:''}`;
      if(!m){src=[];}else{src=ld.pages; a=m.a; b=m.b;}
    }
    curPages=src.length?src.slice(a,b):[];
    art.innerHTML=`<h2 class="sec-title">${title}</h2>
      <div class="meta-card">${meta}</div>
      <div class="matn">${curPages.length?curPages.map((p,ri)=>`<span class="pg">— ص ${p.n}${p.part?' · جزء '+p.part:''} —</span>`+fnify(p.b,ri)).join('\n'):'<p class="loading">لا شرح مطابق لهذا الباب في المصدر الحالي.</p>'}</div>`;
    fnc.classList.remove('open');
    posEl.textContent=(i+1)+' / '+secs.length;
    prevB.classList.toggle('dis',i===0); nextB.classList.toggle('dis',i===secs.length-1);
    art.scrollTop=0; history.replaceState(null,'','#'+i+(mode==='sharh'?'s':mode==='hashiya'?'h':''));
    if(innerWidth<860) close();
  }
  nav.onclick=e=>{const a=e.target.closest('a.ti');if(a){e.preventDefault();show(+a.dataset.i)}};
  art.onclick=e=>{const u=e.target.closest('u.fn,span.fnm');if(!u)return;
    const pg=curPages[+u.dataset.p]; if(!pg)return;
    const note=fnNote(pg,u.dataset.n);
    document.getElementById('fncT').textContent='فائدة التتائي (¬'+u.dataset.n+') — ص '+pg.n;
    document.getElementById('fncB').textContent=note||'لا نص محفوظاً لهذه الفائدة في هذه الصفحة.';
    fnc.classList.add('open');fnc.scrollTop=0;};
  prevB.onclick=()=>{if(cur>0)show(cur-1)}; nextB.onclick=()=>{if(cur<secs.length-1)show(cur+1)};
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft')nextB.onclick();if(e.key==='ArrowRight')prevB.onclick()});
  const hm=(location.hash.slice(1).match(/^(\d+)([sh]?)$/)||[]);
  if(hm[2]==='s')mode='sharh'; else if(hm[2]==='h')mode='hashiya';
  if(mode!=='matn'){segB[mode].classList.add('on');segB.matn.classList.remove('on');}
  show(hm[1]?Math.min(+hm[1],secs.length-1):0);
}catch(e){document.getElementById('art').innerHTML='<p class="loading" style="color:#e08080">خطأ: '+e.message+'</p>';}});
</script>
</body>
</html>
