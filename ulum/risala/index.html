<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<title>قارئ الرسالة — ابن أبي زيد القيرواني</title>
<style>
  :root{--bg:#0f1419;--card:#1a222b;--ink:#e8e2d4;--dim:#9a9384;--acc:#c9a227;--acc2:#2e7d5b;--line:#2a3440}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:2;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:14px 18px;border-bottom:2px solid var(--acc);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:1.25rem;color:var(--acc)}
  header .sub{color:var(--dim);font-size:.85rem}
  header .nav{margin-inline-start:auto;font-size:.8rem}
  header .nav a{color:var(--dim);text-decoration:none;margin-inline-start:12px}
  header .nav a:hover{color:var(--acc)}
  .main{flex:1;display:flex;overflow:hidden}
  aside{width:300px;min-width:240px;border-inline-end:1px solid var(--line);overflow-y:auto;background:#11171d}
  aside .toc-head{padding:12px 14px;color:var(--acc);font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;background:#11171d;z-index:5}
  aside a.ti{display:block;padding:9px 14px;color:var(--ink);text-decoration:none;font-size:.88rem;border-bottom:1px solid #1b232c;line-height:1.7}
  aside a.ti small{color:var(--dim);display:block;font-size:.72rem}
  aside a.ti:hover{background:#1a222b}
  aside a.ti.on{background:#22303d;border-inline-start:3px solid var(--acc);color:var(--acc)}
  article{flex:1;overflow-y:auto;padding:22px 26px}
  .sec-title{font-size:1.4rem;color:var(--acc);margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .matn{font-size:1.12rem;line-height:2.3;white-space:pre-wrap}
  .matn span[data-type=title]{display:block;color:var(--acc2);font-weight:700;margin-top:18px;font-size:1.05rem}
  .matn a{color:var(--acc)}
  .pg{color:var(--dim);font-size:.72rem;text-align:left;display:block;border-top:1px dashed #2a344055;margin-top:12px;padding-top:3px}
  .navsec{display:flex;justify-content:space-between;margin:26px 0 10px}
  .navsec a{color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 16px;font-size:.85rem}
  .navsec a:hover{border-color:var(--acc)}
  .navsec a.dis{opacity:.3;pointer-events:none}
  .meta-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:18px;font-size:.85rem;color:var(--dim)}
  @media(max-width:720px){aside{width:150px}aside a.ti{font-size:.72rem}}
</style>
</head>
<body>
<header>
  <h1>رسالة ابن أبي زيد القيرواني</h1>
  <span class="sub" id="meta"></span>
  <span class="nav"><a href="../">مداخل البوابة</a><a href="../../">البوابة الأم</a></span>
</header>
<div class="main">
  <aside><div class="toc-head">الفهرس — <span id="tocn"></span> باباً</div><nav id="toc"></nav></aside>
  <article id="art"><p style="color:var(--dim)">جارٍ التحميل…</p></article>
</div>
<script>
fetch('data.json').then(r=>r.json()).then(d=>{try{
  document.getElementById('meta').textContent = d.meta.a+' — ت. '+d.meta.d+' | '+d.meta.betaka;
  document.getElementById('tocn').textContent = d.toc.length;
  const pages=d.pages, toc=d.toc;
  // toc order != page order in this edition — sort titles by their page position
  const pos=new Map(pages.map((p,i)=>[p.id,i]));
  const secs=toc.map(x=>({t:x.t,pid:x.pid,a:pos.get(x.pid)})).filter(s=>s.a!==undefined);
  secs.sort((x,y)=>x.a-y.a);
  // optional intro section if any pages precede the first title
  if(secs[0].a>0) secs.unshift({t:'ما قبل الفهرس',pid:pages[0].id,a:0});
  secs.forEach((s,i)=>{ s.b=i<secs.length-1?secs[i+1].a:pages.length; s.first=pages[s.a].n; s.last=pages[s.b-1].n; });
  const nav=document.getElementById('toc'), art=document.getElementById('art');
  nav.innerHTML=secs.map((s,i)=>`<a class="ti" href="#" data-i="${i}">${s.t}<small>ص ${s.first}${s.last!==s.first?'–'+s.last:''}</small></a>`).join('');
  function show(i){
    const s=secs[i];
    nav.querySelectorAll('a.ti').forEach((el,j)=>el.classList.toggle('on',j===i));
    art.innerHTML=`<h2 class="sec-title">${s.t}</h2>
      <div class="meta-card">${d.meta.t} — ${d.meta.a} (ت. ${d.meta.d}) · الباب ${i+1} من ${secs.length} · ص ${s.first}${s.last!==s.first?'–'+s.last:''} من ${d.meta.pages}</div>
      <div class="matn">${pages.slice(s.a,s.b).map(p=>`<span class="pg">— ص ${p.n}${p.part?' · جزء '+p.part:''} —</span>`+p.b).join('\n')}</div>
      <div class="navsec">
        <a href="#" id="prev" class="${i===0?'dis':''}">← الباب السابق</a>
        <a href="#" id="next" class="${i===secs.length-1?'dis':''}">الباب التالي →</a>
      </div>`;
    art.scrollTop=0;
    document.getElementById('prev').onclick=e=>{e.preventDefault();if(i>0)show(i-1)};
    document.getElementById('next').onclick=e=>{e.preventDefault();if(i<secs.length-1)show(i+1)};
    history.replaceState(null,'','#'+i);
  }
  nav.onclick=e=>{const a=e.target.closest('a.ti');if(a){e.preventDefault();show(+a.dataset.i)}};
  show(location.hash?Math.min(+location.hash.slice(1)||0,secs.length-1):0);
}catch(e){art.innerHTML='<p style="color:#e08080">خطأ: '+e.message+'<br><small>'+(e.stack||'').slice(0,300)+'</small></p>';}});
</script>
</body>
</html>
