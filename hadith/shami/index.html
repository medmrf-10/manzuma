<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>قارئ كتب الشامي — باب الحديث</title>
<style>
:root{--bg:#0f1419;--card:#1a222b;--ink:#e8e2d4;--dim:#9a9384;--acc:#c9a227;--acc2:#2e7d5b;--line:#2a3440;--hov:#22303d;--bar:#0f1419f2}
body.light{--bg:#f6f2e9;--card:#fffdf7;--ink:#2a251a;--dim:#6d6657;--acc:#8a6d1c;--acc2:#1f6b4a;--line:#e0d8c5;--hov:#efe9dc;--bar:#f6f2e9f2}
@media(prefers-color-scheme:light){body:not(.dark){--bg:#f6f2e9;--card:#fffdf7;--ink:#2a251a;--dim:#6d6657;--acc:#8a6d1c;--acc2:#1f6b4a;--line:#e0d8c5;--hov:#efe9dc;--bar:#f6f2e9f2}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.9;min-height:100vh}
.bar{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(8px);border-bottom:2px solid var(--acc);padding-top:env(safe-area-inset-top)}
.bar-row{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto;padding:8px 12px}
.icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:10px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;text-decoration:none}
.icon-btn:active{background:var(--hov)}
#ttl{flex:1;min-width:0;font-size:1rem;color:var(--acc);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{max-width:720px;margin:0 auto;padding:6px 12px;display:none;flex-wrap:wrap;gap:4px;font-size:.8rem;color:var(--dim)}
.crumb.show{display:flex}
.crumb span{cursor:pointer}
.crumb span:active{color:var(--acc)}
.crumb i{font-style:normal;margin-inline:2px;color:var(--line)}
.srch{max-width:720px;margin:0 auto;padding:6px 12px 10px;display:none}
.srch.show{display:block}
.srch input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;font-family:inherit}
main{max-width:720px;margin:0 auto;padding:14px 12px 60px}
.lead{color:var(--dim);font-size:.92rem;margin-bottom:14px}
.lead b{color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:9px;cursor:pointer;text-decoration:none;color:inherit}
.row:active{background:var(--hov);border-color:var(--acc)}
.row .nm{flex:1;min-width:0;font-size:1.02rem}
.row .cnt{flex:none;font-size:.72rem;color:var(--acc2);border:1px solid var(--acc2);border-radius:999px;padding:2px 10px}
.row .pth{display:block;font-size:.72rem;color:var(--dim);margin-top:2px}
.row .arr{flex:none;color:var(--dim);font-size:.9rem}
.sec{font-size:.8rem;color:var(--dim);margin:16px 2px 8px}
.hd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.hd .mtn{font-size:1.04rem;line-height:2.15}
.hd .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:.7rem;color:var(--dim)}
.hd .tags span{border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.hd .tags .r{color:var(--acc);border-color:var(--acc)}
.hd .tags .g{color:var(--acc2);border-color:var(--acc2)}
.hd details{margin-top:10px;font-size:.84rem;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px}
.hd summary{cursor:pointer;color:var(--acc);font-size:.84rem}
.hd .tk-body{white-space:pre-wrap;margin-top:6px}
.empty{color:var(--dim);text-align:center;padding:40px 12px;font-size:.95rem}
.loading{color:var(--dim);text-align:center;padding:30px}
.back-top{display:block;text-align:center;margin:24px auto 0}
footer{max-width:720px;margin:0 auto;padding:0 12px 30px;text-align:center}
footer a{color:var(--dim);font-size:.85rem;text-decoration:none}
@media(min-width:721px){.row{transition:transform .12s,border-color .12s}.row:hover{transform:translateY(-2px);border-color:var(--acc)}}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-row">
    <button class="icon-btn" id="bk" title="رجوع" style="visibility:hidden">→</button>
    <div id="ttl">كتب صالح الشامي</div>
    <button class="icon-btn" id="thB" title="فاتح/داكن">☀</button>
  </div>
  <div class="crumb" id="crumb"></div>
  <div class="srch" id="srchWrap"><input id="q" type="search" placeholder="ابحث هنا…"></div>
</div>
<main id="main"><div class="loading">يُحمَّل الفهرس…</div></main>
<footer><a class="back-top" href="../">← العودة إلى باب الحديث</a></footer>
<script>
const S={tree:null,stack:[],cache:{},q:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NUM=n=>n?`<span class="cnt">${n} حديثاً</span>`:'';

async function boot(){
  S.tree=await (await fetch('data/tree.json')).json();
  S.stack=[{lv:'books'}];
  render();
}
function cur(){return S.stack[S.stack.length-1]}
function go(node){S.stack.push(node);S.q='';$('q').value='';render();scrollTo(0,0)}
function back(){if(S.stack.length>1){S.stack.pop();S.q='';$('q').value='';render()}}
function kids(){
  const c=cur();
  if(c.lv==='books')return S.tree.map(b=>({node:b,lv:'book',nm:b.name,n:b.n}));
  const o=c.node;
  const arr=o.maqsads||o.ketabs||o.fasls||o.babs||[];
  const lv=o.maqsads?'maqsad':o.ketabs?'ketab':o.fasls?'fasl':'bab';
  return arr.map(x=>({node:x,lv:lv==='bab'?'bab':lv,nm:x.name,n:x.n}));
}
function norm(s){return String(s||'').replace(/[ً-ٰٟۖ-ۭـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')}
function* allBabs(book,path=[]){
  for(const m of book.maqsads||[])for(const k of m.ketabs||[])for(const f of k.fasls||[])for(const b of f.babs||[])
    yield {bab:b,ketab:k,path:`${book.name} ‹ ${m.name} ‹ ${k.name}${f.name?' ‹ '+f.name:''}`};
}
function render(){
  const c=cur(),main=$('main'),bk=$('bk'),crumb=$('crumb'),sw=$('srchWrap');
  bk.style.visibility=S.stack.length>1?'visible':'hidden';
  $('ttl').textContent=c.lv==='books'?'كتب صالح الشامي':(c.node?.name||'كتب صالح الشامي');
  const path=S.stack.slice(1).map(s=>s.node.name);
  crumb.className='crumb'+(path.length?' show':'');
  crumb.innerHTML=path.map((p,i)=>`<span data-i="${i}">${esc(p)}</span>`).join('<i>‹</i>');
  crumb.querySelectorAll('span').forEach(el=>el.onclick=()=>{S.stack.length=+el.dataset.i+2;S.q='';$('q').value='';render()});
  const isBooks=c.lv==='books', isH=c.lv==='hadith';
  sw.className='srch'+((isBooks||isH)?'':' show');
  if(isBooks){main.innerHTML=`<div class="lead">أربعة كتب مشكولة — <b>28,565 حديثاً</b> — بفهارسها: مقصد ← كتاب ← فصل ← باب. اختر كتاباً:</div>`+
    S.tree.map(b=>{const tot=b.maqsads?.length||0;return `<div class="row" data-id="${b.id}"><span class="nm">${esc(b.name)}<span class="pth">${tot} مقاصد</span></span>${NUM(b.n)}<span class="arr">‹</span></div>`}).join('');
    main.querySelectorAll('.row').forEach(el=>el.onclick=()=>go({lv:'book',node:S.tree.find(b=>b.id==el.dataset.id)}));
    return;}
  if(isH){renderHadiths(c);return}
  const ks=kids();
  if(ks.length===1&&ks[0].lv!=='bab'){go({lv:ks[0].lv,node:ks[0].node});return}
  if(ks.length&&ks[0].lv==='bab'){renderBabs(c,ks);return}
  const q=norm(S.q);
  const book=S.stack.find(s=>s.lv==='book')?.node;
  let html=`<div class="lead">عدد العناوين: <b>${ks.length}</b></div>`;
  const flt=q?ks.filter(x=>norm(x.nm).includes(q)):ks;
  html+=flt.map((x,i)=>`<div class="row" data-i="${i}"><span class="nm">${esc(x.nm)}</span>${NUM(x.n)}<span class="arr">‹</span></div>`).join('')||'<div class="empty">لا نتائج في هذا المستوى.</div>';
  let hits=[];
  if(q&&book){
    hits=[...allBabs(book)].filter(x=>norm(x.bab.name).includes(q));
    if(hits.length)html+=`<div class="sec">في كل أبواب الكتاب (${hits.length}):</div>`+hits.slice(0,60).map((x,i)=>`<div class="row g" data-i="${i}"><span class="nm">${esc(x.bab.name)}<span class="pth">${esc(x.path)}</span></span>${NUM(x.bab.n)}<span class="arr">‹</span></div>`).join('');
  }
  main.innerHTML=html;
  main.querySelectorAll('.row:not(.g)').forEach(el=>el.onclick=()=>{const x=flt[+el.dataset.i];go({lv:x.lv,node:x.node})});
  main.querySelectorAll('.row.g').forEach(el=>el.onclick=()=>{const x=hits[+el.dataset.i];go({lv:'hadith',node:x.bab,ketab:x.ketab,path:x.path})});
}
function renderBabs(c,babs){
  const q=norm(S.q);
  const flt=q?babs.filter(x=>norm(x.nm).includes(q)):babs;
  const main=$('main');
  main.innerHTML=`<div class="lead">الأبواب: <b>${babs.length}</b></div>`+
    flt.map((x,i)=>`<div class="row" data-i="${i}"><span class="nm">${esc(x.nm)}</span>${NUM(x.n)}<span class="arr">‹</span></div>`).join('')||'<div class="empty">لا نتائج.</div>';
  main.querySelectorAll('.row').forEach(el=>{
    const x=flt[+el.dataset.i];
    const ketab=S.stack.find(s=>s.lv==='ketab')?.node||S.stack[S.stack.length-2]?.node;
    el.onclick=()=>go({lv:'hadith',node:x.node,ketab});
  });
}
async function renderHadiths(c){
  const main=$('main');
  main.innerHTML='<div class="loading">يُحمَّل الباب…</div>';
  const kid=c.ketab.id, bid=S.stack.find(s=>s.lv==='book').node.id;
  const key=`k${bid}_${kid}`;
  if(!S.cache[key])S.cache[key]=await (await fetch(`data/${key}.json`)).json();
  const hs=S.cache[key].filter(r=>r.c===c.node.name&&r.t&&r.t!=='-');
  const q=norm(S.q);
  const flt=q?hs.filter(r=>norm(r.t).includes(q)):hs;
  $('srchWrap').className='srch show';
  main.innerHTML=`<div class="lead">${esc(c.node.name)} — <b>${hs.length}</b> حديثاً${q?` (تطابق البحث: ${flt.length})`:''}</div>`+
    (flt.map(h=>`<div class="hd"><div class="mtn">${esc(h.t)}</div><div class="tags">
      ${h.ref?`<span class="r">${esc(h.ref)}</span>`:''}
      ${h.h?`<span class="g">${esc(h.h)}</span>`:''}
      ${h.f?`<span>${esc(h.f)}</span>`:''}
      ${h.p?`<span>ص ${h.p}</span>`:''}
      <span>#${h.n}</span></div>
      ${h.k?`<details><summary>التخريج</summary><div class="tk-body">${esc(h.k)}</div></details>`:''}
      ${h.fn?`<details><summary>الحواشي</summary><div class="tk-body">${esc(h.fn)}</div></details>`:''}
    </div>`).join('')||'<div class="empty">لا أحاديث مطابقة.</div>');
}
$('bk').onclick=back;
$('q').addEventListener('input',e=>{S.q=e.target.value;render()});
const TH='hadith-theme';
function applyTheme(t){document.body.classList.toggle('light',t==='light');document.body.classList.toggle('dark',t==='dark');$('thB').textContent=t==='light'?'☾':'☀';document.querySelector('meta[name="theme-color"]').content=t==='light'?'#f6f2e9':'#0f1419'}
$('thB').onclick=()=>{const t=document.body.classList.contains('light')?'dark':'light';localStorage.setItem(TH,t);applyTheme(t)};
applyTheme(localStorage.getItem(TH)||'');
boot();
</script>
</body>
</html>
