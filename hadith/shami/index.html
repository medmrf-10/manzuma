<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
<title>قارئ كتب الشامي</title>
<style>
  :root{--bg:#0f1419;--card:#1a222b;--ink:#e8e2d4;--dim:#9a9384;--acc:#c9a227;--acc2:#3fbf8f;--line:#2a3440}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.9;height:100vh;display:flex;flex-direction:column}
  header{padding:10px 16px;border-bottom:2px solid var(--acc);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:1.15rem;color:var(--acc)}
  .sub{color:var(--dim);font-size:.78rem}
  main{flex:1;display:flex;overflow:hidden}
  #side{width:340px;min-width:240px;border-left:1px solid var(--line);overflow-y:auto;padding:10px;background:var(--bg);resize:horizontal}
  #content{flex:1;overflow-y:auto;padding:18px}
  input[type=search]{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem;margin-bottom:8px}
  details{margin:2px 0}
  summary{cursor:pointer;padding:4px 6px;border-radius:6px;font-size:.88rem;color:var(--ink)}
  summary:hover{background:var(--card)}
  summary .cnt{color:var(--dim);font-size:.72rem}
  .bnode>summary{color:var(--acc)}
  .bab{display:block;width:100%;text-align:right;background:none;border:none;color:var(--dim);padding:4px 22px;font-size:.83rem;cursor:pointer;font-family:inherit;line-height:1.7}
  .bab:hover,.bab.on{color:var(--acc2)}
  .hd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .hd .mtn{font-size:1.08rem;line-height:2.15;margin:4px 0 10px}
  .hd .row{display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem}
  .tag{background:#243040;border:1px solid var(--line);border-radius:14px;padding:2px 10px;color:var(--dim)}
  .tag.g{border-color:var(--acc2);color:#7fd4ab}
  .tag.r{border-color:var(--acc);color:var(--acc)}
  .hd details.tk{font-size:.8rem;color:var(--dim);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:8px}
  .hd details.tk summary{color:var(--acc);font-size:.78rem}
  .crumb{font-size:.8rem;color:var(--dim);margin-bottom:12px}
  .crumb b{color:var(--acc)}
  #status{color:var(--dim);text-align:center;padding:40px;font-size:.9rem}
  .theme-btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:.78rem;cursor:pointer;font-family:inherit}
  .back{color:var(--dim);font-size:.8rem;text-decoration:none;margin-right:auto}
  body.light{--bg:#f6f2e9;--card:#fffdf7;--ink:#2a251a;--dim:#6d6657;--acc:#8a6d1c;--acc2:#1f6b4a;--line:#e0d8c5}
  body.light .tag{background:#f0ead9;color:#5d5645}
  body.light .tag.g{color:#1f6b4a}
  @media (prefers-color-scheme:light){body:not(.dark){--bg:#f6f2e9;--card:#fffdf7;--ink:#2a251a;--dim:#6d6657;--acc:#8a6d1c;--acc2:#1f6b4a;--line:#e0d8c5}body:not(.dark) .tag{background:#f0ead9;color:#5d5645}body:not(.dark) .tag.g{color:#1f6b4a}}
  @media(max-width:700px){main{flex-direction:column}#side{width:100%;max-height:38%;border-left:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>قارئ كتب الشامي</h1>
  <span class="sub" id="cnt"></span>
  <a class="back" href="../">← بوابة الحديث</a>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️ فاتح</button>
</header>
<main>
  <div id="side"><input type="search" id="q" placeholder="ابحث في أسماء الأبواب…"><div id="tree"></div></div>
  <div id="content"><div id="status">اختر باباً من الشجرة لعرض أحاديثه — التسلسل: مقصد ← كتاب ← فصل ← باب</div></div>
</main>
<script>
function applyTheme(t){document.body.classList.toggle('light',t==='light');document.body.classList.toggle('dark',t==='dark');document.getElementById('themeBtn').textContent=t==='light'?'🌙 داكن':'☀️ فاتح';document.querySelector('meta[name=theme-color]').content=t==='light'?'#f6f2e9':'#0f1419'}
function toggleTheme(){const t=document.body.classList.contains('light')?'dark':'light';localStorage.setItem('theme',t);applyTheme(t)}
applyTheme(localStorage.getItem('theme')||'auto');

const treeEl=document.getElementById('tree'),cont=document.getElementById('content');
let TREE=null,shardCache={};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('data/tree.json').then(r=>r.json()).then(t=>{
  TREE=t;
  document.getElementById('cnt').textContent=t.reduce((s,b)=>s+b.n,0).toLocaleString('en')+' حديثاً · '+t.length+' كتب';
  renderTree(t);
});

function renderTree(books,q){
  treeEl.innerHTML='';
  books.forEach(b=>{
    const bd=document.createElement('details');bd.className='bnode';bd.open=!!q;
    bd.innerHTML=`<summary>${esc(b.name)} <span class="cnt">${b.n.toLocaleString('en')}</span></summary>`;
    b.maqsads.forEach(m=>{
      const md=document.createElement('details');md.open=!!q;
      md.innerHTML=`<summary>${esc(m.name)} <span class="cnt">${m.n}</span></summary>`;
      m.ketabs.forEach(k=>{
        const kd=document.createElement('details');kd.open=!!q;
        kd.innerHTML=`<summary>${esc(k.name)} <span class="cnt">${k.n}</span></summary>`;
        k.fasls.forEach(f=>{
          const showBabs=q?f.babs.filter(x=>x.name&&x.name.includes(q)):f.babs;
          if(q&&!showBabs.length)return;
          const fd=document.createElement('details');fd.open=!!q;
          fd.innerHTML=`<summary>${esc(f.name)} <span class="cnt">${f.n}</span></summary>`;
          showBabs.forEach(c=>{
            const btn=document.createElement('button');btn.className='bab';
            btn.textContent=c.name+` (${c.n})`;
            btn.onclick=()=>{document.querySelectorAll('.bab.on').forEach(x=>x.classList.remove('on'));btn.classList.add('on');loadKetab(b,k,f,c)};
            fd.appendChild(btn);
          });
          kd.appendChild(fd);
        });
        md.appendChild(kd);
      });
      bd.appendChild(md);
    });
    treeEl.appendChild(bd);
  });
}
document.getElementById('q').oninput=e=>{
  const q=e.target.value.trim();
  if(!TREE)return;
  if(!q){renderTree(TREE);return}
  renderTree(TREE.map(b=>({...b,maqsads:b.maqsads})),q);
};

async function loadKetab(b,k,f,c){
  cont.innerHTML='<div id="status">يحمّل…</div>';
  const key=`k${b.id}_${k.id}`;
  if(!shardCache[key]) shardCache[key]=await (await fetch(`data/${key}.json`)).json();
  render(shardCache[key].filter(h=>h.c===c.name||(!c.name)),b,k,f,c);
}
function render(list,b,k,f,c){
  if(!list.length){cont.innerHTML='<div id="status">لا أحاديث هنا.</div>';return}
  cont.innerHTML=`<div class="crumb">${esc(b.name)} ← ${esc(k.name)} ${f.name&&f.name!=='—'?'← '+esc(f.name):''} ← <b>${esc(c.name)}</b> · ${list.length} حديثاً</div>`+
    list.map(h=>`<div class="hd">
      <div class="mtn">${esc(h.t)}</div>
      <div class="row">
        ${h.ref?`<span class="tag r">${esc(h.ref)}</span>`:''}
        ${h.h?`<span class="tag g">${esc(h.h)}</span>`:''}
        ${h.p?`<span class="tag">ص ${esc(h.p)}</span>`:''}
        <span class="tag">#${esc(h.n)}</span>
      </div>
      ${h.k?`<details class="tk"><summary>التخريج</summary>${esc(h.k)}</details>`:''}
      ${h.fn?`<details class="tk"><summary>حواشٍ</summary>${esc(h.fn)}</details>`:''}
    </div>`).join('');
  cont.scrollTop=0;
}
</script>
</body>
</html>
