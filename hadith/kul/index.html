وهات", "f": "", "p": ""}, {"n": 118, "t": "عن عَبْدِ الرَّحْمَنِ بْنِ سَمُرَةَ، قَالَ: قَالَ النَّبِيُّ صلى الله عليه وسلم: «يَا عَبْدَ الرَّحْمَنِ بْنَ سَمُرَةَ، لاَ تَسْأَلِ الإِمَارَةَ؛ فَإِنَّكَ إِنْ أُوتِيتَهَا عَنْ مَسْأَلَةٍ، وُكِلْتَ إِلَيْهَا، وَإِنْ أُوتِيتَهَا مِنْ غَيْرِ مَسْأَلَةٍ، أُعِنْتَ عَلَيْهَا، وَإِذَا حَلَفْتَ عَلَى يَمِينٍ، فَرَأَيْتَ غَيْرَهَا خَيْرًا مِنْهَا، فَكَفِّرْ عَنْ يَمِينِكَ، وَأْتِ الَّذِي هُوَ خَيْرٌ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6622)، ومسلم (1652).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 119, "t": "عَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «كَانَ النَّبِيُّ صلى الله عليه وسلم يُعْجِبُهُ التَّيَمُّنُ فِي تَنَعُّلِهِ، وتَرَجُّلِهِ، وطُهُورِهِ، وفِي شَأْنِهِ كُلِّهِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (168)، ومسلم (268).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 120, "t": "عَنْ وَرَّادٍ، كَاتِبِ المُغِيرَةِ، قَالَ: كَتَبَ مُعَاوِيَةُ إِلَى المُغِيرَةِ رضي الله عنهما: اكْتُبْ إِلَيَّ مَا سَمِعْتَ مِنْ رَسُولِ اللَّهِ صلى الله عليه وسلم، فَكَتَبَ إِلَيْهِ: إِنَّ نَبِيَّ اللَّهِ صلى الله عليه وسلم كَانَ يَقُولُ فِي دُبُرِ كُلِّ صَلاةٍ: «لا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لَهُ المُلْكُ، وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لا مَانِعَ لِمَا أَعْطَيْتَ، وَلا مُعْطِيَ لِمَا مَنَعْتَ، وَلا يَنْفَعُ ذَا الجَدِّ مِنْكَ الجَدُّ» وَكَتَبَ إِلَيْهِ: إِنَّه: «كَانَ يَنْهَى عَنْ قِيلَ وَقَالَ، وَكَثْرَةِ السُّؤَالِ، وَإِضَاعَةِ المَالِ، وَكَانَ يَنْهَى عَنْ عُقُوقِ الأُمَّهَاتِ، وَوَأْدِ البَنَاتِ، وَمَنْعٍ وَهَاتِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (7292)، ومسلم (593).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 121, "t": "عَنِ الْمِقْدَامِ بْنِ مَعْدِي كَرِبَ رضي الله عنه، قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ: «مَا مَلَأَ آدَمِيٌّ وِعَاءً شَرًّا مِنْ بَطْنٍ. بِحَسْبِ ابْنِ آدَمَ أُكُلَاتٌ يُقِمْنَ صُلْبَهُ، فَإِنْ كَانَ لَا مَحَالَةَ، فَثُلُثٌ لِطَعَامِهِ، وَثُلُثٌ لِشَرَابِهِ، وَثُلُثٌ لِنَفَسِهِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أحمد (17186)، والنسائيُّ (6737)، والترمذيُّ (2380)، وابن ماجه (3349)، وقال الترمذيُّ: هَذَا حَدِيثٌ حَسَنٌ صَحِيح، وصححه الألبانيُّ في \"صحيح الترغيب والترهيب\" (2135).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 122, "t": "عن أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «إِذَا اقْتَرَبَ الزَّمَانُ، لَمْ تَكَدْ رُؤْيَا الْمُسْلِمِ تَكْذِبُ، وَأَصْدَقُكُمْ رُؤْيَا أَصْدَقُكُمْ حَدِيثًا، وَرُؤْيَا الْمُسْلِمِ جُزْءٌ مِنْ خَمْسٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ، وَالرُّؤْيَا ثَلَاثَةٌ: فَرُؤْيَا الصَّالِحَةِ بُشْرَى مِنَ اللهِ، وَرُؤْيَا تَحْزِينٌ مِنَ الشَّيْطَانِ، وَرُؤْيَا مِمَّا يُحَدِّثُ الْمَرْءُ نَفْسَهُ، فَإِنْ رَأَى أَحَدُكُمْ مَا يَكْرَهُ، فَلْيَقُمْ فَلْيُصَلِّ، وَلَا يُحَدِّثْ بِهَا النَّاسَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2263).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 123, "t": "عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُعَلِّمُنَا الِاسْتِخَارَةَ فِي الأُمُورِ كُلِّهَا، كَمَا يُعَلِّمُنَا السُّورَةَ مِنَ القُرْآنِ، يَقُولُ: «إِذَا هَمَّ أَحَدُكُمْ بِالأَمْرِ، فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الفَرِيضَةِ، ثُمَّ لِيَقُلْ: اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ العَظِيمِ؛ فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ، وَتَعْلَمُ وَلاَ أَعْلَمُ، وَأَنْتَ عَلَّامُ الغُيُوبِ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي - أَوْ قَالَ: عَاجِلِ أَمْرِي وَآجِلِهِ - فَاقْدُرْهُ لِي، وَيَسِّرْهُ لِي، ثُمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي - أَوْ قَالَ: فِي عَاجِلِ أَمْرِي وَآجِلِهِ - فَاصْرِفْهُ عَنِّي، وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِي الخَيْرَ حَيْثُ كَانَ، ثُمَّ أَرْضِنِي. قَالَ: وَيُسَمِّي حَاجَتَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (1162).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 124, "t": "عَنْ أَبِي ذَرٍّ – رضي الله عنه - أَنَّ نَاسًا مِنْ أَصْحَابِ النَّبِيِّ صلى الله عليه وسلم قَالُوا لِلنَّبِيِّ صلى الله عليه وسلم: يَا رَسُولَ اللهِ، ذَهَبَ أَهْلُ الدُّثُورِ بِالْأُجُورِ، يُصَلُّونَ كَمَا نُصَلِّي، وَيَصُومُونَ كَمَا نَصُومُ، وَيَتَصَدَّقُونَ بِفُضُولِ أَمْوَالِهِمْ، قَالَ: «أَوَلَيْسَ قَدْ جَعَلَ اللهُ لَكُمْ مَا تَصَّدَّقُونَ؟ إِنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً، وَكُلِّ تَكْبِيرَةٍ صَدَقَةً، وَكُلِّ تَحْمِيدَةٍ صَدَقَةً، وَكُلِّ تَهْلِيلَةٍ صَدَقَةً، وَأَمْرٌ بِالْمَعْرُوفِ صَدَقَةٌ، وَنَهْيٌ عَنْ مُنْكَرٍ صَدَقَةٌ، وَفِي بُضْعِ أَحَدِكُمْ صَدَقَةٌ»، قَالُوا: يَا رَسُولَ اللهِ، أَيَأتِي أَحَدُنَا شَهْوَتَهُ وَيَكُونُ لَهُ فِيهَا أَجْرٌ؟ قَالَ: «أَرَأَيْتُمْ لَوْ وَضَعَهَا فِي حَرَامٍ، أَكَانَ عَلَيْهِ فِيهَا وِزْرٌ؟ فَكَذَلِكَ إِذَا وَضَعَهَا فِي الْحَلَالِ كَانَ لَهُ أَجْرٌ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (1006).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}]}, {"mq": "الباب الرابع: الأوامر والنواهي", "k": "الوَحدة الرابعة: في سبيل الله والدعوة إليه", "hs": [{"n": 125, "t": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، أَنَّ النَّبِيَّ صلى الله عليه وسلم، قَالَ: «بَلِّغُوا عَنِّي وَلَوْ آيَةً، وَحَدِّثُوا عَنْ بَنِي إِسْرَائِيلَ وَلاَ حَرَجَ، وَمَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا، فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3461). \n", "hadith_no": 1}], "c": "الوَحدة الرابعة: في سبيل الله والدعوة إليه", "f": "", "p": ""}, {"n": 126, "t": "عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ رضي الله عنه، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «لَا يَزَالُ طَائِفَةٌ مِنْ أُمَّتِي ظَاهِرِينَ حَتَّى يَأْتِيَهُمْ أَمْرُ اللهِ وَهُمْ ظَاهِرُونَ»{[1]}، وفي رواية: «لَا تَزَالُ طَائِفَةٌ مِنْ أُمَّتِي قَائِمَةً بِأَمْرِ اللهِ لَا يَضُرُّهُمْ مَنْ خَذَلَهُمْ أَوْ خَالَفَهُمْ حَتَّى يَأْتِيَ أَمْرُ اللهِ وَهُمْ ظَاهِرُونَ عَلَى النَّاسِ»{[2]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (7311)، ومسلم (1037).\n", "hadith_no": 1}, {"footnotes": " رواه مسلم (1037).\n", "hadith_no": 2}], "c": "الوَحدة الرابعة: في سبيل الله والدعوة إليه", "f": "", "p": ""}, {"n": 127, "t": "عَنْ أبِي هُريرةَ رضي الله عنه، أنَّ رسولَ اللهِ صلى الله عليه وسلم قَالَ: «مَنْ دَعَا إلى هُدًى، كان لهُ مِنَ الأَجْرِ مِثْلُ أجورِ مَنْ تَبِعهُ، لا يَنقُصُ ذلك مِنْ أجُورِهم شيئًا، ومَنْ دَعَا إِلَى ضَلالَةٍ، كان عليه مِنَ الإثمِ مثلُ آثامِ مَنْ تَبِعهُ، لا يَنْقُصُ ذلك مِنْ آثامِهم شَيئًا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2674).\n", "hadith_no": 1}], "c": "الوَحدة الرابعة: في سبيل الله والدعوة إليه", "f": "", "p": ""}, {"n": 128, "t": "عَنْ طَارِقِ بْنِ شِهَابٍ قَالَ: أَوَّلُ مَنْ بَدَأَ بِالخُطْبَةِ يَوْمَ العِيدِ قَبْلَ الصَّلاةِ مَرْوَانُ، فَقَامَ إِلَيْهِ رَجُلٌ، فَقَالَ: الصَّلاةُ قَبْلَ الخُطْبَةِ، فَقَالَ: قَدْ تُرِكَ مَا هُنَالِكَ. فَقَالَ أَبُو سَعِيدٍ رضي الله عنه: أَمَّا هذَا فَقَدْ قَضَى مَا عَلَيْهِ؛ سَمِعْتُ رَسُولَ اللهِ صلى الله عليه وسلم يَقُولُ: «مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ، وَذَلِكَ أَضْعَفُ الإِيمَانِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (49).\n", "hadith_no": 1}], "c": "الوَحدة الرابعة: في سبيل الله والدعوة إليه", "f": "", "p": ""}, {"n": 129, "t": "عَنِ النُّعْمَانِ بْنِ بَشِيرٍ رضي الله عنه، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «مَثَلُ القَائِمِ عَلَى حُدُودِ اللَّه وَالوَاقِعِ فِيهَا، كَمَثَلِ قَوْمٍ اسْتَهَمُوا عَلَى سَفِينَةٍ؛ فَأَصَابَ بَعْضُهُمْ أَعْلاهَا، وَبَعْضُهُمْ أَسْفَلَهَا، فَكَانَ الَّذِينَ في أَسْفَلِهَا إِذَا اسْتَقَوْا مِنَ المَاءِ مَرُّوا عَلَى مَنْ فَوْقَهُمْ، فَقَالُوا: لَو أَنَّا خَرَقْنَا في نَصِيبِنَا خَرْقًا وَلَمْ نُؤْذِ مَنْ فَوْقَنَا، فَإِنْ يَتْرُكُوهُمْ وَمَا أَرَادُوا هَلَكُوا جَمِيعًا، وَإِنْ أَخَذُوا عَلى أَيْدِيهِمْ نَجَوْا، وَنَجَوْا جَمِيعًا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2493).\n", "hadith_no": 1}], "c": "الوَحدة الرابعة: في سبيل الله والدعوة إليه", "f": "", "p": ""}]}, {"mq": "الباب الرابع: الأوامر والنواهي", "k": "الوَحْدة الخامسة: الأذكار", "hs": [{"n": 130, "t": "عن شَدَّادِ بْن أَوْسٍ رضي الله عنه: عَنِ النَّبِيِّ صلى الله عليه وسلم: «سَيِّدُ الِاسْتِغْفَارِ أَنْ تَقُولَ: اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي؛ فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ \" قَالَ: «وَمَنْ قَالَهَا مِنَ النَّهَارِ مُوقِنًا بِهَا، فَمَاتَ مِنْ يَوْمِهِ قَبْلَ أَنْ يُمْسِيَ، فَهُوَ مِنْ أَهْلِ الجَنَّةِ، وَمَنْ قَالَهَا مِنَ اللَّيْلِ وَهُوَ مُوقِنٌ بِهَا، فَمَاتَ قَبْلَ أَنْ يُصْبِحَ، فَهُوَ مِنْ أَهْلِ الجَنَّةِ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6306).\n", "hadith_no": 1}], "c": "الوَحْدة الخامسة: الأذكار", "f": "", "p": ""}, {"n": 131, "t": "عَنْ عَبْدِ اللَّهِ بْنِ بُسْرٍ رضي الله عنه، أَنَّ رَجُلًا قَالَ: يَا رَسُولَ اللَّهِ، إِنَّ شَرَائِعَ الإِسْلَامِ قَدْ كَثُرَتْ عَلَيَّ، فَأَخْبِرْنِي بِشَيْءٍ أَتَشَبَّثُ بِهِ، قَالَ: «لَا يَزَالُ لِسَانُكَ رَطْبًا مِنْ ذِكْرِ اللَّهِ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أحمد (18167)، وابن ماجه (3793)، والترمذيُّ (3375)، وصحَّحه الألبانيُّ في \"صحيح الترغيب والترهيب\" (1491).\n", "hadith_no": 1}], "c": "الوَحْدة الخامسة: الأذكار", "f": "", "p": ""}]}, {"mq": "الباب الرابع: الأوامر والنواهي", "k": "الوَحْدة السادسة: الفتن والابتلاء", "hs": [{"n": 132, "t": "عَنْ حُذَيْفَةَ، قَالَ: كُنَّا عِنْدَ عُمَرَ، فَقَالَ: أَيُّكُمْ سَمِعَ رَسُولَ اللهِ صلى الله عليه وسلم يَذْكُرُ الْفِتَنَ؟ فَقَالَ قوْمٌ: نَحْنُ سَمِعْنَاهُ، فَقَالَ: لَعَلَّكُمْ تَعْنُونَ فِتْنَةَ الرَّجُلِ فِي أَهْلِهِ وَجَارِهِ؟ قَالُوا: أَجَلْ. قَالَ: تِلْكَ تُكَفِّرُهَا الصَّلَاةُ وَالصِّيَامُ وَالصَّدَقَةُ؛ وَلَكِنْ أَيُّكُمْ سَمِعَ النَّبِيَّ صلى الله عليه وسلم يَذْكُرُ الَّتِي تَمُوجُ مَوْجَ الْبَحْرِ؟ قَالَ حُذَيْفَةُ: فَأَسْكَتَ الْقَوْمُ، فَقُلْتُ: أَنَا. قَالَ: أَنْتَ للهِ أَبُوكَ! قَالَ حُذَيْفَةُ: سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ: «تُعْرَضُ الْفِتَنُ عَلَى الْقُلُوبِ كَالْحَصِيرِ عُودًا عُودًا، فَأَيُّ قَلْبٍ أُشْرِبَهَا، نُكِتَ فِيهِ نُكْتَةٌ سَوْدَاءُ، وَأَيُّ قَلْبٍ أَنْكَرَهَا، نُكِتَ فِيهِ نُكْتَةٌ بَيْضَاءُ، حَتَّى تَصِيرَ عَلَى قَلْبَيْنِ: عَلَى أَبْيَضَ مِثْلِ الصَّفَا، فَلَا تَضُرُّهُ فِتْنَةٌ مَا دَامَتِ السَّمَوَاتُ وَالْأَرْضُ، وَالْآخَرُ أَسْوَدُ مُرْبَادًّا كَالْكُوزِ مُجَخِّيًا، لَا يَعْرِفُ مَعْرُوفًا، وَلَا يُنْكِرُ مُنْكَرًا، إِلَّا مَا أُشْرِبَ مِنْ هَوَاهُ». قَالَ حُذَيْفَةُ: وَحَدَّثْتُهُ: أَنَّ بَيْنَكَ وَبَيْنَهَا بَابًا مُغْلَقًا يُوشِكُ أَنْ يُكْسَرَ. قَالَ عُمَرُ: أَكَسْرًا لَا أَبَا لَكَ؟ فَلَوْ أَنَّهُ فُتِحَ لَعَلَّهُ كَانَ يُعَادُ. قُلْتُ: لَا بَلْ يُكْسَرُ. وَحَدَّثْتُهُ: أَنَّ ذَلِكَ الْبَابَ رَجُلٌ يُقْتَلُ أَوْ يَمُوتُ، حَدِيثًا لَيْسَ بِالْأَغَالِيطِ{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (144).\n", "hadith_no": 1}], "c": "الوَحْدة السادسة: الفتن والابتلاء", "f": "", "p": ""}, {"n": 133, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «لَا تَسُبُّوا أَصْحَابِي، لَا تَسُبُّوا أَصْحَابِي، فَوَالَّذِي نَفْسِي بِيَدِهِ، لَوْ أَنَّ أَحَدَكُمْ أَنْفَقَ مِثْلَ أُحُدٍ ذَهَبًا، مَا أَدْرَكَ مُدَّ أَحَدِهِمْ، وَلَا نَصِيفَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3673)، ومسلم (2541).\n", "hadith_no": 1}], "c": "الوَحْدة السادسة: الفتن والابتلاء", "f": "", "p": ""}, {"n": 134, "t": "عَنْ عِمْرَانَ بْنَ حُصَيْنٍ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «خَيْرُ أُمَّتِي قَرْنِي، ثُمَّ الَّذِينَ يَلُونَهُمْ، ثُمَّ الَّذِينَ يَلُونَهُمْ - قَالَ عِمْرَانُ: فَلاَ أَدْرِي، أَذَكَرَ بَعْدَ قَرْنِهِ قَرْنَيْنِ أَوْ ثَلاَثًا؟ - ثُمَّ إِنَّ بَعْدَكُمْ قَوْمًا يَشْهَدُونَ وَلاَ يُسْتَشْهَدُونَ، وَيَخُونُونَ وَلاَ يُؤْتَمَنُونَ، وَيَنْذِرُونَ وَلاَ يَفُونَ، وَيَظْهَرُ فِيهِمُ السِّمَنُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3650)، ومسلم (2535).\n", "hadith_no": 1}], "c": "الوَحْدة السادسة: الفتن والابتلاء", "f": "", "p": ""}, {"n": 135, "t": "عن مَعْقِلِ بْنِ يَسَارٍ رضي الله عنه، قَالَ: قَالَ النَّبِيُّ صلى الله عليه وسلم: «الْعِبَادَةُ فِي الْهَرْجِ كَهِجْرَةٍ إِلَيَّ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2948).\n", "hadith_no": 1}], "c": "الوَحْدة السادسة: الفتن والابتلاء", "f": "", "p": ""}, {"n": 136, "t": "عنْ أَبي سَعيدٍ وأَبي هُرَيْرة - رضيَ اللَّه عَنْهُمَا - عن النَّبيِّ صلى الله عليه وسلم قَالَ: «مَا يُصِيبُ الْمُسْلِمَ مِنْ نَصَبٍ وَلا وَصَبٍ وَلا هَمٍّ وَلا حَزَنٍ وَلا أَذًى وَلا غمٍّ، حتَّى الشَّوْكَةُ يُشَاكُها، إِلَّا كفَّر اللَّه بهَا مِنْ خطَايَاه»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (5641)، ومسلم (2573).\n", "hadith_no": 1}], "c": "الوَحْدة السادسة: الفتن والابتلاء", "f": "", "p": ""}, {"n": 137, "t": "عن عُبَيْدِ اللهِ بْنِ مِحْصَنٍ الخَطْمِيِّ، عن النبيِّ صلى الله عليه وسلم قال: «مَنْ أَصْبَحَ آمِنًا فِي سِرْبِهِ، مُعَافًى فِي جَسَدِهِ، عِنْدَهُ طَعَامُ يَوْمِهِ، فَكَأَنَّمَا حِيزَتْ لَهُ الدُّنْيَا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ في \"الأدب المفرد\" (300)، والترمذيُّ (2346)، وابن ماجه (4141)، وحسَّنه الألبانيُّ في \"صحيح الأدب المفرد\" (ص: 127).\n", "hadith_no": 1}], "c": "الوَحْدة السادسة: الفتن والابتلاء", "f": "", "p": ""}]}, {"mq": "الباب الرابع: الأوامر والنواهي", "k": "الوَحدة السابعة: التوبة", "hs": [{"n": 138, "t": "عَنْ أَنَسِ بْن مَالِكٍ رضي الله عنه، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ: «كُلُّ ابْنِ آدَمَ خَطَّاءٌ، وَخَيْرُ الخَطَّائِينَ التَّوَّابُونَ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أحمد (13049)، والترمذيُّ (2499)، وابن ماجه (4251)، وحسَّنه الألبانيُّ في \"صحيح الترغيب والترهيب\" (3139).\n", "hadith_no": 1}], "c": "الوَحدة السابعة: التوبة", "f": "", "p": ""}, {"n": 139, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَنْ كَانَتْ لَهُ مَظْلِمَةٌ لِأَخِيهِ مِنْ عِرْضِهِ أَوْ شَيْءٍ، فَلْيَتَحَلَّلْهُ مِنْهُ اليَوْمَ، قَبْلَ أَنْ لاَ يَكُونَ دِينَارٌ وَلاَ دِرْهَمٌ، إِنْ كَانَ لَهُ عَمَلٌ صَالِحٌ، أُخِذَ مِنْهُ بِقَدْرِ مَظْلِمَتِهِ، وَإِنْ لَمْ تَكُنْ لَهُ حَسَنَاتٌ، أُخِذَ مِنْ سَيِّئَاتِ صَاحِبِهِ، فَحُمِلَ عَلَيْهِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2449).\n", "hadith_no": 1}], "c": "الوَحدة السابعة: التوبة", "f": "", "p": ""}, {"n": 140, "t": "عَنْ أَنَسِ بْن مَالِكٍ رضي الله عنه، قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ: قَالَ اللَّهُ تَبَارَكَ وَتَعَالَى: «يا بْنَ آدَمَ، إِنَّكَ مَا دَعَوْتَنِي وَرَجَوْتَنِي غَفَرْتُ لَكَ عَلَى مَا كَانَ فِيكَ، وَلَا أُبَالِي، يا بْنَ آدَمَ، لَوْ بَلَغَتْ ذُنُوبُكَ عَنَانَ السَّمَاءِ ثُمَّ اسْتَغْفَرْتَنِي غَفَرْتُ لَكَ، وَلَا أُبَالِي، يا بْنَ آدَمَ، إِنَّكَ لَوْ أَتَيْتَنِي بِقُرَابِ الأرضِ خَطَايَا، ثُمَّ لَقِيتَنِي لَا تُشْرِكُ بِي شَيْئًا، لَأَتَيْتُكَ بِقُرَابِهَا مَغْفِرَةً»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه الترمذيُّ (3540)، وحسَّنه الألبانيُّ في \"صحيح الترغيب والترهيب\" (1616).\n", "hadith_no": 1}], "c": "الوَحدة السابعة: التوبة", "f": "", "p": ""}, {"n": 141, "t": "عَنْ عَمْرِو بنِ العَاصِ رضي الله عنه قَالَ: لَمَّا جَعَلَ اللهُ الْإِسْلامَ فِي قَلْبِي، أَتَيْتُ النَّبِيَّ صلى الله عليه وسلم، فَقُلْتُ: ابْسُطْ يَمِينَكَ فَلْأُبَايِعْكَ، فَبَسَطَ يَمِينَهُ، قَالَ: فَقَبَضْتُ يَدِي. قَالَ: «مَا لَكَ يَا عَمْرُو؟» قَالَ: قُلْتُ: أَرَدْتُ أَنْ أَشْتَرِطَ، قَالَ: «تَشْتَرِطُ بِمَاذَا؟» قُلْتُ: أَنْ يُغْفَرَ لِي، قَالَ: «أَمَا عَلِمْتَ أَنَّ الْإِسْلَامَ يَهْدِمُ مَا كَانَ قَبْلَهُ؟ وَأَنَّ الهِجْرَةَ تَهْدِمُ مَا كَانَ قَبْلَهَا؟ وَأَنَّ الحَجَّ يَهْدِمُ مَا كَانَ قَبْلَهُ؟»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (121).\n", "hadith_no": 1}], "c": "الوَحدة السابعة: التوبة", "f": "", "p": ""}, {"n": 142, "t": "عَنْ حَكِيمِ بْنِ حِزَامٍ رضي الله عنه، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَرَأَيْتَ أَشْيَاءَ كُنْتُ أَتَحَنَّثُ بِهَا فِي الجَاهِلِيَّةِ مِنْ صَدَقَةٍ أَوْ عَتَاقَةٍ، وَصِلَةِ رَحِمٍ، فَهَلْ فِيهَا مِنْ أَجْرٍ؟ فَقَالَ النَّبِيُّ صلى الله عليه وسلم: «أَسْلَمْتَ عَلَى مَا سَلَفَ مِنْ خَيْرٍ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (1436)، ومسلم (123).\n", "hadith_no": 1}], "c": "الوَحدة السابعة: التوبة", "f": "", "p": ""}]}, {"mq": "الباب الخامس: الالتزام بالشريعة وكمالها", "k": "الالتزام بالشريعة وكمالها", "hs": [{"n": 143, "t": "عن الْمِقدامِ بنِ مَعْدِي كَرِبَ رضي الله عنه أن النبيَّ صلى الله عليه وسلم قال: «ألا هل عسى رجُلٌ يَبْلُغُه الحديثُ عَنِّي وهو مُتَّكِئٌ على أريكته، فيقول: بينَنا وبينَكم كتابُ الله، فما وجدْنا فيه حلالًا استَحْلَلناه، وما وجدْنا فيه حرامًا حرَّمناه، وإنَّ ما حرَّمَ رسولُ الله صلى الله عليه وسلم كما حرَّمَ اللهُ»{[1]}. وفي لفظ أبي داودَ: «ألا إني أوتيتُ الكتابَ ومثلَه معه».", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أبو داود (4604)، والترمذيُّ (2664)، واللفظ له، وابن ماجه (12)، وقال الترمذيُّ: حسن غريب، وصحَّحه الألبانيُّ في \"صحيح الجامع الصغير وزيادته\" (1/ 516).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}, {"n": 144, "t": "عن العِرباضِ بنِ ساريةَ رضي الله عنه قال: قام فينا رسولُ الله صلى الله عليه وسلم ذاتَ يوم، فوعَظَنا موعظةً بليغةً، وَجِلَتْ منها القلوبُ، وذَرَفَت منها العيونُ، فقيل: يا رسول الله، وعظْتَنا موعظةَ مُوَدِّع، فاعهَدْ إلينا بعهدٍ، فقال: «عليكم بتقوى الله، والسمعِ والطاعة، وإنْ عبدًا حبشيًّا، وسترَوْنَ من بعدي اختلافًا شديدًا، فعليكم بسُنَّتي، وسُنَّة الخلفاء الراشدين المهديِّين، عَضُّوا عليها بالنَّوَاجِذ، وإيَّاكم والأمورَ المُحدَثاتِ؛ فإن كلَّ بِدعة ضلالة»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أبو داود (4607)، والترمذيُّ (2676)، وابن ماجه (42)، وصحَّحه ابن الملقِّن في \"البدر المنير\" (9/ 582)، وصحَّحه الألبانيُّ في المشكاة (165)، والإرواء (2455).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}, {"n": 145, "t": "عن سفيانَ بنِ عبد الله الثقفيِّ رضي الله عنه قال: قلتُ: يا رسولَ الله، قل لي في الإسلام قولًا لا أسأل عنه أحدًا بعدكَ - وفي حديث أبي أسامة: غيرَك - قال: «قل: آمنتُ بالله، فاستقم»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (38).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}, {"n": 146, "t": "عن طارقِ بنِ شهابٍ قال: جاء رجُلٌ من اليهودِ إلى عمرَ رضي الله عنه، فقال: يا أميرَ المؤمنِينَ، آيةٌ في كتابِكم تَقرؤونها، لو علينا نزلت معشرَ اليهود، لاتَّخَذْنا ذلك اليومَ عيدًا. قال: وأيُّ آيةٍ؟ قال: {الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الإِسْلاَمَ دِينًا} [المائدة: 3] فقال عمر رضي الله عنه: إني لأعلمُ اليومَ الذي نزلتْ فيه، والمكانَ الذي نزلتْ فيه: نزلتْ على رسول الله صلى الله عليه وسلم بعرفاتٍ في يوم جُمعة{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (45)، ومسلم (3017).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}, {"n": 147, "t": "عن حُمْرَانَ، مَوْلَى عُثْمَانَ، أَنَّ عُثْمَانَ بْنَ عَفَّانَ - رَضِيَ اللهُ عَنْهُ - دَعَا بِوَضُوءٍ فَتَوَضَّأ،َ فَغَسَلَ كَفَّيْهِ ثَلَاثَ مَرَّاتٍ، ثُمَّ مَضْمَضَ وَاسْتَنْثَرَ، ثُمَّ غَسَلَ وَجْهَهُ ثَلَاثَ مَرَّاتٍ، ثُمَّ غَسَلَ يَدَهُ الْيُمْنَى إِلَى الْمِرْفَقِ ثَلَاثَ مَرَّاتٍ، ثُمَّ غَسَلَ يَدَهُ الْيُسْرَى مِثْلَ ذَلِكَ، ثُمَّ مَسَحَ رَأْسَهُ، ثُمَّ غَسَلَ رِجْلَهُ الْيُمْنَى إِلَى الْكَعْبَيْنِ ثَلَاثَ مَرَّاتٍ، ثُمَّ غَسَلَ الْيُسْرَى مِثْلَ ذَلِكَ، ثُمَّ قَالَ: رَأَيْتُ رَسُولَ اللهِ صلى الله عليه وسلم تَوَضَّأَ نَحْوَ وُضُوئِي هَذَا، ثُمَّ قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «مَنْ تَوَضَّأَ نَحْوَ وُضُوئِي هَذَا، ثُمَّ قَامَ فَرَكَعَ رَكْعَتَيْنِ لَا يُحَدِّثُ فِيهِمَا نَفْسَهُ، غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ»، وزاد مسلم في رواية: «وَكَانَتْ صَلاَتُهُ وَمَشْيُهُ إِلَى الْمَسْجِدِ نَافِلَةً»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (164)، ومسلم واللفظ له (226)، والرواية (229).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}, {"n": 148, "t": "عَنْ جَابِرِ بنِ عبدالله - رضي الله عنهما - قَالَ: «لَعَنَ رَسُولُ اللهِ صلى الله عليه وسلم آكِلَ الرِّبَا، وَمُؤْكِلَهُ، وَكَاتِبَهُ، وَشَاهِدَيْهِ»، وَقَالَ: «هُمْ سَوَاءٌ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (1598).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}, {"n": 149, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «سَبْعَةٌ يُظِلُّهُمُ اللَّهُ فِي ظِلِّهِ، يَوْمَ لا ظِلَّ إِلَّا ظِلُّهُ: الإِمَامُ العَادِلُ، وَشَابٌّ نَشَأَ فِي عِبَادَةِ رَبِّهِ، وَرَجُلٌ قَلْبُهُ مُعَلَّقٌ فِي المَسَاجِدِ، وَرَجُلانِ تَحَابَّا فِي اللَّهِ اجْتَمَعَا عَلَيْهِ وَتَفَرَّقَا عَلَيْهِ، وَرَجُلٌ طَلَبَتْهُ امْرَأَةٌ ذَاتُ مَنْصِبٍ وَجَمَالٍ، فَقَالَ: إِنِّي أَخَافُ اللَّهَ، وَرَجُلٌ تَصَدَّقَ، أَخْفَى حَتَّى لاَ تَعْلَمَ شِمَالُهُ مَا تُنْفِقُ يَمِينُهُ، وَرَجُلٌ ذَكَرَ اللَّهَ خَالِيًا فَفَاضَتْ عَيْنَاه»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (660)، ومسلم (1031).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}, {"n": 150, "t": "عن أبي يحيى صُهَيْبِ بنِ سنانٍ - رضي الله عنه - قال: قال رسول الله صلى الله عليه وسلم: «عَجَبًا لِأَمْرِ الْمُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ، وَلَيْسَ ذَاكَ لِأَحَدٍ إِلَّا لِلْمُؤْمِنِ، إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ، فَكَانَ خَيْرًا لَهُ، وَإِنْ أَصَابَتْهُ ضَرَّاءُ، صَبَرَ، فَكَانَ خَيْرًا لَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2999).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}, {"n": 151, "t": "عن أبي هريرة رضي الله عنه قال: جاء رجل إلى رسول الله صلى الله عليه وسلم فقال: يَا رَسُولَ اللَّهِ، مَنْ أَحَقُّ النَّاسِ بِحُسْنِ صَحَابَتِي؟ قَالَ: «أُمُّكَ» قَالَ: ثُمَّ مَنْ؟ قَالَ: «ثُمَّ أُمُّكَ» قَالَ: ثُمَّ مَنْ؟ قَالَ: «ثُمَّ أُمُّكَ» قَالَ: ثُمَّ مَنْ؟ قَالَ: «ثُمَّ أَبُوكَ»، وفي رواية لمسلم قال: «أُمُّكَ، ثُمَّ أُمُّكَ، ثُمَّ أُمُّكَ، ثُمَّ أَبُوكَ، ثُمَّ أَدْنَاكَ أَدْنَاكَ» {[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": "  رواه البخاريُّ (5971)، ومسلم (2548).\n", "hadith_no": 1}], "c": "الباب الخامس: الالتزام بالشريعة وكمالها", "f": "", "p": ""}]}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){return String(s||'').replace(/[ً-ٰٟۖ-ۭـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')}
function hi(t,q){if(!q)return esc(t);const n=norm(t);const mapIdx=[];for(let j=0;j<t.length;j++){const c=t[j];if(/[ً-ٰٟۖ-ۭـ]/.test(c))continue;mapIdx.push(j)}
  let start=0,found=[];while(true){const p=n.indexOf(q,start);if(p<0)break;found.push(p);start=p+q.length}
  if(!found.length)return esc(t);
  const mark=new Set();found.forEach(p=>{for(let k=p;k<p+q.length&&k<mapIdx.length;k++)mark.add(mapIdx[k])});
  let out='';for(let j=0;j<t.length;j++){const on=mark.has(j);if(on&&!out.endsWith('<mark>'))out+='<mark>';if(!on&&out.endsWith('<mark>'))out+='</mark>';out+=esc(t[j])}
  return out;}

/* بنية الكتاب: مقصد ← وحدة ← باب فرعي ← أحاديث */
const BOOK=[];
for(const u of DATA){
  let mq=BOOK.find(m=>m.nm===u.mq);
  if(!mq){mq={nm:u.mq,units:[]};BOOK.push(mq)}
  const babs=[];
  for(const h of u.hs){
    if(!h.c)continue;
    let b=babs.find(x=>x.nm===h.c);
    if(!b){b={nm:h.c,hs:[]};babs.push(b)}
    b.hs.push(h);
  }
  mq.units.push({nm:u.k,babs,n:u.hs.length});
}
const TOTAL=DATA.reduce((a,u)=>a+u.hs.length,0);
const NBAB=BOOK.reduce((a,m)=>a+m.units.reduce((b,u)=>b+u.babs.length,0),0);
const NUNIT=DATA.length;
const S={stack:[{lv:'root'}],q:''};
function cur(){return S.stack[S.stack.length-1]}
function go(n){S.stack.push(n);history.pushState({d:S.stack.length},'');S.q='';$('q').value='';render();scrollTo(0,0)}
function back(){if(S.stack.length>1){history.back()}}
window.addEventListener('popstate',e=>{S.stack.length=(e.state&&e.state.d)||1;S.q='';$('q').value='';render()});
history.replaceState({d:1},'');
function sub(x){if(x.lv==='mq')return `${x.node.units.length} وحدات`;if(x.lv==='unit')return `${x.node.babs.length} أبواب`;return ''}
function kids(){
  const c=cur();
  if(c.lv==='root')return BOOK.map(m=>({lv:'mq',nm:m.nm,node:m,n:m.units.reduce((a,x)=>a+x.n,0)}));
  if(c.lv==='mq')return c.node.units.map(u=>({lv:'unit',nm:u.nm,node:u,n:u.n}));
  if(c.lv==='unit')return c.node.babs.map(b=>({lv:'bab',nm:b.nm,node:b,n:b.hs.length}));
  return [];
}
function* allBabs(){
  for(const m of BOOK)for(const u of m.units)for(const b of u.babs)
    yield{bab:b,unit:u,mq:m,path:`${m.nm} ‹ ${u.nm}`};
}
function descend(x){
  let kids=x.lv==='mq'?x.node.units.map(u=>({lv:'unit',nm:u.nm,node:u}))
        :x.lv==='unit'?x.node.babs.map(b=>({lv:'bab',nm:b.nm,node:b})):null;
  if(kids&&kids.length===1)return descend(kids[0]);
  return x;
}
const LBL={root:'الأبواب',mq:'الوحدات',unit:'الأبواب الفرعية',bab:''};
function row(x,i,num){
  return `<div class="row" data-i="${i}" style="animation-delay:${Math.min(i*40,400)}ms">
    ${num?`<span class="num">${num}</span>`:''}
    <span class="nm"><b>${esc(x.nm)}</b><small>${[sub(x),x.n?`${x.n} حديثاً`:''].filter(Boolean).join(' · ')}</small></span>
    <span class="go">‹</span></div>`;
}
function render(){
  const c=cur(),main=$('main'),crumb=$('crumb');
  $('ttl').textContent=c.lv==='root'?'الأحاديث الكلية':c.nm;
  const path=S.stack.slice(1).map(s=>s.nm);
  crumb.className='crumb'+(path.length?' show':'');
  crumb.innerHTML=path.map((p,i)=>`<span data-i="${i}">${esc(p)}</span>`).join('');
  crumb.querySelectorAll('span').forEach(el=>el.onclick=()=>{S.stack.length=+el.dataset.i+2;history.pushState({d:S.stack.length},'');S.q='';$('q').value='';render()});
  const q=norm(S.q);
  if(c.lv==='bab'){renderHadiths(c,q);return}
  const ks=kids();
  let html='';
  if(c.lv==='root')html+=`<div class="hero"><h1 class="naskh">الأحاديث الكلية</h1><div class="orn">۞ ۞ ۞</div><div class="who">صالح أحمد الشامي — المتون المشكولة المنقحة</div><div class="stats"><span><b>${TOTAL}</b> حديثاً</span><span><b>${BOOK.length}</b> أقسام</span><span><b>${NUNIT}</b> وحدة</span><span><b>${NBAB}</b> باباً</span></div></div>`;
  if(ks.length)html+=`<div class="sec">${LBL[c.lv]} · ${ks.length}</div>`;
  const flt=q?ks.filter(x=>norm(x.nm).includes(q)):ks;
  html+=flt.map((x,i)=>row(x,i,c.lv==='root'?i+1:'')).join('')||'<div class="empty">لا نتائج في هذا المستوى.</div>';
  let combos=[];
  if(c.lv==='root'&&!q){
    const comb={};
    BOOK.forEach(m=>m.units.forEach(u=>u.babs.forEach(b=>b.hs.forEach(h=>{
      const key=[...new Set(srcs(h).map(s=>s.nm))].join(' و');(comb[key]=comb[key]||[]).push(h);
    }))));
    combos=Object.entries(comb).sort((a,b)=>b[1].length-a[1].length);
    html+=`<div class="sec">الورود · ${combos.length} مجموعة</div>`+combos.map(([k2,hs],i)=>`<div class="row cb" data-i="${i}"><span class="nm"><b>${esc(k2)}${k2.includes(' و')?'':' فقط'}</b><small>${hs.length} حديثاً</small></span><span class="go">‹</span></div>`).join('');
  }
  if(q&&ks[0]?.lv!=='bab'){
    const hits=[...allBabs()].filter(x=>norm(x.bab.nm).includes(q));
    if(hits.length)html+=`<div class="sec">أبواب الكتاب المطابقة · ${hits.length}</div>`+hits.slice(0,40).map((x,i)=>`<div class="row g" data-i="${i}"><span class="nm"><b>${esc(x.bab.nm)}</b><small class="pth">${esc(x.path)} · ${x.bab.hs.length} حديثاً</small></span><span class="go">‹</span></div>`).join('');
    main.innerHTML=html;
    main.querySelectorAll('.row.g').forEach(el=>el.onclick=()=>{const x=hits[+el.dataset.i];go({lv:'bab',nm:x.bab.nm,node:x.bab})});
    main.querySelectorAll('.row:not(.g)').forEach(el=>el.onclick=()=>{const x=descend(flt[+el.dataset.i]);go({lv:x.lv,nm:x.nm,node:x.node})});
    return;
  }
  main.innerHTML=html;
  main.querySelectorAll('.row.cb').forEach(el=>el.onclick=()=>{const [k2,hs]=combos[+el.dataset.i];go({lv:'bab',nm:k2+(k2.includes(' و')?'':' فقط'),node:{hs}})});
  main.querySelectorAll('.row:not(.cb)').forEach(el=>el.onclick=()=>{const x=descend(flt[+el.dataset.i]);go({lv:x.lv,nm:x.nm,node:x.node})});
}
function srcs(h){
  const f=(h.fn&&h.fn[0]&&h.fn[0].footnotes)||'';
  const out=[];const seen={};let m;
  const re=/([^()\u066B،؛.]{1,60}?)\s*\((\d+(?:\s*[-ـ]\s*\d+)*)\)/g;
  while((m=re.exec(f))){
    let seg=m[1].replace(/^[\s"«،,؛.]+/,'').trim();
    let nm=seg.includes(' في ')?seg.split(' في ').pop():seg.split(/\s+/).slice(-3).join(' ');
    nm=nm.replace(/^(رواه|وأخرج|أخرج|في|ثم|عن|لدى|له)\s+/,'');
    nm=nm.replace(/^و(?=\S)/,'').replace(/^(و|ف)\s+/,'');
    nm=nm.replace(/ واللفظ.*$/,'').replace(/ والرواية.*$/,'');
    nm=nm.replace(/^"+|"+\s*$/g,'').replace(/[ً-ٟ]+$/,'').trim();
    if(!nm||/^(له|لها|عليه|بها|فيه|فيهم|لهن|لنا|عنه|عنها|منه|الرواية|اللفظ)$/.test(nm))continue;
    if(nm==='أحمد'||nm==='مسنده')nm='مسند أحمد';
    if(seen[nm]!==undefined){out[seen[nm]].num+='، '+m[2].trim()}else{seen[nm]=out.length;out.push({nm,num:m[2].trim()})}
  }
  return out;
}
function renderHadiths(c,q){
  const main=$('main');
  const flt=q?c.node.hs.filter(h=>norm(h.t).includes(q)):c.node.hs;
  main.innerHTML=`<div class="sec">${esc(c.nm)} · ${c.node.hs.length} حديثاً${q?` · تطابق ${flt.length}`:''}</div>`+
    (flt.map((h,i)=>`<div class="hd" style="animation-delay:${Math.min(i*40,400)}ms"><span class="hnum">حديث ${h.n}</span><div class="mtn naskh">${hi(h.t,q)}</div><div class="orn">۞</div><div class="src">${srcs(h).map(s=>s.nm.includes('بخاري')?`<a href="../fath/?n=${esc((s.num.match(/\d+/)||[''])[0])}" title="شرح فتح الباري"><b>${esc(s.nm)}</b> ${esc(s.num)} ← فتح الباري</a>`:`<span><b>${esc(s.nm)}</b> ${esc(s.num)}</span>`).join('')}</div><div class="tags">
      ${h.ref?`<span class="r">${esc(h.ref)}</span>`:''}
      ${h.h?`<span class="g">${esc(h.h)}</span>`:''}
      ${h.f?`<span>${esc(h.f)}</span>`:''}
      ${h.p?`<span>ص ${h.p}</span>`:''}</div>
      ${h.k?`<details><summary>التخريج</summary><div class="tk-body">${esc(h.k)}</div></details>`:''}
      ${h.fn&&h.fn.length?`<details><summary>الحواشي (${h.fn.length})</summary><div class="tk-body">${h.fn.map(f=>esc(f.footnotes||f)).join('')}</div></details>`:''}
    </div>`).join('')||'<div class="empty">لا أحاديث مطابقة.</div>');
}

$('q').addEventListener('input',e=>{S.q=e.target.value;render()});
const TH='hadith-theme';
function applyTheme(t){document.body.classList.toggle('light',t==='light');document.body.classList.toggle('dark',t==='dark');$('thB').textContent=t==='light'?'☾':'☀';document.querySelector('meta[name="theme-color"]').content=t==='light'?'#f6f2e9':'#0f1419'}
$('thB').onclick=()=>{const t=document.body.classList.contains('light')?'dark':'light';localStorage.setItem(TH,t);applyTheme(t)};
applyTheme(localStorage.getItem(TH)||'');
render();
</script>
