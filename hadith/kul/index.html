<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>الأحاديث الكلية — صالح الشامي</title>
<style>
:root{--bg:#0f1419;--card:#1a222b;--ink:#e8e2d4;--dim:#9a9384;--acc:#c9a227;--acc2:#2e7d5b;--line:#2a3440;--hov:#22303d;--bar:#0f1419f2;--orn:#c9a22733}
body.light{--bg:#f6f2e9;--card:#fffdf7;--ink:#2a251a;--dim:#6d6657;--acc:#8a6d1c;--acc2:#1f6b4a;--line:#e0d8c5;--hov:#efe9dc;--bar:#f6f2e9f2;--orn:#8a6d1c22}
@media(prefers-color-scheme:light){body:not(.dark){--bg:#f6f2e9;--card:#fffdf7;--ink:#2a251a;--dim:#6d6657;--acc:#8a6d1c;--acc2:#1f6b4a;--line:#e0d8c5;--hov:#efe9dc;--bar:#f6f2e9f2;--orn:#8a6d1c22}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.9;min-height:100vh;padding-bottom:90px}
.naskh{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif}
/* ── top bar ─────────────────────────── */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar-row{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto;padding:8px 12px}
.icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:12px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;text-decoration:none;box-shadow:0 1px 4px #0002}
.icon-btn:active{background:var(--hov);transform:scale(.96)}
#ttl{flex:1;min-width:0;font-size:1rem;color:var(--acc);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{max-width:720px;margin:0 auto;padding:0 12px 8px;display:none;flex-wrap:wrap;gap:6px}
.crumb.show{display:flex}
.crumb span{cursor:pointer;font-size:.74rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--dim)}
.crumb span:active{background:var(--hov);color:var(--acc)}
.srch{max-width:720px;margin:0 auto;padding:2px 12px 10px}
.srch input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;font-family:inherit;box-shadow:inset 0 1px 3px #0002}
.srch input:focus{outline:none;border-color:var(--acc)}
.srch input::placeholder{color:var(--dim)}
main{max-width:720px;margin:0 auto;padding:16px 12px 40px}
/* ── hero ─────────────────────────── */
.hero{text-align:center;padding:26px 18px 20px;margin-bottom:18px;background:radial-gradient(ellipse at top,var(--orn),transparent 70%);border-radius:20px}
.hero h1{font-size:1.9rem;color:var(--acc);font-weight:700;line-height:1.5}
.hero .orn{color:var(--acc);font-size:1.1rem;letter-spacing:6px;margin:4px 0}
.hero .who{color:var(--dim);font-size:.9rem}
.hero .stats{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .stats span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.78rem;color:var(--dim)}
.hero .stats b{color:var(--acc);font-size:.85rem}
/* ── drill rows ─────────────────────────── */
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;animation:up .3s ease both;box-shadow:0 1px 4px #0002}
.row:active{background:var(--hov);border-color:var(--acc);transform:scale(.985)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row .num{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;background:var(--orn)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:1.06rem;font-weight:600;line-height:1.7}
.row .nm small{display:block;color:var(--dim);font-size:.76rem;margin-top:1px}
.row .go{flex:none;color:var(--acc);font-size:1.5rem;font-weight:300}
.row .pth{display:block;font-size:.72rem;color:var(--dim);margin-top:2px}
.sec{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.78rem;margin:20px 4px 10px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
/* ── hadith cards ─────────────────────────── */
.hd{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;position:relative;animation:up .3s ease both;box-shadow:0 1px 4px #0002}
.hd .hnum{position:absolute;top:-11px;inset-inline-start:16px;background:var(--acc);color:#0f1419;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 12px}
.hd .mtn{font-size:1.13rem;line-height:2.25}
.hd .orn{text-align:center;color:var(--acc);margin-top:10px;font-size:.9rem;letter-spacing:4px}
.hd .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:.7rem;color:var(--dim)}
.hd .tags span{border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--bg)}
.hd .tags .r{color:var(--acc);border-color:var(--acc)}
.hd .tags .g{color:var(--acc2);border-color:var(--acc2)}
.hd .src{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:.78rem}
.hd .src::before{content:'رواه:';color:var(--dim);font-size:.72rem;align-self:center}
.hd .src span{border:1px solid var(--acc);border-radius:999px;padding:2px 11px;color:var(--dim);background:var(--orn)}
.hd .src b{color:var(--acc);font-weight:600}
.hd .src a{border:1px solid var(--acc2);border-radius:999px;padding:2px 11px;color:var(--dim);background:var(--orn);text-decoration:none;cursor:pointer}
.hd .src a b{color:var(--acc2);font-weight:600}
.hd details{margin-top:10px;font-size:.84rem;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px}
.hd summary{cursor:pointer;color:var(--acc);font-size:.84rem}
.hd .tk-body{white-space:pre-wrap;margin-top:6px}
.empty{color:var(--dim);text-align:center;padding:40px 12px}
mark{background:var(--acc);color:#0f1419;border-radius:3px;padding:0 2px}
/* ── floating back ─────────────────────────── */
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));inset-inline-start:16px;z-index:30;display:none;align-items:center;gap:8px;background:var(--acc);color:#0f1419;border:none;border-radius:999px;padding:11px 18px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 4px 18px #0006}
.fab.show{display:flex}
.fab:active{transform:scale(.96)}
footer{max-width:720px;margin:0 auto;padding:0 12px 30px;text-align:center}
footer a{color:var(--dim);font-size:.85rem;text-decoration:none}
@media(min-width:721px){.row{transition:transform .15s,border-color .15s}.row:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 6px 18px #0003}}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-row">
    <div id="ttl">الأحاديث الكلية</div>
    <button class="icon-btn" id="thB" title="فاتح/داكن">☀</button>
  </div>
  <div class="crumb" id="crumb"></div>
  <div class="srch"><input id="q" type="search" placeholder="ابحث في الكتاب…"></div>
</div>
<main id="main"></main>
<footer><a href="../">← العودة إلى باب الحديث</a></footer>
<script>
const DATA=[{"mq": "مدخل", "k": "أولاً: النية", "hs": [{"n": 1, "t": "عَنْ عُمَرَ بْنِ الخَطَّابِ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «إِنَّمَا الْأَعْمَالُ بِالنِّيَّةِ، وَإِنَّمَا لِامْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللهِ وَرَسُولِـهِ، فَهِجْرَتُهُ إِلَى اللهِ وَرَسُولِـهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا، أَوِ امْرَأَةٍ يَتَزَوَّجُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6689)، ومسلم (1907).\n", "hadith_no": 1}], "c": "أولاً: النية", "f": "", "p": ""}]}, {"mq": "مدخل", "k": "ثانيًا: فضل العلم وكيفية التعلُّم", "hs": [{"n": 2, "t": "عن أبي موسى الأشعريِّ رضي الله عنه، عن النبيِّ صلى الله عليه وسلم قال: «مَثَلُ ما بعَثَني اللهُ به من الهُدى والعِلم، كمَثَل الغَيث الكثيرِ أصاب أرضًا، فكان منها نَقِيَّةٌ، قبِلَت الماءَ، فأنبتَت الكلأَ والعُشبَ الكثير، وكانت منها أجادبُ، أمسكت الماءَ، فنفعَ اللهُ بها الناسَ، فشَرِبوا وسَقَوْا وزرعوا، وأصابت منها طائفةٌ أخرى، إنما هي قِيعانٌ لا تُمسِك ماءً ولا تُنبتُ كلأً، فذلك مثَلُ مَن فَقُه في دِين الله، ونفَعه ما بعَثَني الله به فعَلِم وعَلَّم، ومَثلُ مَن لم يرفَعْ بذلك رأسًا، ولم يَقبَلْ هُدى الله الذي أُرسِلْتُ به»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (79)، ومسلم (2282).\n", "hadith_no": 1}], "c": "ثانيًا: فضل العلم وكيفية التعلُّم", "f": "", "p": ""}, {"n": 3, "t": "عن أبي الدَّرْداءِ رضي الله عنه قال: سمعتُ رسولَ الله صلى الله عليه وسلم يقولُ: «مَن سلَكَ طريقًا يَلتمِسُ فيه عِلمًا، سهَّلَ اللهُ له طريقًا إلى الجنةِ، وإنَّ الملائكةَ لَتضَعُ أجنحتَها رضًا لطالب العلم، وإنَّ طالبَ العلم يَستغفِرُ له مَن في السماء والأرض، حتى الحيتانُ في الماء، وإنَّ فضلَ العالِم على العابد كفضل القمرِ على سائر الكواكب، إن العلماءَ ورَثةُ الأنبياء، إن الأنبياءَ لم يورِّثوا دينارًا ولا درهمًا؛ إنما ورَّثوا العلمَ، فمَن أخذه أخَذ بحظٍّ وافرٍ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه الترمذيُّ (2682)، وابن ماجه (223) واللفظ له، وصحَّحه الألبانيُّ في \"مشكاة المصابيح\" (1/ 71).\n", "hadith_no": 1}], "c": "ثانيًا: فضل العلم وكيفية التعلُّم", "f": "", "p": ""}, {"n": 4, "t": "عن زيدِ بنِ ثابتٍ رضي الله عنه، قال: سمعتُ رسولَ الله صلى الله عليه وسلم يقول: «نضَّر اللهُ امرأً سَمِعَ منَّا حديثًا، فحفِظَه حتى يُبلِّغَه؛ فرُبَّ حاملِ فِقهٍ إلى مَن هو أفقهُ منه، ورُبَّ حاملِ فِقهٍ ليس بفقيهٍ» {[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أبو داود (3660)، واللفظ له، والترمذيُّ (2656)، وقال الترمذيُّ: حديث حسن صحيح، وقال الألبانيُّ في \"صحيح الجامع\" (6763): صحيح.\n", "hadith_no": 1}], "c": "ثانيًا: فضل العلم وكيفية التعلُّم", "f": "", "p": ""}, {"n": 5, "t": "عن معاويةَ رضي الله عنه، قال: قال رسول الله صلى الله عليه وسلم: «مَن يُرِدِ اللهُ به خيرًا يُفَقِّهْهُ في الدِّينِ، وإنَّما أنا قاسمٌ، واللهُ يُعطِي، ولن تزالَ هذه الأُمَّة قائمةً على أمر الله، لا يَضرُّهم مَن خالَفَهم، حتى يأتيَ أمرُ الله»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (71)، ومسلم (1037).\n", "hadith_no": 1}], "c": "ثانيًا: فضل العلم وكيفية التعلُّم", "f": "", "p": ""}, {"n": 6, "t": "عن عمرِو بنِ العاصِ رضي الله عنه، أنه سَمِعَ رسولَ الله صلى الله عليه وسلم يقول: «إذا حكَم الحاكمُ فاجتهدَ، ثم أصاب، فله أجرانِ، وإذا حكم فاجتَهدَ، ثم أخطأ، فله أجرٌ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (7352)، ومسلم (1716).\n", "hadith_no": 1}], "c": "ثانيًا: فضل العلم وكيفية التعلُّم", "f": "", "p": ""}]}, {"mq": "الباب الأول: أبواب الإيمان", "k": "الوحدة الأولى: أصول الدين", "hs": [{"n": 7, "t": "عَن أَنَسٍ رضي الله عنه، عن النَّبيِّ صلى الله عليه وسلم قال: «ثَلاثٌ مَن كُنَّ فيه وجَدَ حَلاوةَ الإِيمانِ: أَنْ يكونَ اللهُ ورَسُولُه أحَبَّ إلَيهِ ممَّا سِواهُما، وأَنْ يُحِبَّ المَرْءَ لا يُحِبُّه إلا للهِ، وأَنْ يَكْرَهَ أنْ يَعودَ في الكُفْرِ كما يَكْرَهُ أنْ يُقْذَفَ في النَّارِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (16)، ومسلم (43).\n", "hadith_no": 1}], "c": "أولاً: شهادةُ ألا إلهَ إلا الله", "f": "", "p": ""}, {"n": 8, "t": "عَن مُعاذِ بنِ جبلٍ ‏‏رضي الله عنه قال: كنتُ رَدِيفَ النبيِّ صلى الله عليه وسلم على حمارٍ، فقال لي: «يا معاذُ، أتدري ما حقُّ اللهِ على العبادِ؟ وما حقُّ العبادِ على اللهِ؟» قلتُ: اللهُ ورسولُه أعلمُ، قال: «فإنَّ حقَّ الله على العبادِ أن يعبدوه ولا يُشركوا به شيئًا، وحقَّ العباد على الله أن لا يُعذِّب مَن لا يُشرك به شيئًا»، قلتُ: يا رسول الله، أفلا أُبشِّر الناس؟ قال: «لا تُبَشِّرْهم فيتَّكلوا»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2856)، ومسلم (30).\n", "hadith_no": 1}], "c": "أولاً: شهادةُ ألا إلهَ إلا الله", "f": "", "p": ""}, {"n": 9, "t": "عَنِ ابْنِ عَبَّاسٍ رضي الله عنهما قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم لِمُعَاذِ بْنِ جَبَلٍ حِينَ بَعَثَهُ إِلَى اليَمَنِ: «إِنَّكَ سَتَأْتِي قَوْمًا أَهْلَ كِتَابٍ، فَإِذَا جِئْتَهُمْ، فَادْعُهُمْ إِلَى أَنْ يَشْهَدُوا أَنْ لا إِلَهَ إِلَّا اللَّهُ، وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، فَإِنْ هُمْ أَطَاعُوا لَكَ بِذَلِكَ، فَأَخْبِرْهُمْ أَنَّ اللَّهَ قَدْ فَرَضَ عَلَيْهِمْ خَمْسَ صَلَوَاتٍ فِي كُلِّ يَوْمٍ وَلَيْلَةٍ، فَإِنْ هُمْ أَطَاعُوا لَكَ بِذَلِكَ، فَأَخْبِرْهُمْ أَنَّ اللَّهَ قَدْ فَرَضَ عَلَيْهِمْ صَدَقَةً تُؤْخَذُ مِنْ أَغْنِيَائِهِمْ فَتُرَدُّ عَلَى فُقَرَائِهِمْ، فَإِنْ هُمْ أَطَاعُوا لَكَ بِذَلِكَ، فَإِيَّاكَ وَكَرَائِمَ أَمْوَالِهِمْ، وَاتَّقِ دَعْوَةَ المَظْلُومِ؛ فَإِنَّهُ لَيْسَ بَيْنَهُ وَبَيْنَ اللَّهِ حِجَابٌ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (1496)، ومسلم (19).\n", "hadith_no": 1}], "c": "أولاً: شهادةُ ألا إلهَ إلا الله", "f": "", "p": ""}, {"n": 10, "t": "عن ابن عبَّاس رضي الله عنهما قال: (بُعِثَ رسولُ الله صلى الله عليه وسلم لأربعين سنةً، فمكثَ بمكةَ ثلاثَ عشْرةَ سنةً يُوحَى إليه، ثم أُمِر بالهجرةِ فهاجر عشْرَ سنين، ومات وهو ابنُ ثلاثٍ وستينَ سنةً){[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3851) واللفظ له، ومسلم (2351).\n", "hadith_no": 1}], "c": "ثانيًا: شهادةُ أنَّ محمدًا صلى الله عليه وسلم رسولُ الله", "f": "", "p": ""}, {"n": 11, "t": "عن أبي هريرة أن رَسُول اللهِ صلى الله عليه وسلم قال: «وَالَّذِي نَفْسُ مُحَمَّدٍ بِيَدِهِ، لا يَسْمَعُ بِي أَحَدٌ مِنْ هذِهِ الأُمَّةِ يَهُودِيٌّ وَلا نَصْرَانِيٌّ، ثُمَّ يَمُوتُ وَلَمْ يُؤْمِنْ بِالَّذِي أُرْسِلْتُ بِهِ، إِلَّا كَانَ مِنْ أَصْحَابِ النَّارِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلمٌ (250).\n", "hadith_no": 1}], "c": "ثانيًا: شهادةُ أنَّ محمدًا صلى الله عليه وسلم رسولُ الله", "f": "", "p": ""}, {"n": 12, "t": "عَنْ عَائِشَةَ أُمِّ المُؤْمِنِينَ أَنَّهَا قَالَتْ: \"أَوَّلُ مَا بُدِئَ بِهِ رَسُولُ اللَّهِ صلى الله عليه وسلم مِنَ الوَحْيِ الرُّؤْيَا الصَّالِحَةُ فِي النَّوْمِ، فَكَانَ لا يَرَى رُؤْيَا إِلَّا جَاءَتْ مِثْلَ فَلَقِ الصُّبْحِ، ثُمَّ حُبِّبَ إِلَيْهِ الخَلاءُ، وَكَانَ يَخْلُو بِغَارِ حِرَاءٍ فَيَتَحَنَّثُ فِيهِ - وَهُوَ التَّعَبُّدُ - اللَّيَالِيَ ذَوَاتِ العَدَدِ قَبْلَ أَنْ يَنْزِعَ إِلَى أَهْلِهِ، وَيَتَزَوَّدُ لِذَلِكَ، ثُمَّ يَرْجِعُ إِلَى خَدِيجَةَ فَيَتَزَوَّدُ لِمِثْلِهَا، حَتَّى جَاءَهُ الحَقُّ وَهُوَ فِي غَارِ حِرَاءٍ، فَجَاءَهُ المَلَكُ فَقَالَ: اقْرَأْ، قَالَ: «مَا أَنَا بِقَارِئٍ»، قَالَ: «فَأَخَذَنِي فَغَطَّنِي حَتَّى بَلَغَ مِنِّي الجَهْدَ ثُمَّ أَرْسَلَنِي، فَقَالَ: اقْرَأْ، قُلْتُ: مَا أَنَا بِقَارِئٍ، فَأَخَذَنِي فَغَطَّنِي الثَّانِيَةَ حَتَّى بَلَغَ مِنِّي الجَهْدَ ثُمَّ أَرْسَلَنِي، فَقَالَ: اقْرَأْ، فَقُلْتُ: مَا أَنَا بِقَارِئٍ، فَأَخَذَنِي فَغَطَّنِي الثَّالِثَةَ ثُمَّ أَرْسَلَنِي، فَقَالَ: {اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَق * خَلَقَ الإِنسَانَ مِنْ عَلَق * اقْرَأْ وَرَبُّكَ الأَكْرَم} [العلق: ١ – ٣]»، فَرَجَعَ بِهَا رَسُولُ اللَّهِ صلى الله عليه وسلم يَرْجُفُ فُؤَادُهُ، فَدَخَلَ عَلَى خَدِيجَةَ بِنْتِ خُوَيْلِدٍ رَضِيَ اللَّهُ عَنْهَا، فَقَالَ: «زَمِّلُونِي زَمِّلُونِي» فَزَمَّلُوهُ حَتَّى ذَهَبَ عَنْهُ الرَّوْعُ، فَقَالَ لِخَدِيجَةَ وَأَخْبَرَهَا الخَبَرَ: «لَقَدْ خَشِيتُ عَلَى نَفْسِي» فَقَالَتْ خَدِيجَةُ: كَلَّا وَاللَّهِ مَا يُخْزِيكَ اللَّهُ أَبَدًا، إِنَّكَ لَتَصِلُ الرَّحِمَ، وَتَحْمِلُ الكَلَّ، وَتَكْسِبُ المَعْدُومَ، وَتَقْرِي الضَّيْفَ، وَتُعِينُ عَلَى نَوَائِبِ الحَقِّ، فَانْطَلَقَتْ بِهِ خَدِيجَةُ حَتَّى أَتَتْ بِهِ وَرَقَةَ بْنَ نَوْفَلِ بْنِ أَسَدِ بْنِ عَبْدِ العُزَّى، ابْنَ عَمِّ خَدِيجَةَ، وَكَانَ امْرءًا تَنَصَّرَ فِي الجَاهِلِيَّةِ، وَكَانَ يَكْتُبُ الكِتَابَ العِبْرَانِيَّ، فَيَكْتُبُ مِنَ الإِنْجِيلِ بِالعِبْرَانِيَّةِ مَا شَاءَ اللَّهُ أَنْ يَكْتُبَ، وَكَانَ شَيْخًا كَبِيرًا قَدْ عَمِيَ، فَقَالَتْ لَهُ خَدِيجَةُ: يَا بْنَ عَمِّ، اسْمَعْ مِنَ ابْنِ أَخِيكَ، فَقَالَ لَهُ وَرَقَةُ: يَا بْنَ أَخِي، مَاذَا تَرَى؟ فَأَخْبَرَهُ رَسُولُ اللَّهِ صلى الله عليه وسلم خَبَرَ مَا رَأَى، فَقَالَ لَهُ وَرَقَةُ: هَذَا النَّامُوسُ الَّذِي نَزَّلَ اللَّهُ عَلَى مُوسَى، يَا لَيْتَنِي فِيهَا جَذَعًا، لَيْتَنِي أَكُونُ حَيًّا إِذْ يُخْرِجُكَ قَوْمُكَ، فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «أَوَ مُخْرِجِيَّ هُمْ؟»، قَالَ: نَعَمْ، لَمْ يَأْتِ رَجُلٌ قَطُّ بِمِثْلِ مَا جِئْتَ بِهِ إِلَّا عُودِيَ، وَإِنْ يُدْرِكْنِي يَوْمُكَ أَنْصُرْكَ نَصْرًا مُؤَزَّرًا. ثُمَّ لَمْ يَنْشَبْ وَرَقَةُ أَنْ تُوُفِّيَ، وَفَتَرَ الوَحْيُ\"{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3)، ومسلم (160).\n", "hadith_no": 1}], "c": "ثانيًا: شهادةُ أنَّ محمدًا صلى الله عليه وسلم رسولُ الله", "f": "", "p": ""}, {"n": 13, "t": "عن الْبَرَاءِ بن عازب – رضي الله عنه - قال: \"كَانَ رَسُولُ اللهِ صلى الله عليه وسلم رَجُلًا مَرْبُوعًا، بَعِيدَ مَا بَيْنَ الْمَنْكِبَيْنِ، عَظِيمَ الْجُمَّةِ إِلَى شَحْمَةِ أُذُنَيْهِ، عَلَيْهِ حُلَّةٌ حَمْرَاءُ، مَا رَأَيْتُ شَيْئًا قَطُّ أَحْسَنَ مِنْهُ صلى الله عليه وسلم\"{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3551)، ومسلم (2337)، واللفظ لمسلم.\n", "hadith_no": 1}], "c": "ثانيًا: شهادةُ أنَّ محمدًا صلى الله عليه وسلم رسولُ الله", "f": "", "p": ""}, {"n": 14, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «كُلُّ أُمَّتِي يَدْخُلُونَ الجَنَّةَ إِلَّا مَنْ أَبَى»، قَالُوا: يَا رَسُولَ اللَّهِ، وَمَنْ يَأْبَى؟ قَالَ: «مَنْ أَطَاعَنِي دَخَلَ الجَنَّةَ، وَمَنْ عَصَانِي فَقَدْ أَبَى»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (7280).\n", "hadith_no": 1}], "c": "ثانيًا: شهادةُ أنَّ محمدًا صلى الله عليه وسلم رسولُ الله", "f": "", "p": ""}, {"n": 15, "t": "عن أَنَسِ بْن مَالِكٍ رضي الله عنه، قَالَ: بَيْنَمَا أَنَا وَالنَّبِيُّ صلى الله عليه وسلم خَارِجَانِ مِنَ المَسْجِدِ، فَلَقِيَنَا رَجُلٌ عِنْدَ سُدَّةِ المَسْجِدِ، فَقَالَ: يَا رَسُولَ اللَّهِ، مَتَى السَّاعَةُ؟ قَالَ النَّبِيُّ صلى الله عليه وسلم: «مَا أَعْدَدْتَ لَهَا؟»، فَكَأَنَّ الرَّجُلَ اسْتَكَانَ، ثُمَّ قَالَ: يَا رَسُولَ اللَّهِ، مَا أَعْدَدْتُ لَهَا كَبِيرَ صِيَامٍ، وَلا صَلاةٍ، وَلا صَدَقَةٍ؛ وَلَكِنِّي أُحِبُّ اللَّهَ وَرَسُولَهُ، قَالَ: «أَنْتَ مَعَ مَنْ أَحْبَبْتَ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (7153)، ومسلم (2639).\n", "hadith_no": 1}], "c": "ثانيًا: شهادةُ أنَّ محمدًا صلى الله عليه وسلم رسولُ الله", "f": "", "p": ""}, {"n": 16, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «الإِيمَانُ بِضْعٌ وَسَبْعُونَ - أَوْ: بِضْعٌ وَسِتُّونَ - شُعْبَةً، فَأَفْضَلُهَا قَوْلُ: لَا إِلَهَ إِلَّا اللهُ، وَأَدْنَاهَا إِمَاطَةُ الأَذَى عَنِ الطَّرِيقِ، وَالحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (9)، ومسلم (35).\n", "hadith_no": 1}], "c": "ثالثًا: معنى الدين وفضلُه ومراتبه", "f": "", "p": ""}, {"n": 17, "t": "عَنْ تَمِيمٍ الدَّارِيِّ أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ: «الدِّينُ النَّصِيحَةُ»، قُلْنَا: لِمَنْ؟ قَالَ: «لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ الْمُسْلِمِينَ، وَعَامَّتِهِمْ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (55).\n", "hadith_no": 1}], "c": "ثالثًا: معنى الدين وفضلُه ومراتبه", "f": "", "p": ""}, {"n": 18, "t": "عَنِ الْعَبَّاسِ بْنِ عَبْدِ الْمُطَّلِبِ، أَنَّهُ سَمِعَ رَسُولَ اللهِ صلى الله عليه وسلم يَقُولُ: «ذَاقَ طَعْمَ الْإِيمَانِ مَنْ رَضِيَ بِاللهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ رَسُولًا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (34).\n", "hadith_no": 1}], "c": "ثالثًا: معنى الدين وفضلُه ومراتبه", "f": "", "p": ""}, {"n": 19, "t": "عن عُمَرَ بْنِ الْخَطَّابِ – رضي الله عنه - قَالَ: بَيْنَمَا نَحْنُ عِنْدَ رَسُولِ اللهِ صلى الله عليه وسلم ذَاتَ يَوْمٍ، إِذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ، شَدِيدُ سَوَادِ الشَّعَرِ، لَا يُرَى عَلَيْهِ أَثَرُ السَّفَرِ، وَلَا يَعْرِفُهُ مِنَّا أَحَدٌ، حَتَّى جَلَسَ إِلَى النَّبِيِّ صلى الله عليه وسلم، فَأَسْنَدَ رُكْبَتَيْهِ إِلَى رُكْبَتَيْهِ، وَوَضَعَ كَفَّيْهِ عَلَى فَخِذَيْهِ، وَقَالَ: يَا مُحَمَّدُ، أَخْبِرْنِي عَنِ الْإِسْلَامِ، فَقَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «الْإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَهَ إِلَّا اللهُ، وَأَنَّ مُحَمَّدًا رَسُولُ اللهِ صلى الله عليه وسلم، وَتُقِيمَ الصَّلَاةَ، وَتُؤْتِيَ الزَّكَاةَ، وَتَصُومَ رَمَضَانَ، وَتَحُجَّ الْبَيْتَ إِنِ اسْتَطَعْتَ إِلَيْهِ سَبِيلًا»، قَالَ: صَدَقْتَ، قَالَ: فَعَجِبْنَا لَهُ يَسْأَلُهُ، وَيُصَدِّقُهُ، قَالَ: فَأَخْبِرْنِي عَنِ الْإِيمَانِ، قَالَ: «أَنْ تُؤْمِنَ بِاللهِ، وَمَلَائِكَتِهِ، وَكُتُبِهِ، وَرُسُلِهِ، وَالْيَوْمِ الْآخِرِ، وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ»، قَالَ: صَدَقْتَ، قَالَ: فَأَخْبِرْنِي عَنِ الْإِحْسَانِ، قَالَ: «أَنْ تَعْبُدَ اللهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ»، قَالَ: فَأَخْبِرْنِي عَنِ السَّاعَةِ، قَالَ: «مَا الْمَسْؤولُ عَنْهَا بِأَعْلَمَ مِنَ السَّائِلِ» قَالَ: فَأَخْبِرْنِي عَنْ أَمَارَتِهَا، قَالَ: «أَنْ تَلِدَ الْأَمَةُ رَبَّتَهَا، وَأَنْ تَرَى الْحُفَاةَ الْعُرَاةَ الْعَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي الْبُنْيَانِ»، قَالَ: ثُمَّ انْطَلَقَ فَلَبِثْتُ مَلِيًّا، ثُمَّ قَالَ لِي: «يَا عُمَرُ أَتَدْرِي مَنِ السَّائِلُ؟» قُلْتُ: اللهُ وَرَسُولُهُ أَعْلَمُ، قَالَ: «فَإِنَّهُ جِبْرِيلُ أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (8).\n", "hadith_no": 1}], "c": "ثالثًا: معنى الدين وفضلُه ومراتبه", "f": "", "p": ""}]}, {"mq": "الباب الأول: أبواب الإيمان", "k": "الوَحْدةُ الثانيةُ: أرْكانُ الإيمانِ", "hs": [{"n": 20, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه: أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «إِنَّ لِلَّهِ تِسْعَةً وَتِسْعِينَ اسْمًا؛ مِائَةً إِلَّا وَاحِدًا، مَنْ أَحْصَاهَا دَخَلَ الجَنَّةَ»، وَزَادَ هَمَّامٌ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم: «إِنَّهُ وِتْرٌ يُحِبُّ الْوِتْرَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2736)، ومسلم (2677).\n", "hadith_no": 1}], "c": "أوَّلًا: الإيمان بالله تعالى", "f": "", "p": ""}, {"n": 21, "t": "عن أبي هُرَيْرَةَ رضي الله عنه قَالَ: سَمِعْتُ رَسُولَ اللهِ صلى الله عليه وسلم يَقُولُ: «جَعَلَ اللهُ الرَّحمةَ في مِائَةِ جُزْءٍ، فَأَمْسَكَ عِنْدَهُ تِسْعَةً وَتِسْعِينَ جُزْءًا، وَأَنْزَلَ فِي الأرْضِ جُزْءًا وَاحِدًا، فَمِنْ ذَلِكَ الجُزْءِ يَتَرَاحَمُ الخَلْقُ، حَتَّى تَرْفَعَ الفَرَسُ حَافِرَهَا عَنْ وَلَدِهَا؛ خَشْيَةَ أَنْ تُصِيبَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6000)، ومسلم (2752).\n", "hadith_no": 1}], "c": "أوَّلًا: الإيمان بالله تعالى", "f": "", "p": ""}, {"n": 22, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّـهِ صلى الله عليه وسلم: «لَـمَّا قَضَى اللهُ الخَلْقَ كَتَبَ فِي كِتَابِهِ، فَهُوَ عِنْدَهُ فَوْقَ العَرْشِ: إِنَّ رَحْمَتِي غَلَبَتْ غَضَبِي»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3194)، ومسلم (2751).\n", "hadith_no": 1}], "c": "أوَّلًا: الإيمان بالله تعالى", "f": "", "p": ""}, {"n": 23, "t": "عَنْ أَبِي مُوسَى الْأَشْعَرِيّ رضي الله عنه، قَالَ: قَامَ فِينَا رَسُولُ اللهِ صلى الله عليه وسلم بِخَمْسِ كَلِمَاتٍ، فَقَالَ: «إِنَّ اللهَ - عزَّ وجلَّ - لَا يَنَامُ، وَلَا يَنْبَغِي لَهُ أَنْ يَنَامَ، يَخْفِضُ الْقِسْطَ وَيَرْفَعُهُ، يُرْفَعُ إِلَيْهِ عَمَلُ اللَّيْلِ قَبْلَ عَمَلِ النَّهَارِ، وَعَمَلُ النَّهَارِ قَبْلَ عَمَلِ اللَّيْلِ، حِجَابُهُ النُّورُ - وَفِي رِوَايَةٍ: النَّارُ - لَوْ كَشَفَهُ، لَأَحْرَقَتْ سُبُحَاتُ وَجْهِهِ مَا انْتَهَى إِلَيْهِ بَصَرُهُ مِنْ خَلْقِهِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (179).\n", "hadith_no": 1}], "c": "أوَّلًا: الإيمان بالله تعالى", "f": "", "p": ""}, {"n": 24, "t": "عَنْ عِمْرَانَ بْنِ حُصَيْنٍ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: دَخَلْتُ عَلَى النَّبِيِّ صلى الله عليه وسلم، وَعَقَلْتُ نَاقَتِي بِالْبَابِ، فَأَتَاهُ نَاسٌ مِنْ بَنِي تَمِيمٍ فَقَالَ: «اقْبَلُوا البُشْرَى يَا بَنِي تَمِيمٍ»، قَالُوا: قَدْ بَشَّرْتَنَا فَأَعْطِنَا، مَرَّتَيْنِ، ثُمَّ دَخَلَ عَلَيْهِ نَاسٌ مِنْ أَهْلِ اليَمَنِ، فَقَالَ: «اقْبَلُوا البُشْرَى يَا أَهْلَ اليَمَنِ، إِذْ لَمْ يَقْبَلْهَا بَنُو تَمِيمٍ»، قَالُوا: قَدْ قَبِلْنَا يَا رَسُولَ اللَّهِ، قَالُوا: جِئْنَاكَ نَسْأَلُكَ عَنْ هَذَا الأَمْرِ؟ قَالَ: «كَانَ اللَّهُ وَلَمْ يَكُنْ شَيْءٌ غَيْرُهُ، وَكَانَ عَرْشُهُ عَلَى المَاءِ، وَكَتَبَ فِي الذِّكْرِ كُلَّ شَيْءٍ، وَخَلَقَ السَّمَوَاتِ وَالأَرْضَ» فَنَادَى مُنَادٍ: ذَهَبَتْ نَاقَتُكَ يَا بْنَ الحُصَيْنِ، فَانْطَلَقْتُ، فَإِذَا هِيَ يَقْطَعُ دُونَهَا السَّرَابُ، فَوَاللَّهِ لَوَدِدْتُ أَنِّي كُنْتُ تَرَكْتُهَا{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3191).\n", "hadith_no": 1}], "c": "أوَّلًا: الإيمان بالله تعالى", "f": "", "p": ""}, {"n": 25, "t": "عَنْ عَائِشَةَ رضي الله عنها قَالَتْ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «خُلِقَتِ الْمَلَائِكَةُ مِنْ نُورٍ، وَخُلِقَ الْجَانُّ مِنْ مَارِجٍ مِنْ نَارٍ، وَخُلِقَ آدَمُ مِمَّا وُصِفَ لَكُمْ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2996).\n", "hadith_no": 1}], "c": "ثانيًا: الإيمانُ بالملائكةِ", "f": "", "p": ""}, {"n": 26, "t": "عَنْ أَبِي سَعِيدِ بْنِ الْمُعَلَّى رضي الله عنه، قَالَ: كُنْتُ أُصَلِّي فِي الْمَسْجِدِ، فَدَعَانِي رَسُولُ اللَّهِ صلى الله عليه وسلم فَلَمْ أُجِبْهُ، فَقُلْتُ: يَا رَسُولَ اللَّهِ، إِنِّي كُنْتُ أُصَلِّي، فَقَالَ: «أَلَمْ يَقُلِ اللَّهُ: ﴿اسْتَجِيبُوا لِلَّهِ وَلِلرَّسُولِ إِذَا دَعَاكُمْ لِمَا يُحْيِيكُمْ﴾ [الأنفال: 24] ». ثُمَّ قَالَ لِي: «لَأُعَلِّمَنَّكَ سُورَةً هِيَ أَعْظَمُ السُّوَرِ فِي القُرْآنِ، قَبْلَ أَنْ تَخْرُجَ مِنَ المَسْجِدِ». ثُمَّ أَخَذَ بِيَدِي، فَلَمَّا أَرَادَ أَنْ يَخْرُجَ، قُلْتُ لَهُ: «أَلَمْ تَقُلْ: لَأُعَلِّمَنَّكَ سُورَةً هِيَ أَعْظَمُ سُورَةٍ فِي القُرْآنِ؟»، قَالَ: «﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾ [الفاتحة: 2]، هِيَ السَّبْعُ الْمَثَانِي، وَالقُرْآنُ العَظِيمُ الَّذِي أُوتِيتُهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (4474).\n", "hadith_no": 1}], "c": "ثالثًا: الإيمانُ بالكتب", "f": "", "p": ""}, {"n": 27, "t": "عَنْ عثمانَ بنِ عفَّانَ رضي الله عنه، عن النبيِّ صلى الله عليه وسلم قال: «خَيْرُكُمْ مَنْ تَعَلَّمَ القُرْآنَ وَعَلَّمَهُ»{[1]}. وفي رواية: «إِنَّ أَفْضَلَكُمْ مَنْ تَعَلَّمَ القُرْآنَ وَعَلَّمَهُ»{[2]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (5027).\n", "hadith_no": 1}, {"footnotes": " رواه البخاريُّ (5028).\n", "hadith_no": 2}], "c": "ثالثًا: الإيمانُ بالكتب", "f": "", "p": ""}, {"n": 28, "t": "عَنْ أُبَيِّ بْنِ كَعْبٍ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «يَا أَبَا الْمُنْذِرِ، أَتَدْرِي أَيُّ آيَةٍ مِنْ كِتَابِ اللهِ مَعَكَ أَعْظَمُ؟» قَالَ: قُلْتُ: اللهُ وَرَسُولُهُ أَعْلَمُ. قَالَ: «يَا أَبَا الْمُنْذِرِ، أَتَدْرِي أَيُّ آيَةٍ مِنْ كِتَابِ اللهِ مَعَكَ أَعْظَمُ؟» قَالَ: قُلْتُ: {اللَّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ}. قَالَ: فَضَرَبَ فِي صَدْرِي، وَقَالَ: «وَاللهِ لِيَهْنِكَ الْعِلْمُ أَبَا الْمُنْذِرِ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (810).\n", "hadith_no": 1}], "c": "ثالثًا: الإيمانُ بالكتب", "f": "", "p": ""}, {"n": 29, "t": "عَنْ أَبِي سَعِيدٍ الخُدْرِيِّ رَضِيَ اللهُ عَنْهُ، قَالَ: قَالَ النَّبِيُّ صلى الله عليه وسلم لِأَصْحَابِهِ: «أَيَعْجِزُ أَحَدُكُمْ أَنْ يَقْرَأَ ثُلُثَ القُرْآنِ فِي لَيْلَةٍ؟» فَشَقَّ ذَلِكَ عَلَيْهِمْ وَقَالُوا: أَيُّنَا يُطِيقُ ذَلِكَ يَا رَسُولَ اللهِ؟ فَقَالَ: «اللهُ الوَاحِدُ الصَّمَدُ ثُلُثُ القُرْآنِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (5015).\n", "hadith_no": 1}], "c": "ثالثًا: الإيمانُ بالكتب", "f": "", "p": ""}, {"n": 30, "t": "عَنْ عُقبةَ بنِ عَامرٍ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «أَلَمْ تَرَ آيَاتٍ أُنْزِلَتِ اللَّيْلَةَ لَمْ يُرَ مِثْلُهُنَّ قَطُّ، ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾، و﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (814).\n", "hadith_no": 1}], "c": "ثالثًا: الإيمانُ بالكتب", "f": "", "p": ""}, {"n": 31, "t": "عَنْ عَامِرِ بْنِ وَاثِلَةَ، أَنَّ نَافِعَ بْنَ عَبْدِ الْحَارِثِ، لَقِيَ عُمَرَ رضي الله عنه بِعُسْفَانَ، وَكَانَ عُمَرُ يَسْتَعْمِلُهُ عَلَى مَكَّةَ، فَقَالَ: مَنِ اسْتَعْمَلْتَ عَلَى أَهْلِ الْوَادِي؟ فَقَالَ: ابْنَ أَبْزَى، فقال: وَمَنِ ابْنُ أَبْزَى؟ فقال: مَوْلًى مِنْ مَوَالِينَا. قَالَ: فَاسْتَخْلَفْتَ عَلَيْهِمْ مَوْلًى؟ قَالَ: إِنَّهُ قَارِئٌ لِكِتَابِ اللهِ عزَّ وجلَّ، وَإِنَّهُ عَالِمٌ بِالْفَرَائِضِ، قَالَ عُمَرُ: أَمَا إِنَّ نَبِيَّكُمْ صلى الله عليه وسلم قَدْ قَالَ: «إِنَّ اللهَ يَرْفَعُ بِهَذَا الْكِتَابِ أَقْوَامًا، وَيَضَعُ بِهِ آخَرِينَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (817).\n", "hadith_no": 1}], "c": "ثالثًا: الإيمانُ بالكتب", "f": "", "p": ""}, {"n": 32, "t": "عن أبي هُرَيرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «أنا أَوْلى الناس بعِيسى بنِ مَريمَ في الدنيا والآخرةِ، والأنبياءُ إِخْوَةٌ لِعَلَّاتٍ؛ أمهاتُهم شتَّى، ودِينُهم واحدٌ»، وزاد في رواية مسلم: «ليس بَيْني وبينَه نَبِيٌّ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3443)، ومسلم (2365).\n", "hadith_no": 1}], "c": "رابعًا: الإيمانُ بالرسُل", "f": "", "p": ""}, {"n": 33, "t": "عَنْ أَنَسِ بْن مَالِكٍ رضي الله عنه، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ: «العَبْدُ إِذَا وُضِعَ فِي قَبْرِهِ، وَتُوُلِّيَ وَذَهَبَ أَصْحَابُهُ حَتَّى إِنَّهُ لَيَسْمَعُ قَرْعَ نِعَالِهِمْ، أَتَاهُ مَلَكَانِ، فَأَقْعَدَاهُ، فَيَقُولانِ لَهُ: مَا كُنْتَ تَقُولُ فِي هَذَا الرَّجُلِ مُحَمَّدٍ صلى الله عليه وسلم؟ فَيَقُولُ: أَشْهَدُ أَنَّهُ عَبْدُ اللَّهِ وَرَسُولُهُ، فَيُقَالُ: انْظُرْ إِلَى مَقْعَدِكَ مِنَ النَّارِ أَبْدَلَكَ اللَّهُ بِهِ مَقْعَدًا مِنَ الجَنَّةِ، قَالَ النَّبِيُّ صلى الله عليه وسلم: فَيَرَاهُمَا جَمِيعًا، وَأَمَّا الكَافِرُ - أَوِ المُنَافِقُ - فَيَقُولُ: لا أَدْرِي، كُنْتُ أَقُولُ مَا يَقُولُ النَّاسُ، فَيُقَالُ: لا دَرَيْتَ وَلا تَلَيْتَ، ثُمَّ يُضْرَبُ بِمِطْرَقَةٍ مِنْ حَدِيدٍ ضَرْبَةً بَيْنَ أُذُنَيْهِ، فَيَصِيحُ صَيْحَةً يَسْمَعُهَا مَنْ يَلِيهِ إِلَّا الثَّقَلَيْنِ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (1338)، ومسلم (2870).\n", "hadith_no": 1}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 34, "t": "عَنْ أَبِي هُرَيْرَةَ - رضي الله عنه - أَنَّ رَسُولَ اللهِ صلى الله عليه وسلم قَالَ: «لَا تَقُومُ السَّاعَةُ حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا، فَإِذَا طَلَعَتْ مِنْ مَغْرِبِهَا، آمَنَ النَّاسُ كُلُّهُمْ أَجْمَعُونَ، فَيَوْمَئِذٍ {لاَ يَنفَعُ نَفْسًا إِيمَانُهَا لَمْ تَكُنْ آمَنَتْ مِن قَبْلُ أَوْ كَسَبَتْ فِي إِيمَانِهَا خَيْرًا} [الأنعام: 158]»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (4635)، ومسلم (157).\n", "hadith_no": 1}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 35, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: قَالَ النَّبِيُّ صلى الله عليه وسلم: «لا تَقُومُ السَّاعَةُ حَتَّى يُقْبَضَ العِلْمُ، وَتَكْثُرَ الزَّلازِلُ، وَيَتَقَارَبَ الزَّمَانُ، وَتَظْهَرَ الفِتَنُ، وَيَكْثُرَ الهَرْجُ - وَهُوَ القَتْلُ القَتْلُ - حَتَّى يَكْثُرَ فِيكُمُ المَالُ فَيَفِيضَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": "رواه البخاريُّ (1036)، ومسلم (157).\n", "hadith_no": 1}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 36, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «ثَلَاثٌ إِذَا خَرَجْنَ لَا يَنْفَعُ نَفْسًا إِيمَانُهَا لَمْ تَكُنْ آمَنَتْ مِنْ قَبْلُ، أَوْ كَسَبَتْ فِي إِيمَانِهَا خَيْرًا: طُلُوعُ الشَّمْسِ مِنْ مَغْرِبِهَا، وَالدَّجَّالُ، وَدَابَّةُ الْأَرْضِ»{[1]}.<br/>وعَنْ أَبِي هُرَيْرَةَ رضي الله عنه، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «بَادِرُوا بِالْأَعْمَالِ سِتًّا: الدَّجَّالَ، وَالدُّخَانَ، وَدَابَّةَ الْأَرْضِ، وَطُلُوعَ الشَّمْسِ مِنْ مَغْرِبِهَا، وَأَمْرَ الْعَامَّةِ، وَخُوَيْصَةَ أَحَدِكُمْ»</b>{[2]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (158).\n", "hadith_no": 1}, {"footnotes": " رواه مسلم (2947).\n", "hadith_no": 2}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 37, "t": "عَنْ أَنَسٍ رضي الله عنه، قَالَ: قَالَ النَّبِيُّ صلى الله عليه وسلم: «مَا بُعِثَ نَبِيٌّ إِلَّا أَنْذَرَ أُمَّتَهُ الأعْوَرَ الكَذَّابَ، أَلا إِنَّهُ أَعْوَرُ، وَإِنَّ رَبَّكُمْ لَيْسَ بِأَعْوَرَ، وَإِنَّ بَيْنَ عَيْنَيْهِ مَكْتُوبٌ \"كَافِرٌ\"»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (7131)، ومسلم (2933).\n", "hadith_no": 1}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 38, "t": "عَنْ عَدِيِّ بْنِ حَاتِمٍ رضي الله عنه، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَا مِنْكُمْ أَحَدٌ إِلَّا سَيُكَلِّمُهُ رَبُّهُ لَيْسَ بَيْنَهُ وَبَيْنَهُ تُرْجُمَانٌ، فَيَنْظُرُ أَيْمَنَ مِنْهُ فَلا يَرَى إِلَّا مَا قَدَّمَ مِنْ عَمَلِهِ، وَيَنْظُرُ أَشْأَمَ مِنْهُ فَلا يَرَى إِلَّا مَا قَدَّمَ، وَيَنْظُرُ بَيْنَ يَدَيْهِ فَلا يَرَى إِلَّا النَّارَ تِلْقَاءَ وَجْهِهِ، فَاتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ، فَمَنْ لَمْ يَجِدْ، فَبِكَلِمَةٍ طَيِّبَةٍ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (7512)، ومسلم (1016).\n", "hadith_no": 1}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 39, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، أَنَّ النَّبِيَّ صلى الله عليه وسلم، قَالَ: «نَارُكُمْ هَذِهِ الَّتِي يُوقِدُ ابْنُ آدَمَ جُزْءٌ مِنْ سَبْعِينَ جُزْءًا، مِنْ حَرِّ جَهَنَّمَ» قَالُوا: وَاللهِ إِنْ كَانَتْ لَكَافِيَةً، يَا رَسُولَ اللهِ قَالَ: «فَإِنَّهَا فُضِّلَتْ عَلَيْهَا بِتِسْعَةٍ وَسِتِّينَ جُزْءًا، كُلُّهَا مِثْلُ حَرِّهَا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3265)، ومسلم (2843).\n", "hadith_no": 1}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 40, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: قَالَ اللَّهُ: «أَعْدَدْتُ لِعِبَادِي الصَّالِحِينَ مَا لا عَيْنٌ رَأَتْ، وَلا أُذُنٌ سَمِعَتْ، وَلا خَطَرَ عَلَى قَلْبِ بَشَرٍ، فَاقْرَؤوا إِنْ شِئْتُم: ﴿فَلَا تَعْلَمُ نَفْسٌ مَا أُخْفِيَ لَهُمْ مِنْ قُرَّةِ أَعْيُنٍ جَزَاءً بِمَا كَانُوا يَعْمَلُونَ﴾ [السجدة: 17]»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3244)، ومسلم (2824).\n", "hadith_no": 1}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 41, "t": "عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «حُفَّتِ الْجَنَّةُ بِالْمَكَارِهِ، وَحُفَّتِ النَّارُ بِالشَّهَوَاتِ»{[1]}. وفي رواية: عَنْ أَبِي هُرَيْرَةَ: أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «حُجِبَتِ النَّارُ بِالشَّهَوَاتِ، وَحُجِبَتِ الجَنَّةُ بِالْمَكَارِهِ»{[2]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2822). \n", "hadith_no": 1}, {"footnotes": " رواه البخاريُّ (6487)، ومسلم (2822). \n", "hadith_no": 2}], "c": "خامسًا: الإيمانُ باليومِ الآخِرِ", "f": "", "p": ""}, {"n": 42, "t": "عن ابن عبَّاسٍ رضي الله عنهما قال: كنتُ خَلْفَ رسولِ الله صلى الله عليه وسلم يومًا، فقال: «يا غلامُ، إنِّي أُعلِّمُكَ كلماتٍ، احْفَظِ اللهَ يَحْفَظْكَ، احفَظِ اللهَ تَجِدْه تُجاهَكَ، إذا سألْتَ فاسأَلِ اللهَ، وإذا استَعَنْتَ فاستَعِنْ باللهِ، واعلَمْ أنَّ الأُمَّةَ لوِ اجتَمَعَتْ على أنْ يَنفَعوكَ بشيءٍ، لم يَنفَعوكَ إلَّا بشيءٍ قد كتَبَه اللهُ لكَ، ولوِ اجْتَمَعوا على أنْ يَضُرُّوكَ بشيءٍ، لم يَضُرُّوكَ إلَّا بشيءٍ قد كتَبَه اللهُ عليكَ، رُفِعَتِ الأقلامُ وجَفَّتِ الصُّحُفُ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه الترمذيُّ (2516)، وقال: حديث حسن صحيح، وصحَّحه عبد الحقِّ في \"الأحكام الوسطى\" (4/ 285)، والألبانيُّ في \"صحيح الجامع الصغير وزيادته\" (2/ 1317).\n", "hadith_no": 1}], "c": "سادسًا: الإيمانُ بالقَدَر", "f": "", "p": ""}, {"n": 43, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ. احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللهِ وَلَا تَعْجِزْ، وَإِنْ أَصَابَكَ شَيْءٌ، فَلَا تَقُلْ: لَوْ أَنِّي فَعَلْتُ كَانَ كَذَا وَكَذَا، وَلَكِنْ قُلْ: قَدَرُ اللهِ وَمَا شَاءَ فَعَلَ؛ فَإِنَّ (لَوْ) تَفْتَحُ عَمَلَ الشَّيْطَانِ» {[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2664).\n", "hadith_no": 1}], "c": "سادسًا: الإيمانُ بالقَدَر", "f": "", "p": ""}, {"n": 44, "t": "عن عبدِ الله بنِ مسعودٍ رضي الله عنه قال: حدَّثنا رسولُ الله صلى الله عليه وسلم - وهو الصادقُ المصدوقُ -: « إِنَّ أَحَدَكُمْ يُجْمَعُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْمًا، ثُمَّ يَكُونُ عَلَقَةً مِثْلَ ذَلِكَ، ثُمَّ يَكُونُ مُضْغَةً مِثْلَ ذَلِكَ، ثُمَّ يَبْعَثُ اللهُ إِلَيْهِ مَلَكًا بِأَرْبَعِ كَلِمَاتٍ، فَيُكْتَبُ عَمَلُهُ، وَأَجَلُهُ، وَرِزْقُهُ، وَشَقِيٌّ أَمْ سَعِيدٌ، ثُمَّ يُنْفَخُ فِيهِ الرُّوحُ، فَإِنَّ الرَّجُلَ لَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ، حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إِلَّا ذِرَاعٌ، فَيَسْبِقُ عَلَيْهِ الكِتَابُ، فَيَعْمَلُ بِعَمَلِ أَهْلِ الجَنَّةِ، فَيَدْخُلُ الجَنَّةَ، وَإِنَّ الرَّجُلَ لَيَعْمَلُ بِعَمَلِ أَهْلِ الجَنَّةِ، حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إلَّا ذِرَاعٌ، فَيَسْبِقُ عَلَيْهِ الكِتَابُ، فَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ، فَيَدْخُلُ النَّارَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3332)، ومسلم (2643).\n", "hadith_no": 1}], "c": "سادسًا: الإيمانُ بالقَدَر", "f": "", "p": ""}, {"n": 45, "t": "عَنْ أَبِي هُرَيْرَةَ، قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «انْظُرُوا إِلَى مَنْ أَسْفَلَ مِنْكُمْ، وَلَا تَنْظُرُوا إِلَى مَنْ هُوَ فَوْقَكُمْ؛ فَهُوَ أَجْدَرُ أَنْ لَا تَزْدَرُوا نِعْمَةَ اللهِ - قَالَ أَبُو مُعَاوِيَةَ: - عَلَيْكُمْ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2963).\n", "hadith_no": 1}], "c": "سادسًا: الإيمانُ بالقَدَر", "f": "", "p": ""}, {"n": 46, "t": "عَنْ أَنَسِ بْنِ مَالِكٍ - رَضِيَ اللَّهُ عَنْهُ - عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «لا عَدْوَى وَلا طِيَرَةَ، وَيُعْجِبُنِي الفَأْلُ» قَالُوا: وَمَا الفَأْلُ؟ قَالَ: «كَلِمَةٌ طَيِّبَةٌ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (5776) ومسلم (2224).\n", "hadith_no": 1}], "c": "سادسًا: الإيمانُ بالقَدَر", "f": "", "p": ""}]}, {"mq": "الباب الأول: أبواب الإيمان", "k": "الوَحْدة الثالثة: من مسائل الإيمان", "hs": [{"n": 47, "t": "عَنْ أَبِي هُرَيْرَةَ أَنَّ رَسُولَ اللهِ صلى الله عليه وسلم قَالَ: «بَادِرُوا بِالْأَعْمَالِ فِتَنًا كَقِطَعِ اللَّيْلِ الْمُظْلِمِ، يُصْبِحُ الرَّجُلُ مُؤْمِنًا وَيُمْسِي كَافِرًا، أَوْ يُمْسِي مُؤْمِنًا وَيُصْبِحُ كَافِرًا، يَبِيعُ دِينَهُ بِعَرَضٍ مِنَ الدُّنْيَا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (118).\n", "hadith_no": 1}], "c": "أوَّلًا: الشرك والنفاق ونواقِض الإسلام", "f": "", "p": ""}, {"n": 48, "t": "عَنْ مَحْمُودِ بْنِ لَبِيدٍ ‏رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ ‏ صلى الله عليه وسلم: «إنَّ أخْوَفَ ما أخافُ عليكم الشِّركُ الأصْغَرُ»، قالوا: وما الشِّركُ الأصْغَرُ يا رسولَ اللهِ؟ قال: «الرِّياءُ؛ يقولُ اللهُ - عزَّ وجلَّ - لهم يومَ القِيامةِ إذا جُزِيَ الناسُ بأعمالِهم: اذْهَبوا إلى الذين كنتُم تُراؤون في الدُّنيا، فانظُروا هل تَجِدون عِندَهُم جزاءً؟!»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أحمدُ في \"مسنده\" (23630)، والبيهقيُّ في \"شعب الإيمان\" (6412)، وصحَّحه الهيثميُّ في \"مجمع الزوائد ومنبع الفوائد\" (1/ 102)، والألبانيُّ في \"سلسلة الأحاديث الصحيحة وشيء من فقهها وفوائدها\" (2/ 634).\n", "hadith_no": 1}], "c": "أوَّلًا: الشرك والنفاق ونواقِض الإسلام", "f": "", "p": ""}, {"n": 49, "t": "عن عبدِ الله بنِ عمرٍو رضي الله عنه عن النبيِّ صلى الله عليه وسلم، قال: «أَرْبَعٌ مَنْ كُنَّ فِيهِ كَانَ مُنَافِقًا خَالِصًا، وَمَنْ كَانَتْ فِيهِ خَصْلَةٌ مِنْهُنَّ كَانَتْ فِيهِ خَصْلَةٌ مِنَ النِّفَاقِ حَتَّى يَدَعَهَا: إِذَا اؤْتُمِنَ خَانَ، وَإِذَا حَدَّثَ كَذَبَ، وَإِذَا عَاهَدَ غَدَرَ، وَإِذَا خَاصَمَ فَجَرَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (34)، ومسلم (58).\n", "hadith_no": 1}], "c": "أوَّلًا: الشرك والنفاق ونواقِض الإسلام", "f": "", "p": ""}, {"n": 50, "t": "عَنْ أَبِي ذَرٍّ رضي الله عنه، عَن النَّبِيِّ صلى الله عليه وسلم، فِيمَا رَوَى عَن اللهِ تَبَارَكَ وَتَعَالَى أَنَّهُ قَالَ: «يَا عِبَادِي، إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي، وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا؛ فَلا تَظَالَمُوا. يَا عِبَادِي، كُلُّكُمْ ضَالٌّ إِلَّا مَنْ هَدَيْتُهُ؛ فَاسْتَهْدُونِي أَهْدِكُمْ. يَا عِبَادِي، كُلُّكُمْ جَائِعٌ إِلَّا مَنْ أَطْعَمْتُهُ؛ فَاسْتَطْعِمُونِي أُطْعِمْكُمْ. يَا عِبَادِي، كُلُّكُمْ عَارٍ إِلَّا مَنْ كَسَوْتُهُ؛ فَاسْتَكْسُونِي أَكْسُكُمْ. يَا عِبَادِي، إِنَّكُمْ تُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ، وَأَنَا أَغْفِرُ الذُّنُوبَ جَمِيعًا؛ فَاسْتَغْفِرُونِي أَغْفِرْ لَكُمْ. يَا عِبَادِي، إِنَّكُمْ لَنْ تَبْلُغُوا ضَرِّي فَتَضُرُّونِي، وَلَنْ تَبْلُغُوا نَفْعِي فَتَنْفَعُونِي. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ، وَإِنْسَكُمْ وَجِنَّكُمْ، كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا زَادَ ذَلِكَ فِي مُلْكِي شَيْئًا. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ، وَإِنْسَكُمْ وَجِنَّكُمْ، كَانُوا عَلَى أَفْجَرِ قَلْبِ رَجُلٍ وَاحِدٍ، مَا نَقَصَ ذَلِكَ مِنْ مُلْكِي شَيْئًا. يَا عِبَادِي، لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ، وَإِنْسَكُمْ وَجِنَّكُمْ، قَامُوا فِي صَعِيدٍ وَاحِدٍ فَسَأَلُونِي، فَأَعْطَيْتُ كُلَّ إِنْسَانٍ مَسْأَلَتَهُ، مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِي إِلَّا كَمَا يَنْقُصُ المِخْيَطُ إِذَا أُدْخِلَ البَحْرَ. يَا عِبَادِي، إِنَّمَا هِيَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ، ثُمَّ أُوَفِّيكُمْ إِيَّاهَا، فَمَنْ وَجَدَ خَيْرًا فَلْيَحْمَدِ اللهَ، وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلا يَلُومَنَّ إِلَّا نَفْسَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2577).\n", "hadith_no": 1}], "c": "ثانيًا: تعظيمُ اللهِ تعالى وشعائره", "f": "", "p": ""}, {"n": 51, "t": "عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: قال اللهُ - عزَّ وجلَّ -: «الكِبْرياءُ رِدائي، والعَظَمةُ إزاري، فمَن نازَعَني واحدًا منهما، قَذَفْتُه في النارِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أبو داود (4090)، وابن ماجه (4174)، وأصله في مسلم (2620).\n", "hadith_no": 1}], "c": "ثانيًا: تعظيمُ اللهِ تعالى وشعائره", "f": "", "p": ""}, {"n": 52, "t": "عن أبي سعيدٍ الخُدريِّ رضي الله عنه، أن النبيَّ صلى الله عليه وسلم قال: «لتَتَّبِعُنَّ سَنَنَ مَن قَبْلَكم شِبرًا بشِبرٍ، وذراعًا بذراعٍ، حتى لو سَلَكوا جُحْرَ ضَبٍّ لَسَلكْتموه»، قلنا: يا رسول الله، اليهود والنصارى؟ قال: «فمن؟!»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3456)، ومسلم (2669).\n", "hadith_no": 1}], "c": "ثالثًا: الوَلاءُ والبَراءُ", "f": "", "p": ""}, {"n": 53, "t": "عنْ أبي هُرَيْرَةَ - رضي الله عنه - قال: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى أَجْسَادِكُمْ وَلَا إِلَى صُوَرِكُمْ؛ وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ» وَأَشَارَ بِأَصَابِعِهِ إِلَى صَدْرِهِ {[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (4779).\n", "hadith_no": 1}], "c": "رابعًا: أعمالُ القلوبِ", "f": "", "p": ""}, {"n": 54, "t": "عن النُّعْمانِ بنِ بَشيرٍ – رضي الله عنهما - قال: سمعتُ رسولَ اللهِ صلى الله عليه وسلم يقول - وأَهْوى النُّعمانُ بإصْبَعَيْهِ إلى أُذُنَيْهِ -: «إنَّ الحَلالَ بَيِّنٌ، وإنَّ الحَرامَ بَيِّنٌ، وبَيْنَهُما مُشْتَبِهاتٌ لا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقى الشُّبُهاتِ اسْتَبْرَأَ لِدِينِهِ وعِرْضِهِ، ومَن وقَعَ في الشُّبُهاتِ وقَعَ في الحَرامِ، كالرَّاعِي يَرْعى حَوْلَ الحِمى، يُوشِكُ أنْ يَرْتَعَ فِيهِ، ألا وإنَّ لِكُلِّ مَلِكٍ حِمًى، ألا وإنَّ حِمى اللهِ مَحارِمُهُ، ألا وإنَّ في الجَسَدِ مُضْغَةً، إذا صَلَحَتْ، صَلَحَ الجَسَدُ كُلُّهُ، وإذا فَسَدَتْ، فَسَدَ الجَسَدُ كُلُّهُ، ألا وهي القَلْبُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2051)، ومسلم (1599) واللفظ له.\n", "hadith_no": 1}], "c": "رابعًا: أعمالُ القلوبِ", "f": "", "p": ""}, {"n": 55, "t": "عن عبد الله بنِ عمرَ رضي الله عنهما قال: أخَذَ رَسولُ اللهِ صلى الله عليه وسلم بمَنْكِبِي، فَقالَ: «كُنْ في الدُّنْيا كَأنَّكَ غَرِيبٌ أوْ عابِرُ سَبِيلٍ»، وكانَ ابنُ عُمَرَ، يقولُ: «إذا أمْسَيْتَ فلا تَنْتَظِرِ الصَّباحَ، وإذا أصْبَحْتَ فلا تَنْتَظِرِ المَساءَ، وخُذْ مِن صِحَّتِكَ لِمَرَضِكَ، ومِنْ حَياتِكَ لِمَوْتِكَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6416).\n", "hadith_no": 1}], "c": "رابعًا: أعمالُ القلوبِ", "f": "", "p": ""}, {"n": 56, "t": "عنْ عمرَ رضي الله عنه، عنْ النّبيِّ صلى الله عليه وسلم قال: «لو أنَّكُمْ تَوَكَّلُونَ على اللّهِ حقَّ توكُّلِه، لرُزِقْتُمْ كما تُرْزق الطَّيْرُ، تَغْدو خِماصًا، وتَرُوحُ بِطانًا\"{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أحمد (205)، والنسائيُّ (11805)، والترمذيُّ (2344)، وقال: هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ، وصحَّحه الألبانيُّ في \"الصحيحة\" (310).\n", "hadith_no": 1}], "c": "رابعًا: أعمالُ القلوبِ", "f": "", "p": ""}, {"n": 57, "t": "عن عبد الله بنِ عمرَ رضي الله عنهما أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «مَفَاتِحُ الغَيْبِ خَمْسٌ لا يَعْلَمُهَا إِلَّا اللَّهُ: لا يَعْلَمُ مَا فِي غَدٍ إِلَّا اللَّهُ، وَلاَ يَعْلَمُ مَا تَغِيضُ الأَرْحَامُ إِلَّا اللَّهُ، وَلاَ يَعْلَمُ مَتَى يَأْتِي المَطَرُ أَحَدٌ إِلَّا اللَّهُ، وَلا تَدْرِي نَفْسٌ بِأَيِّ أَرْضٍ تَمُوتُ، وَلا يَعْلَمُ مَتَى تَقُومُ السَّاعَةُ إِلَّا اللَّهُ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (4697).\n", "hadith_no": 1}], "c": "خامسًا: الإيمان بالغَيب", "f": "", "p": ""}, {"n": 58, "t": "عَنْ أَبِي هُرَيْرَةَ - رضي الله عنه - عَنْ النَّبِيِّ صلى الله عليه وسلم قَالَ: «مَنْ أَتَى كَاهِنًا، أَوْ عَرَّافًا، فَصَدَّقَهُ بِمَا يَقُولُ، فَقَدْ كَفَرَ بِمَا أُنْزِلَ عَلَى مُحَمَّدٍ صلى الله عليه وسلم»{[1]}.</b><br/> ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أبو داود (٣٩٠٤)، والترمذيُّ (١٣٥)، والنسائيُّ (٩٠١٧)، وابن ماجه (٦٣٩) بنحوه مطوَّلًا، وأحمدُ (٩٥٣٦) واللفظ له، وصحَّحه الألبانيُّ في \"صحيح الترغيب والترهيب\" (3047).\n", "hadith_no": 1}], "c": "خامسًا: الإيمان بالغَيب", "f": "", "p": ""}, {"n": 59, "t": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «إِنَّ الدِّينَ يُسْرٌ، وَلَنْ يُشَادَّ الدِّينَ أَحَدٌ إِلَّا غَلَبَهُ، فَسَدِّدُوا وَقَارِبُوا، وَأَبْشِرُوا، وَاسْتَعِينُوا بِالْغَدْوَةِ وَالرَّوْحَةِ وَشَيْءٍ مِنَ الدُّلْجَةِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (39).\n", "hadith_no": 1}], "c": "سادسًا: الغُلوُّ والبِدعةُ", "f": "", "p": ""}, {"n": 60, "t": "عن عائشةَ رضيَ اللهُ عنها قالت: قالَ رسولُ اللهِ صلى الله عليه وسلم: «مَن أحدَثَ في أمْرِنا هذا ما ليس فيه، فهو رَدٌّ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2697)، ومسلم (1718).\n", "hadith_no": 1}], "c": "سادسًا: الغُلوُّ والبِدعةُ", "f": "", "p": ""}]}, {"mq": "الباب الثاني: العبادات", "k": "الوَحْدة الأُولى: الطهارة والصلاة", "hs": [{"n": 61, "t": "عَنْ طَلْحَةَ بْنِ عُبَيْدِ اللهِ رضي الله عنه قَالَ: جَاءَ رَجُلٌ إِلَى رَسُولِ اللهِ صلى الله عليه وسلم مِنْ أَهْلِ نَجْدٍ، ثَائِرُ الرَّأْسِ، يُسْمَعُ دَوِيُّ صَوْتِهِ، وَلاَ يُفْقَهُ مَا يَقُولُ، حتَّى دَنَا، فَإِذَا هُوَ يَسْأَلُ عَنِ الإِسْلامِ، فَقَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «خَمْسُ صَلَوَاتٍ فِي اليوْمِ وَاللَّيْلَةِ»، فَقَالَ: هَلْ عَليَّ غَيْرُهَا؟ قَالَ: «لَا، إِلَّا أَنْ تَطَّوَّعَ»، قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «وَصِيَامُ رَمَضَانَ»، قَالَ: هَلْ عَليَّ غَيْرُهُ؟ قَالَ: «لَا، إِلَّا أَنْ تَطَّوَّعَ»، قَالَ: وَذَكَرَ لَهُ رَسُولُ اللهِ صلى الله عليه وسلم الزَّكَاةَ، قَالَ: هَلْ عَليَّ غَيْرُهَا؟ قَالَ: «لَا، إِلَّا أَنْ تَطَّوَّعَ»، قَالَ: فَأَدْبَرَ الرَّجُلُ وَهُوَ يَقُولُ: وَاللهِ، لَا أَزِيدُ عَلَى هَذَا وَلاَ أَنْقُصُ، قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «أَفْلَحَ إِنْ صَدَقَ». وفي رواية: «دَخَلَ الجَنَّةَ إِنْ صَدَقَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (46)، ومسلم (11).\n", "hadith_no": 1}], "c": "أوَّلًا: خِصال الفِطرة وآدابُ الخَلاء", "f": "", "p": ""}, {"n": 62, "t": "عَنْ عَائِشَةَ، قَالَتْ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «عَشْرٌ مِنَ الْفِطْرَةِ: قَصُّ الشَّارِبِ، وَإِعْفَاءُ اللِّحْيَةِ، وَالسِّوَاكُ، وَاسْتِنْشَاقُ الْمَاءِ، وَقَصُّ الْأَظْفَارِ، وَغَسْلُ الْبَرَاجِمِ، وَنَتْفُ الْإِبِطِ، وَحَلْقُ الْعَانَةِ، وَانْتِقَاصُ الْمَاءِ». قَالَ مُصْعَبٌ: وَنَسِيتُ الْعَاشِرَةَ إِلَّا أَنْ تَكُونَ الْمَضْمَضَةَ. زَادَ قُتَيْبَةُ: قَالَ وَكِيعٌ: \"انْتِقَاصُ الْمَاءِ؛ يَعْنِي: الِاسْتِنْجَاءَ\"{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (261).\n", "hadith_no": 1}], "c": "أوَّلًا: خِصال الفِطرة وآدابُ الخَلاء", "f": "", "p": ""}, {"n": 63, "t": "عن أبي هُرَيْرَةَ، قال: سَأَلَ رَجُلٌ رَسُولَ اللهِ صلى الله عليه وسلم، فَقَالَ: يَا رَسُولَ اللهِ، إِنَّا نَرْكَبُ البَحْرَ، وَنَحْمِلُ مَعَنَا القَلِيلَ مِنَ الْمَاءِ، فَإِنْ تَوَضَّأْنَا بِهِ عَطِشْنَا، أَفَنَتَوَضَّأُ مِنَ الْبَحْرِ؟ فَقَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «هُوَ الطَّهُورُ مَاؤُهُ، الحِلُّ مَيْتَتُهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أحمد (8720)، والنسائيُّ (59)، وأبو داود (83)، وابن ماجه (386)، والترمذيُّ (69)، وقال الترمذيُّ: هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ، وصحَّحه الألبانيُّ في \"صحيح أبي داود\" (76).\n", "hadith_no": 1}], "c": "ثانيًا: الوضوءُ والاغتسالُ", "f": "", "p": ""}, {"n": 64, "t": "عن عمَّارِ بنِ ياسرٍ رضي الله عنهما قال: بَعَثَنِي رَسُولُ اللهِ صلى الله عليه وسلم فِي حَاجَةٍ فَأَجْنَبْتُ، فَلَمْ أَجِدِ الْمَاءَ، فَتَمَرَّغْتُ فِي الصَّعِيدِ كَمَا تَمَرَّغُ الدَّابَّةُ ثُمَّ أَتَيْتُ النَّبِيَّ صلى الله عليه وسلم، فَذَكَرْتُ ذَلِكَ لَهُ فَقَالَ: «إِنَّمَا كَانَ يَكْفِيكَ أَنْ تَقُولَ بِيَدَيْكَ هَكَذَا» ثُمَّ ضَرَبَ بِيَدَيْهِ الْأَرْضَ ضَرْبَةً وَاحِدَةً، ثُمَّ مَسَحَ الشِّمَالَ عَلَى الْيَمِينِ، وَظَاهِرَ كَفَّيْهِ، وَوَجْهَهُ{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (347) ومسلم (368)، واللفظ لمسلم.\n", "hadith_no": 1}], "c": "ثانيًا: الوضوءُ والاغتسالُ", "f": "", "p": ""}, {"n": 65, "t": "عن جَابِر بن عبد الله قال: سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ: «بَيْنَ الرَّجُلِ وَبَيْنَ الشِّرْكِ وَالْكُفْرِ تَرْكُ الصَّلَاةِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (82).\n", "hadith_no": 1}], "c": "ثالثًا: منزلة الصلاة", "f": "", "p": ""}, {"n": 66, "t": "عن أبي سُليمانَ مالكِ بنِ الحُوَيْرثِ رضي الله عنه، قال: أَتَينا النبيَّ صلى الله عليه وسلم ونحن شَبَبةٌ مُتقارِبون، فأقمنا عنده عشرين ليلةً، فظنَّ أنَّا اشتقنا أهْلَنا، وسألَنا عمَّن ترَكْنا في أهلنا، فأخبرناه، وكان رفيقًا رحيمًا، فقال: «ارجعوا إلى أهليكم، فعلِّموهم ومُروهم، وصلُّوا كما رأيتموني أُصلِّي، وإذا حضَرتِ الصلاةُ، فليؤذِّنْ لكم أحدُكم، ثم لِيَؤُمَّكم أكبَرُكم»{[1]}، وليس عند مسلم: «وصلُّوا كما رأيتموني أصلِّي».", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6008)، ومسلم (674).\n", "hadith_no": 1}], "c": "رابعًا: كيفيَّةُ الصلاة", "f": "", "p": ""}, {"n": 67, "t": "عن أبي هُريرة رضي الله عنه: أن رسول الله صلى الله عليه وسلم دخل المسجد فدخل رجلٌ، فصلَّى، فسلَّم على النبيِّ صلى الله عليه وسلم، فردَّ وقال: «ارجِعْ فصَلِّ؛ فإنَّكَ لم تُصَلِّ»، فرجَعَ يُصَلِّي كما صَلَّى، ثم جاء، فسلَّمَ على النبيِّ صلى الله عليه وسلم، فقال: «ارجِعْ فصَلِّ؛ فإنَّكَ لم تُصَلِّ» ثلاثًا، فقال: والذي بعَثَكَ بالحقِّ ما أُحسِنُ غَيرَه، فعَلِّمْني، فقال: «إذا قُمْتَ إلى الصلاةِ فكَبِّرْ، ثم اقرَأْ ما تَيسَّرَ معَكَ منَ القرآنِ، ثم اركَعْ حتى تَطمئِنَّ راكعًا، ثم ارفَعْ حتى تَعدِل قائمًا، ثم اسجُدْ حتى تَطمئِنَّ ساجِدًا، ثم ارفَعْ حتى تَطمئِنَّ جالسًا، وافعَلْ ذلك في صلاتِكَ كلِّها»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (757)، ومسلم (397).\n", "hadith_no": 1}], "c": "رابعًا: كيفيَّةُ الصلاة", "f": "", "p": ""}, {"n": 68, "t": "عن أبي هريرة رضي الله عنه، عن النبيِّ صلى الله عليه وسلم قال: «مَن صلَّى صلاةً لم يَقرَأْ فيها بأُمِّ القُرآنِ فهي خِدَاجٌ – ثلاثًا - غيرُ تَمامٍ»، فقيلَ لأبي هُرَيْرةَ: إنَّا نكونُ وراءَ الإمامِ؟ فقال: اقرَأْ بها في نَفْسِكَ؛ فإنِّي سَمِعْتُ رسولَ اللهِ صلى الله عليه وسلم يقولُ: «قال اللهُ تعالى: قَسَمْتُ الصلاةَ بَيْني وبينَ عَبْدي نِصفَيْنِ، ولعَبْدي ما سألَ، فإذا قال العبدُ: {الْحَمْدُ للَّهِ رَبِّ الْعَالَمِين}، قال الله تعالى: حَمِدني عبدي، وإذا قال: {الرَّحْمـنِ الرَّحِيم}، قال الله تعالى: أثنى عليَّ عبدي، وإذا قال: {مَـالِكِ يَوْمِ الدِّين}، قال: مجَّدني عبدي، فإذا قال: {إِيَّاكَ نَعْبُدُ وإِيَّاكَ نَسْتَعِين}، قال: هذا بيني وبين عبدي، ولعبدي ما سأل، فإذا قال: ﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ * صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ﴾، قال: هذا لعبدي، ولعبدي ما سأل»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (395).\n", "hadith_no": 1}], "c": "رابعًا: كيفيَّةُ الصلاة", "f": "", "p": ""}, {"n": 69, "t": "عن ابنِ عمرَ رضي الله عنهما، أن رسول الله صلى الله عليه وسلم قال: «صلاةُ الجماعةِ أفضَلُ من صلاةِ الفَذِّ بسَبعٍ وعشرينَ دَرجةً»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (645)، ومسلم (650).\n", "hadith_no": 1}], "c": "خامسًا: الجُمُعة والجماعات", "f": "", "p": ""}, {"n": 70, "t": "عن ابن عمرَ وأبي هُريرةَ رضي الله عنهما، أنهما سَمعا رسولَ الله صلى الله عليه وسلم يقولُ على أعوادِ مِنْبَرِه: «لَيَنْتَهِيَنَّ أقْوامٌ عن وَدْعِهمُ الجُمُعاتِ، أو لَيَخْتِمَنَّ اللهُ على قُلوبِهم، ثم لَيَكونُنَّ منَ الغافِلينَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (865).\n", "hadith_no": 1}], "c": "خامسًا: الجُمُعة والجماعات", "f": "", "p": ""}, {"n": 71, "t": "عن أبي هريرة رضي الله عنه: أن رسول الله صلى الله عليه وسلم قال: «أَحَبُّ الْبِلَادِ إِلَى اللهِ مَسَاجِدُهَا، وَأَبْغَضُ الْبِلَادِ إِلَى اللهِ أَسْوَاقُهَا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (671). \n", "hadith_no": 1}], "c": "خامسًا: الجُمُعة والجماعات", "f": "", "p": ""}, {"n": 72, "t": "عن أنس رضي الله عنه قال: قَدِمَ رسولُ الله صلى الله عليه وسلم المدينةَ ولهم يومانِ يَلعبون فيهما، فقال: «ما هذانِ اليومانِ؟!» قالوا: كنا نلعَب فيهما في الجاهلية، فقال رسول الله صلى الله عليه وسلم: «إن الله قد أبدلَكم بهما خيرًا منهما؛ يومَ الأضحى، ويومَ الفِطر»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أبو داود (1134)، والنسائيُّ (1556)، وصحَّحه النوويُّ في \"خلاصة الأحكام\" (2/ 819)، والألبانيُّ في \"سلسلة الأحاديث الصحيحة وشيء من فقهها وفوائدها\" (5/ 34).\n", "hadith_no": 1}], "c": "خامسًا: الجُمُعة والجماعات", "f": "", "p": ""}]}, {"mq": "الباب الثاني: العبادات", "k": "الوحدة الثانية: الزكاة", "hs": [{"n": 73, "t": "عن أبي هُريرةَ رضي الله عنه، قال: قال رسولُ الله صلى الله عليه وسلم: «أيُّها الناسُ، إن اللهَ طيِّبٌ لا يَقبَل إلا طَيِّبًا، وإن اللهَ أمَر المؤمنين بما أمر به المرسَلين، فقال: {يَاأَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا إِنِّي بِمَا تَعْمَلُونَ عَلِيم} [المؤمنون: 51]، وقال: {يَاأَيُّهَا الَّذِينَ آمَنُواْ كُلُواْ مِن طَيِّبَاتِ مَا رَزَقْنَاكُمْ} [البقرة: 172]، ثم ذكَر الرجُل يُطِيل السَّفَرَ أَشْعَثَ أَغْبَرَ، يَمُدُّ يَدَيْهِ إلى السماء: يا ربِّ، يا ربِّ، ومطعمُه حرامٌ، ومشرَبُه حرامٌ، ومَلبسُه حرامٌ، وغُذِيَ بالحرام، فأنَّى يُستجاب لذلك؟!»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (1015).\n", "hadith_no": 1}], "c": "الوحدة الثانية: الزكاة", "f": "", "p": ""}, {"n": 74, "t": "عن عبدِ الله بنِ مُعاويةَ رضي الله عنه، قال: قال النبيُّ صلى الله عليه وسلم: «ثلاثٌ مَن فعَلهنَّ فقد طَعِمَ طَعْمَ الإيمانِ: مَن عبَدَ اللهَ وحدَه، وأنه لا إلهَ إلا اللهُ، وأعطى زكاةَ ماله طيِّبةً بها نفْسُهُ، رافدةً عليه كلَّ عام، ولا يُعطي الهَرِمةَ، ولا الدَّرِنةَ، ولا المريضةَ، ولا الشَّرَطَ اللئيمةَ؛ ولكن مِن وسَطِ أموالكم؛ فإنَّ اللهَ لم يَسألْكم خيرَه، ولم يأمُرْكم بشرِّه»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه أبو داود (1582)، وصحَّحه الألبانيُّ في \"سلسلة الأحاديث الصحيحة وشيء من فقهها وفوائدها\" (3/ 38).\n", "hadith_no": 1}], "c": "الوحدة الثانية: الزكاة", "f": "", "p": ""}, {"n": 75, "t": "عَنِ ابْنِ عُمَرَ - رضي اللَّه عنهمَا - قَالَ: «فَرَضَ رَسُولُ اللَّهِ صلى الله عليه وسلم زَكَاةَ الفِطْرِ صَاعًا مِنْ تَمْرٍ، أَوْ صَاعًا مِنْ شَعِيرٍ عَلَى العَبْدِ وَالحُرِّ، وَالذَّكَرِ وَالأُنْثَى، وَالصَّغِيرِ وَالكَبِيرِ مِنَ الْمُسْلِمِينَ، وَأَمَرَ بِهَا أَنْ تُؤَدَّى قَبْلَ خُرُوجِ النَّاسِ إِلَى الصَّلاَةِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (1507)، ومسلم (984).\n", "hadith_no": 1}], "c": "الوحدة الثانية: الزكاة", "f": "", "p": ""}]}, {"mq": "الباب الثاني: العبادات", "k": "الوَحدة الثالثة: الصَّوم", "hs": [{"n": 76, "t": "عن أبي هُرَيرة رضي الله عنه، أن رسول الله صلى الله عليه وسلم قال: «قال اللهُ عزَّ وجلَّ: كلُّ عمَلِ ابن آدمَ له، إلَّا الصيامَ؛ فإنه لي، وأنا أَجْزِي به، والصِّيامُ جُنَّةٌ، وإذا كان يومُ صومِ أحدكم، فلا يَرْفُثْ، ولا يَصْخَبْ، فإن سابَّهُ أحدٌ أو قاتَلَهُ، فليقُلْ: إني امرؤٌ صائمٌ، والذي نفْسُ محمدٍ بيده، لَخُلُوفُ فمِ الصائم أطيبُ عند الله مِن ريحِ المسك، للصائم فرحتانِ يَفرَحُهما: إذا أفطَرَ فَرِحَ، وإذا لَقِيَ ربَّهُ فَرِحَ بصومِه»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (1904)، ومسلم (1151).\n", "hadith_no": 1}], "c": "الوَحدة الثالثة: الصَّوم", "f": "", "p": ""}, {"n": 77, "t": "عن أبي هُرَيرةَ رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «مَن صام رَمَضَانَ إيمانًا واحتسابًا، غُفِرَ له ما تَقَدَّم من ذَنْبه، ومَن قام ليلةَ القَدر إيمانًا واحتسابًا، غُفِر له ما تقدَّم من ذَنْبه»{[1]}.<br/>وعن أبي هُريرةَ رضي الله عنه أيضًا، أن النبيَّ صلى الله عليه وسلم قال: «مَن قام رمضانَ إيمانًا واحتسابًا، غُفِرَ له ما تقدَّم من ذَنْبه» {[2]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (1901)، ومسلم (760).\n", "hadith_no": 1}, {"footnotes": " رواه البخاريُّ (37)، ومسلم (759).\n", "hadith_no": 2}], "c": "الوَحدة الثالثة: الصَّوم", "f": "", "p": ""}, {"n": 78, "t": "عن أبي هريرة رضي الله عنه، قال: قال رسولُ الله صلى الله عليه وسلم: «مَن لم يَدَعْ قولَ الزُّورِ والعَمَلَ به والجهلَ، فليس لله حاجةٌ في أن يَدَع طعامَه وشَرَابَه»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6057).\n", "hadith_no": 1}], "c": "الوَحدة الثالثة: الصَّوم", "f": "", "p": ""}]}, {"mq": "الباب الثاني: العبادات", "k": "الوَحْدة الرابعة: الحجُّ", "hs": [{"n": 79, "t": "عن أبي هريرة رضي الله عنه قال: قال النبيُّ صلى الله عليه وسلم: «مَن حَجَّ هذا البيتَ فلم يَرفُثْ، ولم يفسُقْ، رجَعَ كيومَ ولَدَتْهُ أمُّهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (1820)، ومسلم (1350).\n", "hadith_no": 1}], "c": "الوَحْدة الرابعة: الحجُّ", "f": "", "p": ""}, {"n": 80, "t": "عن أبي هُرَيرة رضي الله عنه، قال: خطَبَنا رسولُ الله صلى الله عليه وسلم، فقال: «أيُّها الناسُ، قد فرَضَ اللهُ عليكم الحجَّ؛ فحُجُّوا»، فقال رجُلٌ: أكلَّ عامٍ يا رسولَ الله؟ فسكَتَ حتى قالها ثلاثًا، فقال رسول الله صلى الله عليه وسلم: «لو قلتُ: نَعمْ، لوجَبتْ، ولَمَا استطعتم». ثم قال: «ذَروني ما تركتُكم؛ فإنما هلَك مَن كان قبلَكم بكثرة سؤالهم، واختلافهم على أنبيائهم، فإذا أمرتُكم بشيء، فأْتوا منه ما استطعتم، وإذا نَهيتكم عن شيء فدَعوه»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (1337).\n", "hadith_no": 1}], "c": "الوَحْدة الرابعة: الحجُّ", "f": "", "p": ""}, {"n": 81, "t": "عن جابر رضي الله عنه قال: رأيتُ النبيَّ صلى الله عليه وسلم يَرْمي على راحلتِهِ يومَ النَّحْرِ، ويقول: «لِتأخُذوا مناسكَكم؛ فإني لا أدْري لعلِّي لا أحُجُّ بعد حَجَّتي هذه» {[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (1297).\n", "hadith_no": 1}], "c": "الوَحْدة الرابعة: الحجُّ", "f": "", "p": ""}]}, {"mq": "الباب الثالث: باب المعامَلات", "k": "الوَحْدة الأولى: المعامَلات في الإسلام", "hs": [{"n": 82, "t": "عَنْ أَبِي بَرْزَةَ الأَسْلَمِيِّ رضي الله عنه، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «لَا تَزُولُ قَدَمَا عَبْدٍ يَوْمَ القِيَامَةِ حَتَّى يُسْأَلَ عَنْ عُمُرِهِ: فِيمَا أَفْنَاهُ؟ وَعَنْ عِلْمِهِ: فِيمَ فَعَلَ؟ وَعَنْ مَالِه: مِنْ أَيْنَ اكْتَسَبَهُ؟ وَفِيمَ أَنْفَقَهُ؟ وَعَنْ جِسْمِهِ: فِيمَ أَبْلَاهُ؟»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه الترمذيُّ (2417)، وقال: حديث حسن صحيح، وصححه الألبانيُّ في \"صحيح الترغيب والترهيب\" (126).\n", "hadith_no": 1}], "c": "الوَحْدة الأولى: المعامَلات في الإسلام", "f": "", "p": ""}, {"n": 83, "t": "عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ رضي الله عنه، أَنَّهُ: سَمِعَ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ عَامَ الفَتْحِ وَهُوَ بِمَكَّةَ: «إِنَّ اللَّهَ وَرَسُولَهُ حَرَّمَ بَيْعَ الخَمْرِ، وَالْمَيْتَةِ، وَالخِنْزِيرِ، وَالأَصْنَامِ»، فَقِيلَ: يَا رَسُولَ اللَّهِ، أَرَأَيْتَ شُحُومَ الْمَيْتَةِ، فَإِنَّهَا يُطْلَى بِهَا السُّفُنُ، وَيُدْهَنُ بِهَا الجُلُودُ، وَيَسْتَصْبِحُ بِهَا النَّاسُ؟ فَقَالَ: «لاَ، هُوَ حَرَامٌ»، ثُمَّ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم عِنْدَ ذَلِكَ: «قَاتَلَ اللَّهُ اليَهُودَ؛ إِنَّ اللَّهَ لَمَّا حَرَّمَ شُحُومَهَا، جَمَلُوهُ، ثُمَّ بَاعُوهُ، فَأَكَلُوا ثَمَنَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2236)، ومسلم (1581).\n", "hadith_no": 1}], "c": "الوَحْدة الأولى: المعامَلات في الإسلام", "f": "", "p": ""}, {"n": 84, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، قَالَ: «نَهَى رَسُولُ اللهِ صلى الله عليه وسلم عَنْ بَيْعِ الْحَصَاةِ، وَعَنْ بَيْعِ الْغَرَرِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (1513).\n", "hadith_no": 1}], "c": "الوَحْدة الأولى: المعامَلات في الإسلام", "f": "", "p": ""}, {"n": 85, "t": "عَنِ ابْنِ عَبَّاسٍ رضي اللَّه عنهمَا، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «أَلْحِقُوا الفَرَائِضَ بِأَهْلِهَا، فَمَا بَقِيَ فَهُوَ لِأَوْلَى رَجُلٍ ذَكَرٍ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6732)، ومسلم (1615).\n", "hadith_no": 1}], "c": "الوَحْدة الأولى: المعامَلات في الإسلام", "f": "", "p": ""}]}, {"mq": "الباب الثالث: باب المعامَلات", "k": "الوَحْدة الثانية: أحكام الأُسْرة", "hs": [{"n": 86, "t": "عن عبدِ الله بنِ مسعودٍ، قال: كُنَّا مع النبيِّ شَبابًا لا نجدُ شيئًا، فقال لنا رسولُ الله صلى الله عليه وسلم: «يا معشرَ الشباب، مَن استطاع الباءةَ، فليتزوَّجْ؛ فإنه أغَضُّ للبصر، وأحصَنُ للفَرْجِ، ومَن لم يستطِعْ، فعليه بالصَّوْمِ؛ فإنه له وِجاءٌ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (5066)، ومسلم (1400).\n", "hadith_no": 1}], "c": "أوَّلًا: النِّكاح والعِشرة", "f": "", "p": ""}, {"n": 87, "t": "عن أبي هُرَيرة رضي الله عنه، قال: قال رسول الله صلى الله عليه وسلم: «تُنْكَحُ الْمَرْأَةُ لأَرْبَعٍ: لِمَالِهَا، وَلِحَسَبِهَا، وَجَمَالِهَا، وَلِدِينِهَا، فَاظْفَرْ بِذَاتِ الدِّينِ تَرِبَتْ يَدَاكَ!» {[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (5090)، ومسلم (1466).\n", "hadith_no": 1}], "c": "أوَّلًا: النِّكاح والعِشرة", "f": "", "p": ""}, {"n": 88, "t": "عَنْ عَائِشَةَ، زَوْجِ النَّبِيِّ صلى الله عليه وسلم: أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ عِنْدَهَا، وَأَنَّهَا سَمِعَتْ صَوْتَ رَجُلٍ يَسْتَأْذِنُ فِي بَيْتِ حَفْصَةَ، قَالَتْ: فَقُلْتُ: يَا رَسُولَ اللَّهِ، هَذَا رَجُلٌ يَسْتَأْذِنُ فِي بَيْتِكَ، فَقَالَ النَّبِيُّ صلى الله عليه وسلم: «أُرَاهُ فُلاَنًا»، لِعَمِّ حَفْصَةَ مِنَ الرَّضَاعَةِ، قَالَتْ عَائِشَةُ: لَوْ كَانَ فُلاَنٌ حَيًّا - لِعَمِّهَا مِنَ الرَّضَاعَةِ - دَخَلَ عَلَيَّ؟ فَقَالَ: «نَعَمْ، الرَّضَاعَةُ تُحَرِّمُ مَا تُحَرِّمُ الوِلاَدَةُ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2646)، ومسلم (1444).\n", "hadith_no": 1}], "c": "ثالثًا: من أحكام الرضاعة والطلاق والعدَّة", "f": "", "p": ""}, {"n": 89, "t": "عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ رضي اللَّه عنهمَا، قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «إِنَّ إِبْلِيسَ يَضَعُ عَرْشَهُ عَلَى الْمَاءِ، ثُمَّ يَبْعَثُ سَرَايَاهُ، فَأَدْنَاهُمْ مِنْهُ مَنْزِلَةً أَعْظَمُهُمْ فِتْنَةً، يَجِيءُ أَحَدُهُمْ فَيَقُولُ: فَعَلْتُ كَذَا وَكَذَا، فَيَقُولُ: مَا صَنَعْتَ شَيْئًا، قَالَ: ثُمَّ يَجِيءُ أَحَدُهُمْ فَيَقُولُ: مَا تَرَكْتُهُ حَتَّى فَرَّقْتُ بَيْنَهُ وَبَيْنَ امْرَأَتِهِ، قَالَ: فَيُدْنِيهِ مِنْهُ وَيَقُولُ: نِعْمَ أَنْتَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2813).\n", "hadith_no": 1}], "c": "ثالثًا: من أحكام الرضاعة والطلاق والعدَّة", "f": "", "p": ""}, {"n": 90, "t": "عَنْ أُمِّ عَطِيَّةَ، أَنَّ رَسُولَ اللهِ صلى الله عليه وسلم قَالَ: «لَا تُحِدُّ امْرَأَةٌ عَلَى مَيِّتٍ فَوْقَ ثَلَاثٍ، إِلَّا عَلَى زَوْجٍ، أَرْبَعَةَ أَشْهُرٍ وَعَشْرًا، وَلَا تَلْبَسُ ثَوْبًا مَصْبُوغًا، إِلَّا ثَوْبَ عَصْبٍ، وَلَا تَكْتَحِلُ، وَلَا تَمَسُّ طِيبًا، إِلَّا إِذَا طَهُرَتْ، نُبْذَةً مِنْ قُسْطٍ أَوْ أَظْفَارٍ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (313)، ومسلم (938).\n", "hadith_no": 1}], "c": "ثالثًا: من أحكام الرضاعة والطلاق والعدَّة", "f": "", "p": ""}]}, {"mq": "الباب الثالث: باب المعامَلات", "k": "الوَحْدة الثالثة: الحقوق والأخلاق", "hs": [{"n": 91, "t": "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو - رضي اللَّه عنهمَا - عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ، وَالْمُهَاجِرُ مَنْ هَجَرَ مَا نَهَى اللَّهُ عَنْهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (10). \n", "hadith_no": 1}], "c": "أوَّلًا: حُرمة الدماء، والأموال، والأعراض", "f": "", "p": ""}, {"n": 92, "t": "عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ - رضي اللَّه عنهمَا - أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «مَا حَقُّ امْرِئٍ مُسْلِمٍ لَهُ شَيْءٌ يُوصِي فِيهِ، يَبِيتُ لَيْلَتَيْنِ إِلَّا وَوَصِيَّتُهُ مَكْتُوبَةٌ عِنْدَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (2738) ومسلم (1627).\n", "hadith_no": 1}], "c": "أوَّلًا: حُرمة الدماء، والأموال، والأعراض", "f": "", "p": ""}, {"n": 93, "t": "عن جابرِ بنِ عبدِ اللهِ – رضي الله عنه – أن رسول الله صلى الله عليه وسلم خَطَب النَّاسَ في الحجِّ فقال: «إِنَّ دِمَاءَكُمْ وَأَمْوَالَكُمْ حَرَامٌ عَلَيْكُمْ، كَحُرْمَةِ يَوْمِكُمْ هَذَا، فِي شَهْرِكُمْ هَذَا، فِي بَلَدِكُمْ هَذَا، أَلَا كُلُّ شَيْءٍ مِنْ أَمْرِ الْجَاهِلِيَّةِ تَحْتَ قَدَمَيَّ مَوْضُوعٌ، وَدِمَاءُ الْجَاهِلِيَّةِ مَوْضُوعَةٌ، وَإِنَّ أَوَّلَ دَمٍ أَضَعُ مِنْ دِمَائِنَا دَمُ ابْنِ رَبِيعَةَ بْنِ الْحَارِثِ، كَانَ مُسْتَرْضِعًا فِي بَنِي سَعْدٍ فَقَتَلَتْهُ هُذَيْلٌ، وَرِبَا الْجَاهِلِيَّةِ مَوْضُوعٌ، وَأَوَّلُ رِبًا أَضَعُ رِبَانَا رِبَا عَبَّاسِ بْنِ عَبْدِ الْمُطَّلِبِ، فَإِنَّهُ مَوْضُوعٌ كُلُّهُ، فَاتَّقُوا اللهَ فِي النِّسَاءِ، فَإِنَّكُمْ أَخَذْتُمُوهُنَّ بِأَمَانِ اللهِ، وَاسْتَحْلَلْتُمْ فُرُوجَهُنَّ بِكَلِمَةِ اللهِ، وَلَكُمْ عَلَيْهِنَّ أَنْ لَا يُوطِئْنَ فُرُشَكُمْ أَحَدًا تَكْرَهُونَهُ، فَإِنْ فَعَلْنَ ذَلِكَ فَاضْرِبُوهُنَّ ضَرْبًا غَيْرَ مُبَرِّحٍ، وَلَهُنَّ عَلَيْكُمْ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ، وَقَدْ تَرَكْتُ فِيكُمْ مَا لَنْ تَضِلُّوا بَعْدَهُ إِنِ اعْتَصَمْتُمْ بِهِ، كِتَابُ اللهِ، وَأَنْتُمْ تُسْأَلُونَ عَنِّي، فَمَا أَنْتُمْ قَائِلُونَ؟» قَالُوا: نَشْهَدُ أَنَّكَ قَدْ بَلَّغْتَ وَأَدَّيْتَ وَنَصَحْتَ، فَقَالَ: بِإِصْبَعِهِ السَّبَّابَةِ، يَرْفَعُهَا إِلَى السَّمَاءِ وَيَنْكُتُهَا إِلَى النَّاسِ: «اللهُمَّ، اشْهَدْ، اللهُمَّ، اشْهَدْ» ثَلَاثَ مَرَّاتٍ{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (1218)، وهو جزءٌ من حديث جابر الطويل.\n", "hadith_no": 1}], "c": "أوَّلًا: حُرمة الدماء، والأموال، والأعراض", "f": "", "p": ""}, {"n": 94, "t": "عَنْ عُبَادَةَ بْنِ الصَّامِتِ - رضي اللَّه عنه - قَالَ: بَايَعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم فِي رَهْطٍ، فَقَالَ: «أُبَايِعُكُمْ عَلَى أَنْ لاَ تُشْرِكُوا بِاللَّهِ شَيْئًا، وَلاَ تَسْرِقُوا، وَلاَ تَزْنُوا، وَلاَ تَقْتُلُوا أَوْلاَدَكُمْ، وَلاَ تَأْتُوا بِبُهْتَانٍ تَفْتَرُونَهُ بَيْنَ أَيْدِيكُمْ وَأَرْجُلِكُمْ، وَلاَ تَعْصُونِي فِي مَعْرُوفٍ، فَمَنْ وَفَى مِنْكُمْ، فَأَجْرُهُ عَلَى اللَّهِ، وَمَنْ أَصَابَ مِنْ ذَلِكَ شَيْئًا فَأُخِذَ بِهِ فِي الدُّنْيَا، فَهُوَ كَفَّارَةٌ لَهُ وَطَهُورٌ، وَمَنْ سَتَرَهُ اللَّهُ، فَذَلِكَ إِلَى اللَّهِ، إِنْ شَاءَ عَذَّبَهُ، وَإِنْ شَاءَ غَفَرَ لَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6801). \n", "hadith_no": 1}], "c": "أوَّلًا: حُرمة الدماء، والأموال، والأعراض", "f": "", "p": ""}, {"n": 95, "t": "عن ابن عمرَ رضي الله عنهما، عن النبيِّ صلى الله عليه وسلم أنه قال: «عَلَى الْمَرْءِ الْمُسْلِمِ السَّمْعُ وَالطَّاعَةُ فِيمَا أَحَبَّ وَكَرِهَ؛ إِلَّا أَنْ يُؤْمَرَ بِمَعْصِيَةٍ، فَإِنْ أُمِرَ بِمَعْصِيَةٍ، فَلَا سَمْعَ وَلَا طَاعَةَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (7144)، مسلم (1839). \n", "hadith_no": 1}], "c": "أوَّلًا: حُرمة الدماء، والأموال، والأعراض", "f": "", "p": ""}, {"n": 96, "t": "عَنْ أَنَسٍ رضي الله عنه، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «لا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (13)، ومسلم (45).\n", "hadith_no": 1}], "c": "ثانيًا: حقُّ المسلم على المسلم", "f": "", "p": ""}, {"n": 97, "t": "عَنِ ابْنِ عُمَرَ رضي اللَّه عنهمَا، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ، حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6015)، ومسلم (2625).\n", "hadith_no": 1}], "c": "ثانيًا: حقُّ المسلم على المسلم", "f": "", "p": ""}, {"n": 98, "t": "عَنْ أَبِي هُرَيْرَةَ، قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا، نَفَّسَ اللهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ، وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ، يَسَّرَ اللهُ عَلَيْهِ فِي الدُّنْيَا وَالْآخِرَةِ، وَمَنْ سَتَرَ مُسْلِمًا، سَتَرَهُ اللهُ فِي الدُّنْيَا وَالْآخِرَةِ، وَاللهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ، وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا، سَهَّلَ اللهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ، وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللهِ، يَتْلُونَ كِتَابَ اللهِ، وَيَتَدَارَسُونَهُ بَيْنَهُمْ، إِلَّا نَزَلَتْ عَلَيْهِمِ السَّكِينَةُ، وَغَشِيَتْهُمُ الرَّحْمَةُ، وَحَفَّتْهُمُ الْمَلَائِكَةُ، وَذَكَرَهُمُ اللهُ فِيمَنْ عِنْدَهُ، وَمَنْ بَطَّأَ بِهِ عَمَلُهُ، لَمْ يُسْرِعْ بِهِ نَسَبُهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2699).\n", "hadith_no": 1}], "c": "ثانيًا: حقُّ المسلم على المسلم", "f": "", "p": ""}, {"n": 99, "t": "عن جَرِيرِ بْنِ عَبْدِ اللَّهِ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «مَنْ لاَ يَرْحَمُ لاَ يُرْحَمُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6013)، ومسلم (2319).\n", "hadith_no": 1}], "c": "ثانيًا: حقُّ المسلم على المسلم", "f": "", "p": ""}, {"n": 100, "t": "عَنِ النُّعْمَانِ بْنِ بَشِيرٍ، قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ، وَتَرَاحُمِهِمْ، وَتَعَاطُفِهِمْ، مَثَلُ الْجَسَدِ، إِذَا اشْتَكَى مِنْهُ عُضْوٌ، تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6011)، ومسلم (2586).\n", "hadith_no": 1}], "c": "ثانيًا: حقُّ المسلم على المسلم", "f": "", "p": ""}, {"n": 101, "t": "عَنْ أَبِي شُرَيْحٍ الكَعْبيِّ رضي الله عنه، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ: «مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَاليَوْمِ الآخِرِ فَلْيُكْرِمْ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَاليَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ جَائِزَتَهُ» قَالَ: وَمَا جَائِزَتُهُ يَا رَسُولَ اللَّهِ؟ قَالَ: «يَوْمٌ وَلَيْلَةٌ، وَالضِّيَافَةُ ثَلاثَةُ أَيَّامٍ، فَمَا كَانَ وَرَاءَ ذَلِكَ فَهُوَ صَدَقَةٌ عَلَيْهِ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَاليَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6019)، ومسلم (48).\n", "hadith_no": 1}], "c": "ثالثًا: الأخلاق في الإسلام", "f": "", "p": ""}, {"n": 102, "t": "عن أبي هريرة رضي الله عنه: أنَّ رَجُلًا قالَ للنبيِّ صلى الله عليه وسلم: أوْصِنِي، قَالَ: «لاَ تَغْضَبْ»، فَرَدَّدَ مِرَارًا، قَالَ: «لاَ تَغْضَبْ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6116).\n", "hadith_no": 1}], "c": "ثالثًا: الأخلاق في الإسلام", "f": "", "p": ""}, {"n": 103, "t": "عَنْ شَدَّادِ بْنِ أَوْسٍ، قَالَ: ثِنْتَانِ حَفِظْتُهُمَا عَنْ رَسُولِ اللهِ صلى الله عليه وسلم قال: «إِنَّ اللهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا الْقِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذَّبْحَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، فَلْيُرِحْ ذَبِيحَتَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (1955).\n", "hadith_no": 1}], "c": "ثالثًا: الأخلاق في الإسلام", "f": "", "p": ""}, {"n": 104, "t": "عَنْ أَبِي مَسْعُودٍ، قَالَ النَّبِيُّ صلى الله عليه وسلم: «إِنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلاَمِ النُّبُوَّةِ، إِذَا لَمْ تَسْتَحْيِ فَاصْنَعْ مَا شِئْتَ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (3484).\n", "hadith_no": 1}], "c": "ثالثًا: الأخلاق في الإسلام", "f": "", "p": ""}, {"n": 105, "t": "عَنْ عَبْدِ اللَّهِ بن مسعود رَضِيَ اللَّهُ عَنْهُ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «إِنَّ الصِّدْقَ يَهْدِي إِلَى البِرِّ، وَإِنَّ البِرَّ يَهْدِي إِلَى الجَنَّةِ، وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يَكُونَ صِدِّيقًا. وَإِنَّ الكَذِبَ يَهْدِي إِلَى الفُجُورِ، وَإِنَّ الفُجُورَ يَهْدِي إِلَى النَّارِ، وَإِنَّ الرَّجُلَ لَيَكْذِبُ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6094)، ومسلم (2607).\n", "hadith_no": 1}], "c": "ثالثًا: الأخلاق في الإسلام", "f": "", "p": ""}]}, {"mq": "الباب الرابع: الأوامر والنواهي", "k": "الوحدة الأولى: الواجبات في الإسلام", "hs": [{"n": 106, "t": "عَنْ عَبْدِ اللهِ بْنِ مَسْعُودٍ رضي الله عنه قَالَ: سَأَلْتُ النَّبِ‍يَّ صلى الله عليه وسلم: أَيُّ الْعَمَلِ أَحَبُّ إِلى اللَّهِ؟ قَالَ: «الصَّلاةُ عَلى وقْتِهَا»، قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «ثُمَّ بِرُّ الْوَالِدَيْنِ»، قَالَ: ثُمَّ أَيٌّ؟ قَالَ: «الجِهَادُ في سَبيل اللهِ». قَالَ: حَدَّثَنِ‍ي بِهِنَّ، ولَوِ اسْتَزَدْتُهُ لَزَادَنِ‍ي{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (527)، ومسلم (85).\n", "hadith_no": 1}], "c": "الوحدة الأولى: الواجبات في الإسلام", "f": "", "p": ""}]}, {"mq": "الباب الرابع: الأوامر والنواهي", "k": "الوحدة الثانية: المحرَّمات في الإسلام", "hs": [{"n": 107, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، عَنِ النَّبِيِّ صلى الله عليه وسلم، قَالَ: «اجْتَنِبُوا السَّبْعَ المُوبِقَاتِ» قَالُوا: يَا رَسُولَ اللَّهِ، وَمَا هُنَّ؟ قَالَ: «الشِّرْكُ بِاللَّهِ، وَالسِّحْرُ، وَقَتْلُ النَّفْسِ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالحَقِّ، وَأَكْلُ الرِّبَا، وَأَكْلُ مَالِ اليَتِيمِ، وَالتَّوَلِّي يَوْمَ الزَّحْفِ، وَقَذْفُ المُحْصَنَاتِ المُؤْمِنَاتِ الغَافِلاَتِ»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6857)، ومسلم (89).\n", "hadith_no": 1}], "c": "الوحدة الثانية: المحرَّمات في الإسلام", "f": "", "p": ""}, {"n": 108, "t": "عَنْ مُعَاوِيَةَ قَالَ: سَمِعْتُ رَسُولَ الله صلى الله عليه وسلم يَقُولُ: «كُلُّ ذَنْبٍ عَسَى الله أَنْ يَغْفِرَهُ؛ إِلَّا الرَّجُلُ يَقْتُلُ المُؤْمِنَ مُتَعَمِّدًا، أَوْ الرَّجُلُ يَمُوتُ كَافِرًا»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه النسائيُّ (3984)، وصححه الألبانيُّ في \"الصحيحة\" (511).\n", "hadith_no": 1}], "c": "الوحدة الثانية: المحرَّمات في الإسلام", "f": "", "p": ""}, {"n": 109, "t": "عن النَّوَّاس بن سَمْعانَ رضي الله عنه قال: سألتُ رسولَ الله صلى الله عليه وسلم عن البِرِّ والإثمِ، فَقالَ: «البِرُّ حُسْنُ الخُلُقِ، والإِثْمُ ما حاكَ في صَدْرِكَ، وَكَرِهْتَ أَنْ يَطَّلِعَ عليه النَّاسُ»{[1]}.<br/>ترجمة راوي الحديث: </b><br/>هو: النَّوَّاسُ بنُ سَمْعانَ بنِ خالد الكلابيُّ، سكَن الشام، وأبوه سَمْعانُ بنُ خالدٍ، وفَد على النبيِّ صلى الله عليه وسلم وأسلم، وأهداه نَعلَيه، فقَبلهما النبيُّ صلى الله عليه وسلم ودعا له، وزوَّج سمعانُ النبيَّ صلى الله عليه وسلم أختَه، فلما دخلت على النبيِّ صلى الله عليه وسلم تعوَّذت منه، فترَكها، روى عنه: جُبيرُ بنُ نُفيرٍ، وبُسْرُ بنُ عُبيد الله، تُوفِّي سنةَ (50هـ){[2]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (2553).\n", "hadith_no": 1}, {"footnotes": " تُراجع ترجمته في: \"معرفة الصحابة\" لأبي نعيم (5/ 2701)، و\"الاستيعاب في معرفة الأصحاب\" لابن عبد البر (4/ 1534)، و\"أسد الغابة\" لابن الأثير (4/ 591).\n", "hadith_no": 2}], "c": "الوحدة الثانية: المحرَّمات في الإسلام", "f": "", "p": ""}, {"n": 110, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ: «إِنَّ اللَّهَ تَجَاوَزَ عَنْ أُمَّتِي مَا حَدَّثَتْ بِهِ أَنْفُسَهَا، مَا لَمْ تَعْمَلْ أَوْ تَتَكَلَّمْ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (5269)، ومسلم (127).\n", "hadith_no": 1}], "c": "الوحدة الثانية: المحرَّمات في الإسلام", "f": "", "p": ""}, {"n": 111, "t": "عَنْ سَعِيدِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِيهِ، عَنْ أَبِي مُوسَى الأَشْعَرِيِّ - رَضِيَ اللَّهُ عَنْهُ - أَنَّ النَّبِيَّ صلى الله عليه وسلم بَعَثَهُ إِلَى اليَمَنِ، فَسَأَلَهُ عَنْ أَشْرِبَةٍ تُصْنَعُ بِهَا، فَقَالَ: «وَمَا هِيَ؟» قَالَ: البِتْعُ وَالْمِزْرُ، فَقُلْتُ لِأَبِي بُرْدَةَ: مَا البِتْعُ؟ قَالَ: نَبِيذُ العَسَلِ، وَالْمِزْرُ نَبِيذُ الشَّعِيرِ، فَقَالَ: «كُلُّ مُسْكِرٍ حَرَامٌ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (4343).\n", "hadith_no": 1}], "c": "الوحدة الثانية: المحرَّمات في الإسلام", "f": "", "p": ""}, {"n": 112, "t": "عَنْ أَبِي هُرَيْرَةَ أَنَّ رَسُولَ اللهِ صلى الله عليه وسلم مَرَّ عَلَى صُبْرَةِ طَعَامٍ، فَأَدْخَلَ يَدَهُ فِيهَا، فَنَالَتْ أَصَابِعُهُ بَلَلًا، فَقَالَ: «مَا هَذَا يَا صَاحِبَ الطَّعَامِ؟» قَالَ: أَصَابَتْهُ السَّمَاءُ يَا رَسُولَ اللهِ، قَالَ: «أَفَلَا جَعَلْتَهُ فَوْقَ الطَّعَامِ كَيْ يَرَاهُ النَّاسُ؟! مَنْ غَشَّ فَلَيْسَ مِنِّي»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (102).\n", "hadith_no": 1}], "c": "الوحدة الثانية: المحرَّمات في الإسلام", "f": "", "p": ""}]}, {"mq": "الباب الرابع: الأوامر والنواهي", "k": "الوحدة الثالثة: المستحَبَّات والمكروهات", "hs": [{"n": 113, "t": "عَنِ ابْنِ عَبَّاسٍ، عَنْ رَسُولِ اللهِ صلى الله عليه وسلم فِيمَا يَرْوِي عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، قَالَ: «إِنَّ اللهَ كَتَبَ الْحَسَنَاتِ وَالسَّيِّئَاتِ، ثُمَّ بَيَّنَ ذَلِكَ، فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا، كَتَبَهَا اللهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا، كَتَبَهَا اللهُ عَزَّ وَجَلَّ عِنْدَهُ عَشْرَ حَسَنَاتٍ إِلَى سَبْعِمِائَةِ ضِعْفٍ إِلَى أَضْعَافٍ كَثِيرَةٍ، وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا، كَتَبَهَا اللهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا، كَتَبَهَا اللهُ سَيِّئَةً وَاحِدَةً»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6491)، ومسلم (131).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 114, "t": "عَنْ أَبِي هُرَيْرَةَ رضي الله عنه، قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «إنَّ اللَّهَ قَالَ: مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالحَرْبِ، وَمَا تَقَرَّبَ إِلَيَّ عَبْدِي بِشَيْءٍ أَحَبَّ إِلَيَّ مِمَّا افْتَرَضْتُ عَلَيْهِ، وَمَا يَزَالُ عَبْدِي يَتَقَرَّبُ إِلَيَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ، فَإِذَا أَحْبَبْتُهُ: كُنْتُ سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ، وَيَدَهُ الَّتِي يَبْطِشُ بِهَا، وَرِجْلَهُ الَّتِي يَمْشِي بِهَا، وَإِنْ سَأَلَنِي لَأُعْطِيَنَّهُ، وَلَئِنِ اسْتَعَاذَنِي لَأُعِيذَنَّهُ، وَمَا تَرَدَّدْتُ عَنْ شَيْءٍ أَنَا فَاعِلُهُ تَرَدُّدِي عَنْ نَفْسِ المُؤْمِنِ، يَكْرَهُ المَوْتَ وَأَنَا أَكْرَهُ مَسَاءَتَهُ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6502).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 115, "t": "عَنْ أَبِي مَالِكٍ الْأَشْعَرِيِّ رضي الله عنه قَالَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: «الطُّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ للهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللهِ وَالْحَمْدُ للهِ تَمْلَآنِ - أَوْ تَمْلَأُ - مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ، كُلُّ النَّاسِ يَغْدُو، فَبَايِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا»{[1]}. ", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه مسلم (223).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 116, "t": "عَنْ أَبِي مُوسَـى الأشعريِّ رضي الله عنه، عَنِ النَّبِيِّ صلى الله عليه وسلم، قَالَ: «مَثَلُ الْبَيْتِ الَّذِي يُذْكَرُ اللهُ فِيهِ، وَالْبَيْتِ الَّذِي لَا يُذْكَرُ اللهُ فِيهِ، مَثَلُ الْـحَيِّ وَالْـمَيِّتِ». <br/>وَلِلْبُخَارِيِّ: «مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ، وَالَّذِي لَا يَذْكُرُ رَبَّهُ، مَثَلُ الحَيِّ وَالـمَيِّتِ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (6407)، ومسلم (779).\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكروهات", "f": "", "p": ""}, {"n": 117, "t": "عَنْ ابْنِ عَبَّاسٍ رضي الله عنهما قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَا مِنْ أَيَّامٍ الْعَمَلُ الصَّالِحُ فِيهَا أَحَبُّ إِلَى اللَّهِ مِنْ هَذِهِ الْأَيَّامِ» يَعْنِي أَيَّامَ الْعَشْرِ، قَالُوا: يَا رَسُولَ اللَّهِ، وَلَا الْجِهَادُ فِي سَبِيلِ اللَّهِ؟ قَالَ: «وَلَا الْجِهَادُ فِي سَبِيلِ اللَّهِ، إِلَّا رَجُلٌ خَرَجَ بِنَفْسِهِ وَمَالِهِ، فَلَمْ يَرْجِعْ مِنْ ذَلِكَ بِشَيْءٍ»{[1]}.", "ref": "", "h": "", "k": "", "fn": [{"footnotes": " رواه البخاريُّ (969)، وأحمد (3228)، والترمذيُّ (757)، وأبو داود (2438) واللفظ له.\n", "hadith_no": 1}], "c": "الوحدة الثالثة: المستحَبَّات والمكر
